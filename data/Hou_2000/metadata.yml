taxonomic_updates: .na
exclude_observations: .na
questions:
  question1: |
    Leaflet number of compound leaves. Pairs of leaflets of a paripinnate
    leaf ("Leaves each with 3--5 pairs of leaflets") are scored as
    leaflet_count in unit pairs, which config/unit_conversions.csv doubles,
    as for fern pinna pairs (SKILL.md step 4, Ferns); single leaflets
    ("each with (1--)2(--3) leaflets", imparipinnate Crudia, Dialium,
    Koompassia) are counted in {count}. For the bipinnate Peltophorum and
    Sympetalandra unijuga, pairs of pinnae (entity_measured pinnae) and
    pairs of leaflets per pinna (entity_measured leaflets per pinna) are
    both leaflet_count rows; the leaflet total of the leaf is not computed.
    128 rows. This is provisional; Kochummen_1995 left pairs unmapped and
    asked whether to convert them. Confirm these mappings, or decide another
    rule for pinnae and per-pinna counts.
  question2: |
    Leaflet characters on leaf traits. Shape, base, apex and hairs of the
    leaflets are scored as leaf_shape, leaf_base_shape, leaf_apex_shape and
    leaf_hairs_adult_leaves with entity_measured leaflet (as Kochummen_1995);
    leaflet size uses leaflet_length and leaflet_width; "Leaves 10--14 cm
    long" is leaf_length with entity_measured compound leaf (7 rows).
    Unifoliolate leaves (Dialium procerum, Uittienia) are leaf_compoundness
    compound with leaflet sizes. Confirm, or score leaflet shape only when a
    leaflet trait exists.
  question3: |
    Fruit type. "pod" is scored as fruit_type legume (Copaifera "dehiscent
    pods", Crudia "Fruits (pods)", subfamily "usually a pod"; new shared
    dictionary row) and "drupaceous" as drupe (shared row; Dialium and
    Uittienia, indehiscent with a crustaceous exocarp). The other genera
    print no type word (Afzelia, Intsia, Sindora, Saraca, Sympetalandra:
    dehiscent 2-valved woody pods; Cassia, Cynometra, Peltophorum:
    indehiscent; Koompassia: winged) and get no fruit_type. Should all
    Caesalpinioideae fruits be legume (dehiscent) or legume_indehiscent,
    and should drupaceous legumes be drupe or legume_indehiscent?
  question4: |
    Winged fruit sizes. Koompassia "8--12.5 x 2--3.5 cm (including the
    wing)" and Peltophorum "10--15 x 2--4 cm (including wing-like extension
    of 4--5 mm wide)" are scored as fruit_length and fruit_width with a
    note that the wing is included (5 species). Confirm, or keep sizes
    that include a wing unmapped as for Dipterocarpaceae calyx wings
    (Ashton_2004).
  question5: |
    Hypanthium length is scored as flower_tube_length with entity_measured
    hypanthium (28 rows), following the provisional Prance_2012 question 2
    rule for the receptacle tube; this is a second family for that rule.
    Four values are below the traits.yml minimum and will be excluded:
    hypanthium "c. 0.6 mm" (Crudia wrayi; minimum 1 mm) and bract or
    bracteole lengths of 0.5--0.75 mm (Crudia beccarii, C. venenosa; same
    issue as Soepadmo_2000 question 2). Confirm the mapping and decide on
    the minima centrally.
  question6: |
    Varieties in a key. Dialium indum var. indum and var. bursa and D.
    kunstleri var. kunstleri and var. trifoliolatum appear only as
    annotations in a key to varieties (distribution and ecology). They
    inherit the species rows (126 rows, inferred_from_species), as in
    Ashton_2004; Kochummen_1995 and Kochummen_2000 kept such taxa unmapped
    (Kochummen_2000 question 3 asks for one rule). Confirm.
  question7: |
    Subfamily rank. The treatment is a subfamily of Leguminosae; its
    description is recorded under taxon_name Caesalpinioideae with
    taxon_rank subfamily and trait_scoring_method inferred_from_family
    (flora_scoring_method() now treats subfamily as family rank). Its
    copy-down members are all genera of the treatment. Confirm the name and
    rank for the taxonomic alignment step, and whether copied values should
    say inferred_from_subfamily (not a level now).
  question8: |
    Key-only genera. Bauhinia (about 28 species in Sabah and Sarawak),
    Caesalpinia (6) and Pterolobium (1) have short genus descriptions inside
    the key to genera (pp. 120--121) and no species treatments. Keys are not
    trait evidence, so they are not scored (raw/taxon_flags.csv). Should the
    genus statements be scored at genus rank, or left for a future climber
    treatment?
  question9: |
    Peltophorum dasyrhachis seeds "4--8, flat, 0.1--1.2 x 0.5 cm" (p. 159).
    A 1 mm seed length is unlikely next to P. pterocarpum "1--1.2 x 0.5 cm";
    0.1 may be a typo for 1. It is scored as printed (seed_length minimum
    0.1 cm). Fix to 1, drop the minimum, or keep?
  question10: |
    Cynometra ramiflora var. ramiflora leaflets
    "(1.2--)4.5--(6.5--)20 x (0.5--)2.5--(3.5--)7 cm" (p. 142) cannot be read
    as one range and stay unmapped. Is the typical range 6.5--20 x 3.5--7 cm
    with extremes 1.2 and 0.5 cm, or 4.5--20 x 2.5--7 cm?
  question11: |
    Phenology wording. Dialium platysepalum "fruiting heaviest in
    July--October" is fruiting_time July--October with commonness qualifier
    'heaviest'. Koompassia excelsa "Flowering at irregular intervals, on
    average once in 5 to 6 (or even 25) years" is unmapped (no trait for
    flowering interval; not a stated cue). "Flowering and fruiting almost
    all year round" (Afzelia rhomboidea) is not scored as a hedge. Confirm.
  question12: |
    Sizes printed as three dimensions ("Fruits 5--8 x 2.5--3.5 x 1.8--2.5
    cm", "Seeds 1.7--3 x 1.5--2.5 x 1 cm") are read as length, width and
    thickness: the third goes to fruit_height and seed_height (11 rows). The
    first dimension is taken as length throughout, also for transversely
    oblong seeds (Crudia, "2--2.2 x 3--3.7 cm"). Confirm.
