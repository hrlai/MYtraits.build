source:
  primary:
    key: Hou_2000
    bibtype: InBook
    year: 2000
    author: Ding Hou
    title: Leguminosae-Caesalpinioideae
    booktitle: Tree Flora of Sabah and Sarawak, Volume 3
    editor: E. Soepadmo and L. G. Saw
    publisher:
      Sabah Forestry Department and Forest Research Institute Malaysia and
      Sarawak Forestry Department
    place: Kepong, Malaysia
    pages: 119--180
    isbn: 983-2181-06-2
    doi: 10.26525/TFSS3002
contributors:
  data_collectors:
    - last_name: Hou
      given_name: Ding
      ORCID: .na
      affiliation: Rijksherbarium/Hortus Botanicus, Leiden, the Netherlands
  dataset_curators: Hao Ran Lai
dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '2000'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description: |
    Morphological and phenological traits of the Leguminosae subfamily
    Caesalpinioideae of Sabah and Sarawak (14 described genera, 42 species,
    6 infraspecific taxa), extracted from the treatment in the Tree Flora of
    Sabah and Sarawak.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: |
    The PDF (inst/extdata/myflora/pdf/TFSS/LeguminosaeCaesalpinioideae.pdf,
    PDF pages 7--68, printed 119--180; printed = PDF + 112) is the
    born-digital 2007 electronic edition (L. G. Saw and B. Aslina). Rows come
    from its text layer (flora_read_pdf_lines()); no routine image check was
    made. flora_layer_flags() flagged only the front matter and the 15 figure
    plates (low text, no printed page number in the layer) and no bad
    glyphs; the plate pages were rendered and their captions read for figure
    specimens only. raw/segment_source.R segments the text;
    raw/build_trait_data.R splits each subfamily, genus and species
    description into sentences, ';' pieces and ',' clauses, assigns each
    clause to an organ and scores configured traits. The leaf sentence gives
    the whole compound leaf (length, leaflet or pinna number, petiole); the
    'Leaflets ...' sentence gives the leaflet (shape, size, base, apex,
    hairs) with entity_measured leaflet. Every unscored clause stays in
    raw/trait_data.csv as an unmapped row, as do the Distribution, Ecology,
    Uses, vernacular-name and key-annotation paragraphs (one row per
    sentence). Months are scored from species Ecology text. Unqualified
    single-level subfamily and genus values are copied to member taxa silent
    on the trait when every member that states the trait agrees
    (trait_scoring_method inferred_from_family / inferred_from_genus);
    statements naming a genus or 'some' members are not copied. Keys and
    figure captions are not trait evidence.
  original_file: |
    LeguminosaeCaesalpinioideae.pdf (Ding Hou 2000, Tree Flora of Sabah and
    Sarawak vol. 3, pp. 119--180; electronic edition 2007)
  notes: |
    data.csv is raw/trait_data.csv (written by raw/build_trait_data.R) with
    the columns added by flora_make_data(). Taxon names are as printed. The
    subfamily description is recorded under taxon_name Caesalpinioideae
    (taxon_rank subfamily); its values score as inferred_from_family. All 42
    species headed in the treatment are processed (Afzelia 1, Cassia 1,
    Copaifera 1, Crudia 10, Cynometra 3, Dialium 5, Intsia 2, Koompassia 2,
    Leucostegane 1, Peltophorum 3, Saraca 2, Sindora 8, Sympetalandra 2,
    Uittienia 1). Cassia javanica and Cynometra ramiflora have no species
    description: the one infraspecific taxon in Sabah and Sarawak (subsp.
    nodosa, var. ramiflora) carries it and is scored at its own rank. The
    two varieties each of Dialium indum and D. kunstleri are annotations in
    a key to varieties (citations, distribution and ecology); they inherit
    the species rows. Bauhinia, Caesalpinia and Pterolobium are described
    only inside the key to genera and are not scored (raw/taxon_flags.csv);
    the subfamily Distribution paragraph says 42 species in 17 genera,
    although Bauhinia alone is said to have about 28 species in Sabah and
    Sarawak. Species description values have population region Sabah and
    Sarawak (TFSS guide); copied and inherited values have none. One source
    repair (raw/source_fixes.csv): letter 'l' printed for the digit 1 in the
    young seed of Saraca hullettii. Young, immature and unripe fruits and
    seeds are not scored. Of 4,097 rows in raw/trait_data.csv, 2,108 are
    mapped (1,728 from the taxa's own descriptions and Ecology months, 254
    copied from genus, 126 inherited by key-annotated varieties) and 1,989
    are unmapped: 1,663 description clauses and 326 sentences of
    Distribution, Ecology, Uses, vernacular names and key annotations. The
    most frequent unmapped characters are stipule shape, size and
    persistence; bract shape and persistence; pedicel and petiolule length;
    'petiole and rachis' length; calyx lobe and petal shape, number and
    indumentum; ovary indumentum and length; lateral vein number;
    hypanthium shape; inner bark and sapwood colour; fruit texture, valves
    and spines; altitude, habitat and distribution (summary in
    raw/unmapped_terms.csv). Type and figure specimens are in
    raw/Hou_2000_vouchers.csv (types from the nomenclature paragraphs;
    figure specimens from the plate captions; three illustrations cited as
    types are recorded with a blank status).
identifiers: .na
locations: .na
contexts:
  - context_property: commonness qualifier
    category: entity_context
    var_in: commonness_qualifier
  - context_property: population region
    category: entity_context
    var_in: population_region
  - context_property: entity measured
    category: method_context
    var_in: entity_measured
  - context_property: trait scoring method
    category: method_context
    var_in: trait_scoring_method
traits:
  - var_in: bark_colour
    unit_in: .na
    trait_name: bark_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Outer bark colour from the Bark sentence; inner bark, mottles, patches and tinges excluded; compound colours score every word.
  - var_in: bark_texture
    unit_in: .na
    trait_name: bark_texture
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Outer bark surface from the Bark sentence (smooth, fissured as furrowed, flaky, rough; 'peeling' as papery by the shared dictionary); dippled, scaly, cracked and lenticellate have no level and stay unmapped.
  - var_in: dispersal_appendage
    unit_in: .na
    trait_name: dispersal_appendage
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Aril stated for the seed ('aril yellow, orange, or red', 'Seeds arillate'); wing stated for the indehiscent fruit (Koompassia 'surrounded by a broad, papery wing', Peltophorum 'wing-like extension on each suture'). 'Without aril' and 'not winged' are not scored.
  - var_in: flower_anther_attachment
    unit_in: .na
    trait_name: flower_anther_attachment
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Anther attachment as printed (basifixed, dorsifixed).
  - var_in: flower_anther_dehiscence
    unit_in: .na
    trait_name: flower_anther_dehiscence
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Only longitudinal dehiscence is scored; 'dehiscing by slits', 'slits drawn towards the abaxial side' and pores give no level.
  - var_in: flower_anther_length
    unit_in: unit
    trait_name: flower_anther_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Anther length ('anthers oblong, c. 4.5 mm long').
  - var_in: flower_bract_length
    unit_in: unit
    trait_name: flower_bract_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Length of inflorescence bracts or bracteoles, named in entity_measured; first dimension of 'L x W'.
  - var_in: flower_colour
    unit_in: .na
    trait_name: flower_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Flower or petal colour; 'yellowish white' as white (user rule); 'later pink' (colour change) not scored.
  - var_in: flower_fertile_stamens_count
    unit_in: unit
    trait_name: flower_fertile_stamens_count
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Fertile stamens ('stamens 8--10', 'usually (5--)7 fertile', 'fertile stamens (8--)10(--15)'); counts that include staminodes, 'or fewer' and 'stamens 2 or 6' not scored.
  - var_in: flower_filament_length
    unit_in: unit
    trait_name: flower_filament_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Filament length of the fertile stamens; 'free filaments and staminodes' not scored.
  - var_in: flower_ovules_per_functional_carpel_count
    unit_in: unit
    trait_name: flower_ovules_per_functional_carpel_count
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Ovules per ovary ('ovary 3--5-ovuled'); the legume ovary is one carpel.
  - var_in: flower_perianth_symmetry
    unit_in: .na
    trait_name: flower_perianth_symmetry
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      'bilaterally symmetrical' as zygomorphic; 'radially symmetrical' as actinomorphic_general.
  - var_in: flower_petal_length
    unit_in: unit
    trait_name: flower_petal_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Petal length; first dimension of 'L x W'; petal lamina and claw sizes (Intsia) not scored.
  - var_in: flower_sepal_length
    unit_in: unit
    trait_name: flower_sepal_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Calyx lobe (sepal) length; first dimension of 'L x W'; the calyx tube is the hypanthium (flower_tube_length).
  - var_in: flower_structural_sex_type
    unit_in: .na
    trait_name: flower_structural_sex_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Flowers bisexual (or unisexual) as printed; 'functionally male' is not a structural sex.
  - var_in: flower_style_length
    unit_in: unit
    trait_name: flower_style_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Style length; 'style of two kinds' (Afzelia rhomboidea) not scored.
  - var_in: flower_tube_length
    unit_in: unit
    trait_name: flower_tube_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Hypanthium (receptacle tube) length, entity_measured hypanthium (provisional, Prance_2012 question 2).
  - var_in: flowering_time
    unit_in: .na
    trait_name: flowering_time
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Months named in species Ecology paragraphs ('Flowering in June--July'); 'all the year round' and 'throughout the year' as all months; 'almost all year round' not scored.
  - var_in: fruit_colour
    unit_in: .na
    trait_name: fruit_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Ripe fruit colour ('black when ripe'); colour of hairs, scurf, spines and young fruit excluded.
  - var_in: fruit_dehiscence
    unit_in: .na
    trait_name: fruit_dehiscence
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Dehiscent or indehiscent as printed in the fruit sentence; valve behaviour 'during dehiscence' is not read as a fruit statement.
  - var_in: fruit_height
    unit_in: unit
    trait_name: fruit_height
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Third dimension of a fruit size 'L x W x T' (thickness).
  - var_in: fruit_length
    unit_in: unit
    trait_name: fruit_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      First dimension of the mature fruit (pod) size 'L x W'; Koompassia and Peltophorum sizes include the wing (noted). Young or unripe fruits not scored.
  - var_in: fruit_surface_hairs
    unit_in: .na
    trait_name: fruit_surface_hairs
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Fruit surface glabrous or hairy; glabrescent and 'becoming glabrous' not scored.
  - var_in: fruit_type
    unit_in: .na
    trait_name: fruit_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      'pod' as legume (Hou_2000 question 3); 'drupaceous' as drupe (shared dictionary). Not inferred where the type word is not printed.
  - var_in: fruit_wall_thickness
    unit_in: unit
    trait_name: fruit_wall_thickness
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Pericarp thickness (provisional, DeWilde_2018 question 6).
  - var_in: fruit_width
    unit_in: unit
    trait_name: fruit_width
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Second dimension of the fruit size 'L x W'; fruit diameter as width.
  - var_in: fruiting_time
    unit_in: .na
    trait_name: fruiting_time
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Months named in species Ecology paragraphs ('fruiting in July'); 'mainly' and 'heaviest' kept as commonness qualifier.
  - var_in: inflorescence_length
    unit_in: unit
    trait_name: inflorescence_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Inflorescence length; inflorescence rachis length with entity_measured inflorescence rachis (provisional, Ashton_2004 question 3); branch, peduncle and infructescence rachis lengths not scored.
  - var_in: inflorescence_type
    unit_in: .na
    trait_name: inflorescence_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Inflorescence position (axillary, terminal) and kind (raceme, panicle, spike, corymb) as printed; fasciculate, thyrses and cauliflory have no level.
  - var_in: leaf_apex_shape
    unit_in: .na
    trait_name: leaf_apex_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaflet apex shape, entity_measured leaflet.
  - var_in: leaf_arrangement
    unit_in: .na
    trait_name: leaf_arrangement
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaf arrangement on the twig ('spirally arranged', 'often distichous').
  - var_in: leaf_base_shape
    unit_in: .na
    trait_name: leaf_base_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaflet base shape, entity_measured leaflet; 'unequal' and 'asymmetrical' as oblique.
  - var_in: leaf_compoundness
    unit_in: .na
    trait_name: leaf_compoundness
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Compound when the leaf sentence names leaflets, pinnate or bipinnate leaves; unifoliolate leaves (one leaflet) as compound (shared dictionary, Adema_1996 question).
  - var_in: leaf_hairs_adult_leaves
    unit_in: .na
    trait_name: leaf_hairs_adult_leaves
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaf or leaflet surfaces: hairy when a surface is hairy, glabrous when both are; not scored when a surface is glabrescent, hairs are on the midrib only, or the wording is 'almost glabrous'.
  - var_in: leaf_lamina_division
    unit_in: .na
    trait_name: leaf_lamina_division
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Once pinnate (paripinnate or imparipinnate) as pinnately_compound; bipinnate. Unifoliolate has no level.
  - var_in: leaf_length
    unit_in: unit
    trait_name: leaf_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Length of the whole compound leaf ('Leaves 10--14(--19) cm long'), entity_measured compound leaf.
  - var_in: leaf_phenology
    unit_in: .na
    trait_name: leaf_phenology
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Deciduous as printed ('Deciduous tree'; Peltophorum 'Leaves ... deciduous').
  - var_in: leaf_shape
    unit_in: .na
    trait_name: leaf_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaflet shape, entity_measured leaflet; hyphenated shapes score both levels.
  - var_in: leaflet_count
    unit_in: unit
    trait_name: leaflet_count
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Leaflets per compound leaf. Pairs of leaflets of a paripinnate leaf in unit pairs (doubled by config/unit_conversions.csv); single leaflets in {count}. Bipinnate leaves: pairs of pinnae (entity_measured pinnae) and pairs of leaflets per pinna (entity_measured leaflets per pinna). Provisional, Hou_2000 question 1.
  - var_in: leaflet_length
    unit_in: unit
    trait_name: leaflet_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      First dimension of the leaflet size 'L x W', entity_measured leaflet (also for unifoliolate leaves).
  - var_in: leaflet_width
    unit_in: unit
    trait_name: leaflet_width
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Second dimension of the leaflet size 'L x W', entity_measured leaflet.
  - var_in: petiole_length
    unit_in: unit
    trait_name: petiole_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Petiole of the compound leaf ('petiole 0.4--0.8 cm long'); 'petiole and rachis' together and petiolules not scored.
  - var_in: plant_diameter_breast_height
    unit_in: unit
    trait_name: plant_diameter_breast_height
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Trunk diameter from the habit sentence ('80(--120) cm diameter').
  - var_in: plant_growth_form
    unit_in: .na
    trait_name: plant_growth_form
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Tree, shrub or woody liana from the habit sentence; 'shrub-like tree' and 'treelet' as tree; 'scramblers' and a hedged climber not scored.
  - var_in: plant_height
    unit_in: unit
    trait_name: plant_height
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Plant height from the habit sentence ('Tree up to 36 m tall' as maximum).
  - var_in: plant_physical_defence_structures
    unit_in: .na
    trait_name: plant_physical_defence_structures
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      'unarmed' (trees, trunk) as absent; subfamily 'armed with thorns or spines'. Spines on fruits and calyx are not plant defence structures.
  - var_in: seed_colour
    unit_in: .na
    trait_name: seed_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Seed colour; aril colour excluded.
  - var_in: seed_height
    unit_in: unit
    trait_name: seed_height
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Third dimension of a seed size 'L x W x T', or 'c. 0.8 cm thick'.
  - var_in: seed_length
    unit_in: unit
    trait_name: seed_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      First dimension of the seed size 'L x W'; 'long and wide' as both length and width. Young seeds not scored.
  - var_in: seed_shape
    unit_in: .na
    trait_name: seed_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Seed shape as printed (ovoid, ellipsoid, subglobose as globoid, reniform, orbicular, lenticular, discoid); sub- terms not scored.
  - var_in: seed_surface_reflectivity
    unit_in: .na
    trait_name: seed_surface_reflectivity
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      'shining' as shiny.
  - var_in: seed_surface_texture
    unit_in: .na
    trait_name: seed_surface_texture
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Seed surface smooth or rugose (as rough).
  - var_in: seed_width
    unit_in: unit
    trait_name: seed_width
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Second dimension of the seed size 'L x W'; seed diameter ('across') as width.
  - var_in: seeds_per_fruit
    unit_in: unit
    trait_name: seeds_per_fruit
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Seeds per fruit from '2--6-seeded' and 'Seeds 1--5 per fruit'.
  - var_in: stem_base_form
    unit_in: .na
    trait_name: stem_base_form
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Buttressed when buttresses are stated present; 'with fluted bole' as fluted. 'not buttressed' and 'buttresses absent' not scored.
substitutions:
  - trait_name: bark_colour
    find: 'dark_brown'
    replace: 'brown_dark'
  - trait_name: bark_colour
    find: 'greenish grey'
    replace: 'green grey'
  - trait_name: bark_colour
    find: 'grey greenish black'
    replace: 'grey green black'
  - trait_name: bark_colour
    find: 'greyish brown'
    replace: 'grey brown'
  - trait_name: bark_colour
    find: 'greyish white brown'
    replace: 'grey white brown'
  - trait_name: bark_colour
    find: 'light_brown'
    replace: 'brown_light'
