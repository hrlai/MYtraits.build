  - trait_name: bark_colour
    find: 'reddish brown'
    replace: 'red brown'
  - trait_name: bark_colour
    find: 'reddish greyish brown'
    replace: 'red grey brown'
  - trait_name: bark_colour
    find: 'whitish'
    replace: 'white'
  - trait_name: bark_colour
    find: 'whitish brown yellowish'
    replace: 'white brown yellow'
  - trait_name: bark_colour
    find: 'whitish brownish grey'
    replace: 'white brown grey'
  - trait_name: bark_colour
    find: 'whitish grey'
    replace: 'white grey'
  - trait_name: bark_colour
