questions:
  question1: |
    Figs and syncarps. The Ficus fig (syconium, an urn-shaped receptacle
    enclosing the flowers and achenes) and the Artocarpus, Parartocarpus and
    Prainea syncarp (multiple fruit) are compound fruiting structures. As for
    the Pandanaceae syncarp (Beentje_2023 questions 1--2), their ripe colour
    ("Syconia ... ripening yellow to pink and red") is scored as
    fruit_colour with entity_measured syconium or syncarp (59 rows),
    and their sizes ("depressed globose, 1--1.5 cm across", "Syncarps
    subglobose, up to 11 x 8 cm") stay unmapped (71 syconium and 43 syncarp size rows,
    'candidate fruit_length / fruit_width'). The fruits scored are the
    achenes (fruit_length with entity_measured achene) and drupes.
    traits.yml has fruit_type levels syconium and syncarp, which suggests
    AusTraits treats these structures as fruits. Fig size matters for
    frugivores. Should fig and syncarp sizes be scored as fruit_length /
    fruit_width with entity_measured syconium / syncarp?
  question2: |
    Taxa described only in keys. TFSS gives full treatments to trees only.
    77 Ficus species and varieties (climbers, root-climbers, epiphytes and
    stranglers; for example F. sundaica, F. punctata, F. villosa) and the
    climber genera Trophis (T. scandens) and Maclura (M. cochinchinensis)
    are annotated inside the keys (pp. 182--183, 216--256), many with a
    short description ("Dioecious root-climber. Twigs pale yellow, hollow
    ... Syconia ... ripening dark brown ..., c. 7 x 6 cm"). Following the
    TFSS guide (keys are not trait evidence) they are not scored or
    segmented; they are listed in raw/taxon_flags.csv. This leaves about
    half of the 143 Ficus species of Sabah and Sarawak without data. Should
    these key annotations be parsed and scored at their own rank?
  question3: |
    Annotations in keys to varieties and subspecies. 44 varieties and
    subspecies printed in a "Key to varieties / subspecies" after a species
    description (for example the 7 F. oleifolia varieties, 9 F. uncinata
    varieties, the 3 Parartocarpus venenosus subspecies) are kept as
    unmapped 'Infraspecific annotation' rows, as in Kochummen_1995; many
    carry a short description ("Small tree. Twigs blackish. Leaves ...
    2.5--11 x 0.6--1 cm"). Jones_1995 scored such descriptions at variety
    rank (its question 6) and Ashton_2004 let key-annotated subspecies
    inherit the species values. Which treatment should apply to all TFSS
    datasets?
  question4: |
    Stranglers and epiphytes. "strangler" (Ficus, e.g. "Dioecious tree, up
    to 15 m tall, or strangler") is scored as plant_growth_substrate =
    hemiepiphyte and "epiphyte" as epiphyte (8 rows), next to the
    growth form. "with ... free hanging aerial roots" is scored as
    root_system_type = aerial_roots and "without free hanging aerial roots"
    as aerial_roots_absent (8 rows). Confirm these mappings (new
    seed rows, provisional).
  question5: |
    Fig-wasp pollination. The Ficus genus Ecology statement "Flowers are
    pollinated by fig-wasps which are species-specific" (p. 214) is scored
    as pollination_vector_known = wasp at genus rank and copied to the 70
    described Ficus species (inferred_from_genus). Confirm the copy-down of
    an Ecology statement (the copy-down rule was written for descriptions).
  question6: |
    Ficus cumingii height. The habit is printed "Dioecious shrub, up to 4 cm
    tall" (p. 268), probably a misprint for 4 m. The height is not scored
    and the clause is kept unmapped. Score it as 4 m, or leave it?
  question7: |
    Source repairs that change a value (raw/source_fixes.csv). Ficus
    pseudotarennifolia lamina "9.5--2.5 x 1--3.5 cm" (p. 297) is read as
    2.5--9.5 cm; Artocarpus elasticus "anthers oblong, c. 0.4 m long"
    (p. 196) is read as 0.4 mm. A Figure 2 caption fragment printed inside
    the Artocarpus genus description (p. 187) was removed. Confirm the two
    value changes.
  question8: |
    Tepals. Moraceae flowers have one perianth whorl. Following the
    provisional Cheek_2012 question 4 rule, tepal or perianth length is
    scored as flower_sepal_length (24 rows), tepal number as
    flower_perianth_parts_count (109 rows) and tepal colour as
    flower_colour (38 rows). In Ficus the tepals ("Tepals 4--7, free,
    red") sit inside the closed fig and are never seen by visitors; is
    flower_colour appropriate for them, or should Ficus tepal colour stay
    unmapped?
  question9: |
    Capitate heads. Artocarpus, Parartocarpus and Prainea male and female
    inflorescences are heads printed 'L x W' ("Male heads ellipsoid-oblong,
    3--7.5 x 1.5--2 cm"). The first dimension is scored as
    inflorescence_length and the second as inflorescence_diameter (19 rows,
    noted "Head width scored as inflorescence_diameter"). Confirm the width
    as diameter.
