dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '2018'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description: |
    Morphological traits of the Myristicaceae of Peninsular Malaysia (5
    genera, 65 species, 11 subspecies and 13 varieties: Endocomia 2,
    Gymnacranthera 3, Horsfieldia 21, Knema 27, Myristica 12), extracted
    from the family treatment in the Flora of Peninsular Malaysia.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: |
    Born-digital PDF (assets/myflora_metadata.csv); rows come from the PDF
    text layer (pdf pages 7--136, printed 127--256) read with
    flora_read_pdf_lines() and segmented by raw/segment_source.R. No page
    was image-checked: flora_layer_flags() flagged only the front matter,
    the plates (pdf 137--143), the full-page Figures and map pages inside
    the treatment (low text, captions in the layer) and one unmapped
    character on pdf 73 (an empty map symbol in a caption); there are no
    page-number breaks in the treatment. raw/build_trait_data.R splits each
    family, genus, species and infraspecific description into sentences,
    ';' pieces and ',' clauses, assigns each clause to an organ (male and
    female flowers and buds named in entity_measured) and scores configured
    traits; every other clause stays verbatim as an unmapped row.
    Parenthetical asides that are not numbers ('(elsewhere ...)', '(or 5)')
    are taken out before scoring and kept as unmapped rows. Unqualified
    single-level family and genus values are copied to member taxa silent
    on the trait when every member that states the trait agrees
    (inferred_from_family / inferred_from_genus); varieties and subspecies
    whose descriptions give differences only inherit their species
    description. Where a species has one infraspecific taxon in Peninsular
    Malaysia, that taxon's description is the local description and is
    scored at infraspecific rank (FPM guide). Ranges are minimum and
    maximum, parenthetical extremes are extreme_range rows, a single or
    "c." value is a mean and "to" values are maxima. Hedged statements
    (including the author's queries "(always?)" and "?") are not scored.
    Population region is Peninsular Malaysia for species and infraspecific
    descriptions (FPM guide); copied family and genus values and cited
    observations have none. Keys and figure captions are not trait
    evidence.
  original_file: |
    Myristicaceae.pdf (de Wilde & Duyfjes 2018, Flora of Peninsular
    Malaysia Series II vol. 7, pp. 127--256)
  notes: |
    data.csv is raw/trait_data.csv with the columns added by
    flora_make_data(). Taxon names are as printed. All 65 accepted species
    headings are processed: 54 species have their own description; for 11
    species (Endocomia macrocoma, Gymnacranthera forbesii, Horsfieldia
    penangiana, H. subalpina, H. sucosa, Knema andamanica, K. glauca,
    K. kunstleri, K. latericia, K. stenophylla, Myristica malaccensis) only
    one infraspecific taxon occurs in Peninsular Malaysia and its
    description is the local description, scored at infraspecific rank
    with no species-rank morphology. Six species (Gymnacranthera
    farquhariana, Horsfieldia polyspherula, Knema curtisii, K. laurina,
    K. oblongifolia, K. rigidifolia) have a species description and two or
    three infraspecific descriptions that give differences only; those 13
    infraspecific taxa inherit the other traits. The family Distribution
    counts 66 species and 22 Horsfieldia; the Horsfieldia Distribution
    says 21 and 21 are treated. The nutmeg Myristica fragrans (cultivated,
    introduced from Maluku) appears only in the key to Myristica, and the
    ornamental Horsfieldia iryaghedhi only in genus text and keys; neither
    has a description, so neither is scored (raw/taxon_flags.csv). Of
    9,696 rows in raw/trait_data.csv, 3,903 are mapped (2,826 from the
    taxa's own descriptions and Ecology statements, 540 copied from the
    family, 259 from genera and 278 inherited from species descriptions)
    and 5,793 are unmapped: 5,279 description clauses and 514 sentences of
    Distribution, Ecology, Conservation status, Uses, Taxonomy, Note and
    vernacular names. Most frequent unmapped characters: fruit shape and
    number per infructescence, lateral vein number and relief, leaf texture
    (membranous, chartaceous, coriaceous), twig diameter, indumentum and
    bark, leaf dots, fruit stalk length, pedicel length, flower bud shape
    and splitting depth, perianth lobe thickness, androphore, synandrium and
    anther locules, ovary and stigma, inflorescence branching and peduncle,
    aril colour and division, endosperm, altitude, habitat and
    conservation status (summary in raw/unmapped_terms.csv). Phenology,
    the cited scent of H. irya flowers (Corner 1988), water dispersal of
    H. irya seeds and bird dispersal (family, Sinclair 1958) and
    M. crassa sometimes monoecious (Sinclair 1958) are in
    raw/manual_rows.csv. Not scored: the hornbill records of Kitamura et
    al. (2011) from Peninsular Thailand (outside the region), fruits eaten
    by primates, elephants and squirrels and the aril eaten by siamang
    (eating is not dispersal), recalcitrant seed viability of 30--75(--315)
    days (Ng 2014; no trait) and hedged statements (question 10). Two
    descriptions cite Sinclair for organs the authors did not see
    (question 9). Source repairs (three punctuation fixes and one unit
    typo, question 2) are in raw/source_fixes.csv. Types and types of
    synonyms (264 rows, 75 taxa) are in raw/DeWilde_2018_vouchers.csv; the
    figures are reproduced from Flora Malesiana and name no specimens.
identifiers: .na
locations: .na
contexts:
  - context_property: commonness qualifier
    category: entity_context
    var_in: commonness_qualifier
  - context_property: population region
    category: entity_context
    var_in: population_region
  - context_property: entity measured
    category: method_context
    var_in: entity_measured
  - context_property: trait scoring method
    category: method_context
    var_in: trait_scoring_method
traits:
  - var_in: bark_colour
    unit_in: .na
    trait_name: bark_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Colour of the outer bark (''Bark grey-brown, smooth''); every colour word scored in text order; patches and inner bark not scored.'
  - var_in: bark_texture
    unit_in: .na
    trait_name: bark_texture
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Outer bark surface (''smooth'', ''fissured'', ''flaking''); ''fissured'' scored as furrowed; twig bark not scored.'
  - var_in: bud_length
    unit_in: unit
    trait_name: bud_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Length of the leaf bud (apical bud of the twig) and of the male and female flower bud (the closed perianth), named in entity_measured; provisional mapping (skill step 4, Ashton_2004 questions 1--5).'
  - var_in: bud_width
    unit_in: unit
    trait_name: bud_width
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Width or diameter of the leaf bud and of the male and female flower bud, named in entity_measured; diameter scored as width.'
  - var_in: dispersal_appendage
    unit_in: .na
    trait_name: dispersal_appendage
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'An aril stated in the fruit or seed description (''aril red'', ''aril laciniate to near the base'').'
  - var_in: dispersal_syndrome
    unit_in: .na
    trait_name: dispersal_syndrome
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Dispersal by water stated in a cited species Ecology statement (Sinclair 1958).'
  - var_in: dispersers
    unit_in: .na
    trait_name: dispersers
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Family Ecology statement that fruit pigeons, doves and hornbills disperse the seeds (Sinclair 1958); family rank only.'
  - var_in: flower_anther_dehiscence
    unit_in: .na
    trait_name: flower_anther_dehiscence
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: '''opening by longitudinal slits'' in the family description.'
  - var_in: flower_anther_orientation
    unit_in: .na
    trait_name: flower_anther_orientation
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: '''extrorse'' in the family description.'
  - var_in: flower_bract_length
    unit_in: unit
    trait_name: flower_bract_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Length of the bracteole on the flower pedicel (entity_measured = bracteole); inflorescence bracts not scored.'
  - var_in: flower_colour
    unit_in: .na
    trait_name: flower_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Colour of the perianth or flowers when stated for the whole flower; colours after an ''inside'' or ''outside'' clause (perianth inside) are not scored, as their ownership is unclear.'
  - var_in: flower_fertile_stamens_count
    unit_in: unit
    trait_name: flower_fertile_stamens_count
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Number of anthers of the male flower; the anthers are fused into a synandrium (question 3). Anther locule numbers (Horsfieldia, Myristica) are not scored.'
  - var_in: flower_ovary_position
    unit_in: .na
    trait_name: flower_ovary_position
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: '''ovary ... superior'' in the family description.'
  - var_in: flower_perianth_merism
    unit_in: unit
    trait_name: flower_perianth_merism
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Number of perianth lobes (''lobes 3 or 4'', ''perianth 3-lobed'') or merism (''(2--)3(--5)-merous''), per sex in entity_measured.'
  - var_in: flower_perianth_whorls_count
    unit_in: unit
    trait_name: flower_perianth_whorls_count
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: '''perianth uniseriate'' scored as one whorl.'
  - var_in: flower_scent_production
    unit_in: .na
    trait_name: flower_scent_production
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: '''not fragrant'' (Knema genus description) and a cited report of fragrant flowers (H. irya, family Ecology, Corner 1988).'
  - var_in: flower_shape
    unit_in: .na
    trait_name: flower_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Shape of the male perianth (''urceolate'', ''rotate'', ''cup-shaped'', ''tubular''); ''globose'' has no level.'
  - var_in: flower_structural_carpels_count
    unit_in: unit
    trait_name: flower_structural_carpels_count
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: '''ovary monocarpellate'' scored as one carpel.'
  - var_in: flower_structural_sex_type
    unit_in: .na
    trait_name: flower_structural_sex_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: '''Flowers ... unisexual'' in the family description.'
  - var_in: flower_style_differentiation
    unit_in: .na
    trait_name: flower_style_differentiation
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: '''style absent'' in genus and species descriptions.'
  - var_in: flower_style_length
    unit_in: unit
    trait_name: flower_style_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Length of the style of the female flower; ''style and stigma'' lengths not scored.'
  - var_in: flowering_time
    unit_in: .na
    trait_name: flowering_time
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Months as printed in Ecology paragraphs; ''throughout the year'' scored as every month and noted.'
  - var_in: fruit_colour
    unit_in: .na
    trait_name: fruit_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Ground colour of the ripe fruit; the drying colour (''drying dark brown''), indumentum colour and immature fruits not scored.'
  - var_in: fruit_dehiscence
    unit_in: .na
    trait_name: fruit_dehiscence
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: '''dehiscing by a single longitudinal circumferential suture into 2 valves, rarely indehiscent'' (family).'
  - var_in: fruit_fleshiness
    unit_in: .na
    trait_name: fruit_fleshiness
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: '''pericarp fleshy'' when stated without an intermediate (''leathery or somewhat fleshy'' not scored).'
  - var_in: fruit_length
    unit_in: unit
    trait_name: fruit_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Length of the fruit; ''L x W'' read as length x width.'
  - var_in: fruit_surface_hairs
    unit_in: .na
    trait_name: fruit_surface_hairs
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Fruit glabrous or hairy as stated; ''glabrescent'' (becoming glabrous) not scored.'
  - var_in: fruit_wall_thickness
    unit_in: unit
    trait_name: fruit_wall_thickness
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Thickness of the pericarp.'
  - var_in: fruit_width
    unit_in: unit
    trait_name: fruit_width
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Width of the fruit; ''diameter'' scored as width.'
  - var_in: fruiting_time
    unit_in: .na
    trait_name: fruiting_time
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Months as printed in Ecology paragraphs; ''throughout the year'' scored as every month and noted.'
  - var_in: inflorescence_length
    unit_in: unit
    trait_name: inflorescence_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Length of the (male or female) inflorescence, named in entity_measured; peduncle, branch and infructescence lengths not scored.'
  - var_in: inflorescence_type
