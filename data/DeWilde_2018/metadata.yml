questions:
  question1: 'Dimension pairs. ''a x b'' sizes are read as length x width for the lamina (''8--30 x 4--13.5 cm'') in all taxa that give one. Confirm.'
  question2: 'Source typo. Myristica wyatt-smithii (printed 255) reads ''Tree 9--23 cm tall''; repaired to ''9--23 m'' in raw/source_fixes.csv (a tree, and the bole is described). This changes the plant_height value. Confirm the repair.'
  question3: 'Anther counts. The anthers are fused into a synandrium (''synandrium ... with 2--6 completely fused ... anthers'', ''anthers (6 or) 7--11(--13)''); each anther is scored as one fertile stamen in flower_fertile_stamens_count with entity_measured male flower (99 rows, Endocomia, Gymnacranthera, Knema). Horsfieldia and Myristica give only anther locules (''anther locules 12--18''); the treatment says the anther number is half the locule number (printed 129), but halving is not done and the locule counts stay unmapped. Decide: confirm the anther mapping, and whether to score half the locule count.'
  question4: 'Flower buds. Male and female flowers are described by their mature closed bud (''bud broadly ellipsoid-obovoid, 1.5--1.6 mm long, 1.3--1.4 mm wide''), which opens by splitting at anthesis. These sizes are scored as bud_length and bud_width with entity_measured male flower bud or female flower bud (provisional mapping after Ashton_2004 questions 1--5); leaf bud sizes the same way with entity_measured leaf bud. Decide: keep as bud traits, or score the flower buds as flower_length and flower_diameter.'
  question5: 'Perianth lobes. ''lobes 3 or 4 (or 5)'' and ''perianth 3-lobed'' (a uniseriate, gamophyllous perianth) are scored as flower_perianth_merism, per sex in entity_measured. Confirm.'
  question6: 'Aril. Every fruit or seed clause naming an aril (''aril red'', ''aril laciniate to near the base'') is scored dispersal_appendage = aril, and the genus statements are copied to member species (46 rows). Aril colour and division (entire, laciniate) have no trait and stay unmapped (candidate traits). Confirm.'
  question7: 'Perianth colour. Most perianth colours follow an ''inside'' clause (''inside glabrous, greenish creamy, pink or red'', Knema genus; ''lobes inside greenish to yellowish''), so it is unclear whether they are the inside or the whole perianth; these stay unmapped and only a few flower colours are scored. Decide whether the inside colour of the perianth should be scored as flower_colour.'
  question8: 'Bracteole length. M. elliptica and K. glauca var. glauca bracteoles ''0.5--1 mm long'' give 0.5 mm, below the flower_bract_length minimum of 1 mm in traits.yml; these 2 rows are excluded at build. Decide: widen the traits.yml range centrally, or drop bracteole lengths below 1 mm.'
  question9: 'Cited descriptions. Two descriptions cite Sinclair for organs the authors did not see: ''Female flowers (Sinclair, 1958)'' in Horsfieldia fulva (printed 158) and ''Fruits (Sinclair, 1961)'' in Knema curtisii var. paludosa (printed 198). These rows are scored with source_id Sinclair_1958 or Sinclair_1961 and no population region. Confirm.'
  question10: 'Hedges not scored: Endocomia ''Trees, monoecious (always?)'' (so neither Endocomia species has a sex_type), M. crassa ''aril yellow (always?)'', ''endosperm ruminate, ?without starch'', family Ecology ''Anthesis is presumably mainly nocturnal'', ''in some species small beetles effect pollination'', ''Dissemination by water may occur in Horsfieldia wallichii'' and M. elliptica seeds ''raising the possibility'' of water dispersal. Confirm that these stay unscored.'
  question11: 'Copy-down past a commonness word (provisional rule, skill step 5). A commonness word now bars copy-down only for the chunks after it in the same piece: in the family ''Leaves simple, entire, alternate, usually distichous ...'' (printed 127), simple, entire and alternate are copied to all 78 described taxa and distichous is not. Kochummen_2000 barred every chunk in such a piece. Confirm.'
