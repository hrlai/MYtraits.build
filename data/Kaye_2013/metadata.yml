traits:
  - var_in: leaf_work_to_punch
    unit_in: N/mm
    trait_name: leaf_work_to_punch
    entity_type: individual
    value_type: mean
    basis_of_value: measurement
    replicates: 2
    methods:
      We measured leaf toughness on the same leaves using a hand-held
      penetrometer (DFX-050 force gauge, Chatillon, AMETEK) to puncture the leaf
      surface and record peak resistance.
  - var_in: area (mm2)
    unit_in: mm2
    trait_name: leaf_area
    entity_type: individual
    value_type: mean
    basis_of_value: measurement
    replicates: 2
    methods:
      We measured leaf surface area by scanning leaves directly with a CanoScan
      LiDE 110 scanner (Canon, UK) for 2230 samples and by photographing leaves
      pressed flat beneath a sheet of glass using a Panasonic DMC-FT10 camera
      for the remaining 1040 samples. For both methods, we calculated surface
      area by counting the pixels comprising leaf area on the digital images
      using ImageJ (1040 v1.47, Rasband, W.S., ImageJ, U. S. National Institutes
      of Health, Bethesda, Maryland, USA,).
  - var_in: LDMC
    unit_in: g/g
    trait_name: leaf_dry_matter_content
    entity_type: individual
    value_type: mean
    basis_of_value: measurement
    replicates: 2
    methods:
      We recorded the mass of each leaf before and after drying for a minimum of
      68 hours at 55C. We calculated LDMC as the dry mass divided by the fresh
      mass.
  - var_in: SLA
    unit_in: cm2/g
    trait_name: leaf_mass_per_area
    entity_type: individual
    value_type: mean
    basis_of_value: measurement
    replicates: 2
    methods:
      For SLA, we removed the petiole of simple leaves and the rachis below the
      first leaflet in compound leaves and cleaned the leaves to remove any
      remaining epiphylls. We measured leaf surface area by scanning leaves
      directly with a CanoScan LiDE 110 scanner (Canon, UK) for 2230 samples and
      by photographing leaves pressed flat beneath a sheet of glass using a
      Panasonic DMC-FT10 camera for the remaining 1040 samples. For both
      methods, we calculated surface area by counting the pixels comprising leaf
      area on the digital images using ImageJ (1040 v1.47, Rasband, W.S.,
      ImageJ, U. S. National Institutes of Health, Bethesda, Maryland, USA,). We
      recorded the mass of each leaf before and after drying for a minimum of 68
      hours at 55oC. We calculated SLA as leaf surface area (cm2) divided by the
      dry mass (g).
