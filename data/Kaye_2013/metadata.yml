  location_name: unknown
  individual_id: number
  description:
    This investigation seeks to determine whether community composition and
    functional diversity vary along fine-scale environmental gradients and if
    communities are randomly assembled with respect to functional traits in
    Danum valley, Sabah. Measurements of leaf traits were obtained for 320 tree
    species growing on the 50ha census plot and combined with metrics of soil
    nutrient availability and topographic variables. Non-metric
    multi-dimensional scaling was used to investigate community composition and
    a null model approach was taken to determine whether communities were
    randomly assembled with respect to functional diversity. The analyses
    uncovered an elevation gradient of 57.5 m that co-varied with soil Ca, Mg, K
    and Al concentrations and correlated with community composition and
    functional diversity.
  basis_of_record: field
  life_stage: sapling
  sampling_strategy:
    Leaf traits were measured on two leaves collected from five trees per
    species for 320 species (69% of all species representing 89% of all stems)
    represented on these 80 quadrats, to give a sample of 10 leaves per species.
    In some instances, where leaves were disproportionately large or a tree was
    particularly small, we collected only one leaf to reduce damage to the tree.
    Sub-canopy trees (where the underside of the crown was 6m or less above the
    ground) were selected for sampling at random from within the 76 quadrats
    where possible, but for 75% of species, there were fewer than five
    individuals on the selected quadrats and so samples were collected from
    additional trees outside the quadrats for calculating mean values. For the
    1623 individuals identified for sampling, we collected shade leaves between
    1.5 and 6 m above the ground using a pole pruner. Shade rather than sun
    leaves were selected in order to compare individuals within the size classes
    where we infer that competition and filtering are actively taking place,
    rather than from the largest (and most well-lit) trees that comprise the
    canopy, and because many species at our study site are understorey and
    sub-canopy trees that never reach the canopy at maturity.
  original_file: data/Kaye_2013/raw/All leaves.xlsx
  notes:
    Original data provided pressure to puncture in Newton, but did not specify
    the punch circumference. Hao Ran assumed that the same a 1-mm2 flat head rod
    Chatillon puncher was used as Burslem_2022, since the lead author was
    supervised by David Burslem.
