dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '2012'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description:
    Nepenthaceae (Nepenthes, ten species and three named hybrids) of
    Peninsular Malaysia.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: |
    Born-digital PDF (assets/myflora_metadata.csv); rows come from the PDF text
    layer (pdf pages 7--33, printed 249--275) read with flora_read_pdf_lines()
    and segmented by raw/segment_source.R. No page was image-checked:
    flora_layer_flags() flagged only the front matter, the plates (pdf 35--39,
    printed 362--366, photographs) and the full-page Figures 1 and 2 (pdf 20
    and 27), whose captions are in the layer; no bad glyphs and no page-number
    breaks in the treatment. Each Description sentence was split into ';'
    clauses and ',' pieces outside parentheses; pieces were scored by hand in
    raw/build_trait_data.R, and every other piece is kept verbatim as an
    unmapped row. The family is monogeneric and has no family description, so
    unqualified single-level genus values are copied to the ten species when
    no species disagrees (trait_scoring_method = inferred_from_genus). Ranges
    are minimum and maximum, parenthetical extremes are extreme_range rows, a
    single or "c." value is a mean and "to" values are maxima. Hedged
    statements are not scored. Population region is Peninsular Malaysia for
    species descriptions and species sections (FPM guide).
  original_file:
    Nepenthaceae.pdf (Cheek & Jebb 2012, Flora of Peninsular Malaysia Series
    II vol. 3, pp. 249--275)
  notes: |
    Mapped and unmapped rows share raw/trait_data.csv; raw/unmapped_terms.csv
    summarises the unmapped rows by organ. Most of each species description
    is the pitcher (lower, upper and rosette pitchers: shape, size, colour,
    wings and fringe elements, mouth, peristome ribs and teeth, lid shape,
    size and nectar glands, spur), which has no trait in config/traits.yml.
    Other unmapped characters: sessile leaves and leaf texture (coriaceous,
    chartaceous), amplexicaul or clasping, decurrent and auriculate-lobed
    bases measured in mm, fimbriate leaf margins (N. mirabilis), venation,
    stem diameter and shape of climbing stems (not basal diameter),
    internode length, buds, stipules lacking, indumentum details, inflorescence
    width, peduncle, partial-peduncle and bract details, pedicel length,
    tepal width and shape, androphore and anther-head size, ovary length,
    capsule valve width, seed appendages, number of flowers per inflorescence
    and seeds per fruit. Distribution, Ecology (altitude, habitat, peat,
    shade), Conservation status, Uses, Notes and the genus Reproductive
    biology, Morphology, Pitcher function, Pitcher Ecosystem, Trapping of
    prey, Hybridization, Conservation and Collecting methods paragraphs are
    kept as unmapped sentences. Scent and flower-visitor values cited in the
    genus Reproductive biology paragraph are scored for the species named,
    with the cited work as source_id and no population region (question 9).
    Statements from outside the flora region (moth pollination of N. gracilis
    in Sumatra) and hedged pollinators (muscid flies, carrion flies) are not
    scored. The three named hybrids are kept as unmapped rows only (question
    1). N. alata and N. reinwardtiana (Excluded Species) are listed in
    raw/taxon_flags.csv and not scored. Source repairs are in
    raw/source_fixes.csv. Types, types of synonyms and the Figure 2 specimen
    are in raw/Cheek_2012_vouchers.csv.
identifiers: .na
locations: .na
contexts:
  - context_property: commonness qualifier
    category: entity_context
    var_in: commonness_qualifier
  - context_property: population region
    category: entity_context
    var_in: population_region
  - context_property: entity measured
    category: method_context
    var_in: entity_measured
  - context_property: trait scoring method
    category: method_context
    var_in: trait_scoring_method
traits:
