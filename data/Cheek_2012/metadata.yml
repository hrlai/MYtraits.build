questions:
  question1: 'Named hybrids. N. x ghazallyiana, N. x hookeriana and N. x trichocarpa (pp. 272--274) are described only by comparison with their parents ("Intermediate between ..., like N. gracilis it has sessile leaves ..."), with a few measurements (pitcher and peristome sizes, which have no trait). Their 8 comparative sentences are kept as unmapped rows and receive no genus copy-down. Decide whether named hybrids should be scored, and whether genus values (carnivorous, dioecious, capsule, etc.) should be copied to them.'
  question2: 'Climber height. Every species is "Terrestrial climber ... m tall" (N. mirabilis "sub-shrub or climber to 10 m"; N. macfarlanei "sometimes epiphytic or climber to 3 m"). These 10 species are scored as plant_height_climbing_plant (14 rows), not plant_height. Confirm the trait, and whether the N. mirabilis and N. macfarlanei heights should apply to the non-climbing forms too.'
  question3: 'Dimension pairs "a x b" are read as length x width for lamina, tepal, capsule valve and seed sizes (all species). Confirm.'
  question4: 'Tepals and valves. Nepenthes flowers have one whorl of four tepals and no petals; male-flower tepal length is scored as flower_sepal_length (10 species, entity_measured male flower). Capsule valve length ("Fruits: valves 25--29 x 2.2--2 mm") is scored as fruit_length (7 species); N. ampullaria and N. benstonei give fruit length directly. Confirm both mappings or keep them unmapped pending tepal and valve traits.'
  question5: 'Source issues. (a) N. gracillima tepals "3.5--4 x 2;" (p. 263) has no unit; mm was added in raw/source_fixes.csv and scored as sepal length 3.5--4 mm. (b) N. gracilis "Fruits: valves 42--27(--35) mm long" (p. 260) has a minimum larger than the maximum and is not scored. Confirm (a), and supply the intended N. gracilis range for (b) if known (e.g. from Flora Malesiana).'
  question6: 'Seed surface. The central seed body is "papillate" (N. gracilis) or "tuberculate" (N. macfarlanei, N. ramispina), scored as seed_surface_texture bumpy; "rugose" (N. sanguinea) as rough; "smooth" (N. gracillima) as smooth. The appendages are not described for texture. Confirm these mappings.'
