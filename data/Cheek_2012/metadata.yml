    unit_in: .na
    trait_name: breeding_system
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Genus Reproductive biology ''Being dioecious, all Nepenthes species are obligate outbreeders'', scored as allogamy and copied to the ten species (question 7).'
  - var_in: dispersal_syndrome
    unit_in: .na
    trait_name: dispersal_syndrome
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Genus Reproductive biology: light seeds with thread-like appendages blown away by gusts of wind, scored as anemochory and copied to the ten species.'
  - var_in: flower_anther_dehiscence
    unit_in: .na
    trait_name: flower_anther_dehiscence
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
