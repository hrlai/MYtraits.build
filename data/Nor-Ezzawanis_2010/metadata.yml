substitutions:
  - trait_name: leaf_arrangement
    find: spirally arranged
    replace: spiral
  - trait_name: leaf_compoundness
    find: deeply tripinnatifid
    replace: compound
  - trait_name: leaf_hairs_adult_leaves
    find: pale brown appressed hairs
    replace: hairy
  - trait_name: leaf_surface_colour
    find: mid-green
    replace: green
taxonomic_updates: .na
exclude_observations: .na
questions:
  question1:
    'First fern extraction: confirm stipe -> petiole; lamina -> leaf; pinnae and
    pinnules -> leaflets; deeply tripinnatifid -> compound; pinna-pair count ->
    leaflet_count.'
  question2:
    'Leaflet dimensions combine pinnae (cm) and pinnules (mm), distinguished by
    entity measured. Confirm acceptable treatment.'
  question3:
    'Author is given only as A. T. Nor-Ezzawanis; full given name and ORCID not
    located.'
  question4:
    'Flora has no Methods text; sampling_strategy documents extraction practice.'
  question5:
    '`leaf_type` does not represent fern frond division: its allowed levels are
    broadleaf, leafless, needle and scale. Deeply tripinnatifid is provisionally
    mapped to `leaf_compoundness = compound`. Confirm terminology and mapping.'
  question6:
    'Fern hierarchy requires `entity_measured`: pinnae and pinnules are both
    provisionally mapped to leaflet traits, but they are distinct organs and
    sizes. Confirm this vocabulary and context use.'
  question7:
    'The source reports pinna pairs, not individual pinnae. The reported 12--22
    is provisionally stored as `leaflet_count` with `entity_measured = pinna
    pairs`; do not interpret it as an individual-pinna count.'
