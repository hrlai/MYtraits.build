dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '2010'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description:
    Cibotiaceae of Peninsular Malaysia, represented by one species, Cibotium
    barometz.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy:
    "Treatment transcribed from rendered page images
    (raw/Cibotiaceae_transcription.txt); unknown-origin OCR layer not used.
    Values were hand-entered clause by clause from family, genus and species
    descriptions. Fern mappings are provisional: stipe to petiole, lamina to
    leaf, and pinnae or pinnules to leaflets. Ranges are minimum and maximum;
    'to' values are maxima."
  original_file:
    Cibotiaceae.pdf (Nor-Ezzawanis 2010, Flora of Peninsular Malaysia Series I
    vol. 1, pp. 119--122)
  notes:
    'Mapped and unmapped rows share raw/trait_data.csv. Habitat, altitude,
    distribution, conservation, uses, rhizome, indusia and uncertain trunk
    observations are unmapped. Figure specimen is in
    raw/Nor-Ezzawanis_2010_vouchers.csv.'
