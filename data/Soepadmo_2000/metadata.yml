dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '2000'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description: |
    Morphological and phenological traits of the Fagaceae of Sabah and
    Sarawak (4 genera, 100 species: Castanopsis 21, Lithocarpus 61, Quercus
    17, Trigonobalanus 1), extracted from the family treatment in the Tree
    Flora of Sabah and Sarawak.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: |
    The PDF (inst/extdata/myflora/pdf/TFSS/Fagaceae.pdf, PDF pages 7--124,
    printed 1--118) is the born-digital 2007 electronic edition (L. G. Saw and
    B. Aslina). Rows come from its text layer (flora_read_pdf_lines()); no
    routine image check was made. flora_layer_flags() flagged only the 17
    figure plates (low text, no printed page number in the layer) and no
    bad glyphs; the plate pages were rendered and their captions read for
    figure specimens only. raw/segment_source.R segments the text;
    raw/build_trait_data.R splits each family, genus and species
    description into sentences, ';' pieces and ',' clauses, assigns each
    clause to an organ and scores configured traits. Every unscored clause
    stays in raw/trait_data.csv as an unmapped row, as do the Distribution,
    Ecology, Uses and vernacular-name paragraphs (one row per sentence).
    Months are scored from species Ecology text. Unqualified single-level
    family and genus values are copied to member species silent on the trait
    when every member that states the trait agrees (trait_scoring_method
    inferred_from_family / inferred_from_genus); family statements naming a
    genus are not copied. Family Ecology statements on pollination,
    dispersal and anthesis are in raw/manual_rows.csv at genus or family rank
    and are not copied down. Keys and figure captions are not trait
    evidence.
  original_file: |
    Fagaceae.pdf (Soepadmo, Julia & Go 2000, Tree Flora of Sabah and Sarawak
    vol. 3, pp. 1--118; electronic edition 2007)
  notes: |
    data.csv is raw/trait_data.csv (written by raw/build_trait_data.R) with
    the columns added by flora_make_data(). Taxon names are as printed. All
    100 accepted species of the treatment (Castanopsis 21, Lithocarpus 61,
    Quercus 17, Trigonobalanus 1; the family and genus counts printed in the
    Distribution paragraphs) have a description and are scored; there are no
    infraspecific, excluded or incompletely known taxa. Lithocarpus
    tawaiensis has no female flowers described and only a young cupule.
    Family and genus descriptions are kept as family- and genus-rank records
    as well as copied to member species. Species description values have
    population region Sabah and Sarawak (TFSS guide); copied values have
    none. No source repairs were needed (raw/source_fixes.csv is empty); line
    breaks inside words ("mar-gin") are joined in raw/build_trait_data.R when
    the unhyphenated word occurs elsewhere in the treatment. The fruit is the
    acorn (Lithocarpus, Quercus) or nut (Castanopsis, Trigonobalanus); the
    cupule that holds it has no trait and stays unmapped. Of 11,031 rows in
    raw/trait_data.csv, 4,727 are mapped (3,798 from the species' own
    descriptions, 445 copied from genus and 484 from family) and 6,304 are
    unmapped: 5,645 description clauses and 659 sentences of Distribution,
    Ecology, Uses, vernacular names and family taxonomy. The most frequent
    unmapped characters are cupule size, shape, wall, lamellae, spines and
    stalk; lateral vein number and relief; intercostal venation; midrib
    relief; stipules; inner bark and sapwood colour and texture; twig
    lenticels; acumen length; staminodes and pistillode; nut base, apex,
    scar and wall; coppicing; altitude, soils and distribution (summary in
    raw/unmapped_terms.csv). Type and figure specimens are in
    raw/Soepadmo_2000_vouchers.csv (types transcribed from the nomenclature
    paragraphs; figure specimens from the 17 plate captions).
identifiers: .na
locations: .na
contexts:
  - context_property: commonness qualifier
    category: entity_context
    var_in: commonness_qualifier
  - context_property: population region
    category: entity_context
    var_in: population_region
  - context_property: entity measured
    category: method_context
    var_in: entity_measured
  - context_property: trait scoring method
    category: method_context
    var_in: trait_scoring_method
traits:
  - var_in: bark_colour
    unit_in: .na
    trait_name: bark_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Outer bark colour from the Bark clause; inner bark, lenticels and patches excluded; compound colours score every word.
  - var_in: bark_texture
    unit_in: .na
    trait_name: bark_texture
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Outer bark surface from the Bark clause (smooth, fissured as furrowed, flaky, rough); scaly, cracked and lenticellate have no level and stay unmapped.
  - var_in: dispersers
    unit_in: .na
    trait_name: dispersers
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family Ecology statement 'dispersal of fruits ... by arboreal vertebrates such as squirrels', scored at family rank only.
  - var_in: flower_anther_attachment
    unit_in: .na
    trait_name: flower_anther_attachment
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Anther attachment as stated in the family and genus descriptions (dorsifixed in Castanopsis and Lithocarpus, basifixed in Quercus and Trigonobalanus).
  - var_in: flower_bract_length
    unit_in: unit
    trait_name: flower_bract_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      First dimension of 'L x W' bract or bracteole sizes, or 'X mm long'; entity_measured names the inflorescence kind and bract or bracteole. Sizes given 'across' are not scored.
  - var_in: flower_fertile_stamens_count
    unit_in: unit
    trait_name: flower_fertile_stamens_count
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Stamen number in male flowers.
  - var_in: flower_filament_length
    unit_in: unit
    trait_name: flower_filament_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Filament length in male flowers ('stamen filaments X mm long').
  - var_in: flower_ovules_per_functional_carpel_count
    unit_in: unit
    trait_name: flower_ovules_per_functional_carpel_count
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Family description 'ovules ..., 2 per locule'.
  - var_in: flower_perianth_parts_count
    unit_in: unit
    trait_name: flower_perianth_parts_count
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Number of perianth lobes ('perianth 6-lobed') of male or female flowers, counted as perianth parts.
  - var_in: flower_sepal_length
    unit_in: unit
    trait_name: flower_sepal_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Length of a perianth lobe (tepal; one perianth whorl, no petals) of male or female flowers, first dimension of 'L x W' or 'X mm long'; provisional mapping after Cheek_2012 question 4.
  - var_in: flower_structural_carpels_count
    unit_in: unit
    trait_name: flower_structural_carpels_count
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Ovary locules ('3--6(--9)-loculed'), one locule per carpel; family and Quercus descriptions only.
  - var_in: flower_style_length
    unit_in: unit
    trait_name: flower_style_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Style length in female flowers.
  - var_in: flowering_time
    unit_in: .na
    trait_name: flowering_time
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Months named in species Ecology paragraphs ('Flowering in June--July'); 'the whole year round' scored as all months. A family Ecology statement on anthesis (April--June) is kept at family rank.
  - var_in: fruit_colour
    unit_in: .na
    trait_name: fruit_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Colour of the acorn or nut (the fruit); hair colours and young fruits excluded.
  - var_in: fruit_dehiscence
    unit_in: .na
    trait_name: fruit_dehiscence
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family description 'Fruits indehiscent nuts'; copied to all species.
  - var_in: fruit_length
    unit_in: unit
    trait_name: fruit_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      First dimension of the acorn or nut size 'L x W' (fruit = nut; the cupule is not scored).
  - var_in: fruit_surface_hairs
    unit_in: .na
    trait_name: fruit_surface_hairs
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Indumentum of the acorn or nut when stated for the whole fruit; free-part, apical and glabrescent statements stay unmapped.
  - var_in: fruit_type
    unit_in: .na
    trait_name: fruit_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family and genus descriptions ('Fruits indehiscent nuts', 'Fruits (acorns)', 'Fruits (nuts)'): nut.
  - var_in: fruit_width
    unit_in: unit
    trait_name: fruit_width
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Second dimension of the acorn or nut size 'L x W', or a stated diameter.
  - var_in: fruiting_time
    unit_in: .na
    trait_name: fruiting_time
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Months named in species Ecology paragraphs ('fruiting between August and March', read as an inclusive range).
  - var_in: inflorescence_length
    unit_in: unit
    trait_name: inflorescence_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Inflorescence length; entity_measured names the inflorescence kind as printed (male, female, androgynous, mixed).
  - var_in: inflorescence_type
    unit_in: .na
    trait_name: inflorescence_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      'Spikes' in the family and genus descriptions; paniculate clusters of spikes are not scored as panicles.
  - var_in: leaf_apex_shape
    unit_in: .na
    trait_name: leaf_apex_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaf apex shape from the 'apex' clause; acumen length unmapped.
  - var_in: leaf_arrangement
    unit_in: .na
    trait_name: leaf_arrangement
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaf arrangement as stated (spirally arranged, crowded near the end of twigs).
  - var_in: leaf_base_shape
    unit_in: .na
    trait_name: leaf_base_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaf base shape from the 'base' clause.
  - var_in: leaf_compoundness
    unit_in: .na
    trait_name: leaf_compoundness
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family description 'Leaves simple'; copied to all species.
  - var_in: leaf_hairs_adult_leaves
    unit_in: .na
    trait_name: leaf_hairs_adult_leaves
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Hairy when either surface is stated hairy, glabrous when both are glabrous; not scored when a surface is glabrescent.
  - var_in: leaf_length
    unit_in: unit
    trait_name: leaf_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      First dimension of the leaf size 'L x W'.
  - var_in: leaf_length_to_width_ratio
    unit_in: unit
    trait_name: leaf_length_to_width_ratio
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Printed 'length:width ratio a--b:1'.
  - var_in: leaf_margin
    unit_in: .na
    trait_name: leaf_margin
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaf margin from the 'margin' clause (entire, toothed, serrulate as toothed_serrate).
  - var_in: leaf_margin_posture
    unit_in: .na
    trait_name: leaf_margin_posture
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaf margin posture from the 'margin' clause (plane as flat, revolute).
  - var_in: leaf_phenology
    unit_in: .na
    trait_name: leaf_phenology
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family description 'evergreen trees or shrubs'; copied to all species.
  - var_in: leaf_phyllotaxis
    unit_in: .na
    trait_name: leaf_phyllotaxis
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Whorled leaves ('in whorls of 3'); pseudowhorled not scored.
  - var_in: leaf_secondary_vein_angle
    unit_in: unit
    trait_name: leaf_secondary_vein_angle
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Printed angle between lateral veins and midrib ('forming an angle of 40--60 degrees with the midrib').
  - var_in: leaf_shape
    unit_in: .na
    trait_name: leaf_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaf blade shape; hyphenated shapes ('elliptic-oblong') score both levels.
  - var_in: leaf_width
    unit_in: unit
    trait_name: leaf_width
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Second dimension of the leaf size 'L x W'.
  - var_in: petiole_length
    unit_in: unit
    trait_name: petiole_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Petiole length as stated.
  - var_in: plant_diameter_breast_height
    unit_in: unit
    trait_name: plant_diameter_breast_height
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Trunk diameter from the habit clause ('up to 30 m tall, 50 cm diameter'), read as a maximum; height of measurement not stated.
  - var_in: plant_growth_form
    unit_in: .na
    trait_name: plant_growth_form
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Growth form from the habit clause (tree, treelet as tree, shrub).
  - var_in: plant_height
    unit_in: unit
    trait_name: plant_height
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Maximum height from the habit clause ('up to X m tall').
  - var_in: pollination_vector_known
    unit_in: .na
    trait_name: pollination_vector_known
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family Ecology statement naming genera (insects in Castanopsis, Lithocarpus and Trigonobalanus; wind in Quercus), scored at genus rank only.
  - var_in: root_system_type
    unit_in: .na
    trait_name: root_system_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Stilt-roots as stated, with their commonness word.
  - var_in: seedling_germination_location
    unit_in: .na
    trait_name: seedling_germination_location
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Genus descriptions ('Seed germination hypogeal/epigeal'); copied to species.
  - var_in: sex_type
    unit_in: .na
    trait_name: sex_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family description 'Monoecious'; copied to all species.
  - var_in: stem_base_form
    unit_in: .na
    trait_name: stem_base_form
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Buttresses as stated, with their commonness word.
  - var_in: stem_hairs
    unit_in: .na
    trait_name: stem_hairs
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Twig indumentum when stated without a change with age (glabrescent, 'when young' not scored).
