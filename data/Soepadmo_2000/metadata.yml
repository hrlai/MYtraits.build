questions:
  question1: |
    Perianth lobes. Fagaceae flowers have one perianth whorl of lobes
    (tepals) and no petals. Lobe length ("perianth lobes acute, c. 2 x 1
    mm") is scored as flower_sepal_length (130 rows, male and female flowers
    in entity_measured), following the provisional Cheek_2012 question 4
    rule, and "perianth 6-lobed" as flower_perianth_parts_count (66 rows).
    Confirm both mappings (a second family for the Cheek_2012 rule).
  question2: |
    Bract and bracteole sizes are often below 1 mm ("bracts and bracteoles
    ovate, c. 0.5 x 0.3 mm"). flower_bract_length allows 1--100 mm, so 81
    rows (all of this trait) are excluded by dataset_process(). Lower the
    traits.yml minimum (centrally), or accept the exclusion?
  question3: |
    Cupules (the woody cup or husk around the acorn or nut) have no trait.
    About 1,000 unmapped clauses describe them: size ("1.5--3 x 1--2.5 cm"),
    shape, stalk length, wall texture, how much of the acorn they cover,
    lamellae, spines and the number of nuts per cupule. Should MYtraits add
    cupule traits (for example cupule length and width, cupule covering), or
    keep them unmapped?
  question4: |
    Coppicing. "non-coppicing" (20 species), "often coppicing"
    (Castanopsis acuminatissima), "Trees with coppicing habit"
    (Trigonobalanus) and "producing many sucker-shoots at the base"
    (Trigonobalanus verticillata) are unmapped. resprouting_capacity_non_fire_disturbance
    needs a stated disturbance. Map coppicing to a trait (for example
    vegetative_reproduction_ability or clonal_spread_mechanism
    stem_suckers), or keep unmapped?
  question5: |
    Family Ecology statements (p. 2) are scored only at the rank they name
    and are not copied to species: pollination_vector_known insect
    (Castanopsis, Lithocarpus, Trigonobalanus) and wind (Quercus), at genus
    rank; dispersers vertebrates ("arboreal vertebrates such as squirrels"),
    flowering_time April--June ("Floral anthesis occurs during the following
    dry season (April--June)"), at family rank. Confirm, or copy the genus
    pollination vectors down to species?
  question6: |
    Leaf indumentum is stated per surface ("glabrous above, sparsely
    tomentose below"). leaf_hairs_adult_leaves is scored hairy when either
    surface is hairy and glabrous only when both are glabrous; a leaf with a
    glabrescent surface is not scored (84 species scored). Twig and acorn
    indumentum followed by "glabrescent" or "when young" is not scored.
    Confirm.
  question7: |
    Answered (issue 129, 2026-11-02): hyphenated leaf shapes
    ("elliptic-oblong", "ovate-lanceolate") score both levels in all
    datasets, as the skill's compound-shape rule says. The shared seed no
    longer blocks them, so this dataset needs no local override; Coode_2018,
    Lim_2010, Kochummen_1995 and Adema_1996 were rebuilt to match. No
    decision needed.
  question8: |
    Acorn and nut sizes "L x W" are read as fruit_length then fruit_width.
    Depressed acorns are wider than long (Lithocarpus pulcher 2--3 x 4--5
    cm), consistent with length being the height along the fruit axis.
    Confirm.
  question9: |
    "Tree up to 30 m tall, 50 cm diameter" gives plant_height maximum and
    plant_diameter_breast_height maximum (100 species each); the height of
    the diameter measurement is not stated. Confirm.
  question10: |
    New mapping: "forming an angle of 40--60 degrees with the midrib" ->
    leaf_secondary_vein_angle minimum and maximum (146 rows, unit deg; "c.
    45" as a mean). Lateral vein number ("6--10 pairs") has no trait and is
    unmapped. Confirm the angle mapping.
  question11: |
    Partly toothed margins ("toothed above the middle", "remotely serrulate
    in the apical half") are scored leaf_margin toothed or toothed_serrate.
    Confirm.
