  value: value
  location_name: site
  individual_id: tag_no
  description:
    The dataset consists of plant seedling functional traits and environmental
    covariates collected from 36 plots established in the Malua forest near the
    Sabah Biodiversity Experiment (SBE) study site. Physiological traits were
    only collected at 12 plots. Growth data was collected between 2016-2020
    where censuses were conducted every 6 months. Physiological and
    morphological trait data were collected between January and June of 2020.
  basis_of_record: field
  life_stage: seedling
  sampling_strategy:
    In early 2020, roughly 5 years after trees were originally planted, we
    sampled all trees in the high- and low-density treatments for a suite of
    traits that would indicate tree responses to light, water availability and
    topography.
