dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '2012'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description: |
    Morphological traits of the Chrysobalanaceae of Peninsular Malaysia (6
    genera, 14 species and 5 subspecies: Atuna 4, Kostermanthus 2, Licania 1,
    Maranthes 1, Parastemon 1, Parinari 5), extracted from the family
    treatment in the Flora of Peninsular Malaysia.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: |
    Born-digital PDF (assets/myflora_metadata.csv); rows come from the PDF
    text layer (pdf pages 7--40, printed 13--46) read with
    flora_read_pdf_lines() and segmented by raw/segment_source.R. No page
    was image-checked: flora_layer_flags() flagged only the front matter,
    the plate (pdf 42, printed 335; photographs with credits only), the
    full-page Figures 1--6 and a map page (pdf 16, 19, 22, 26, 28, 37, 40;
    low text, captions in the layer); no bad glyphs and no page-number
    breaks in the treatment. raw/build_trait_data.R splits each family,
    genus, species and subspecies description into sentences, ';' pieces and
    ',' clauses, assigns each clause to an organ and scores configured
    traits; every other clause stays verbatim as an unmapped row.
    Parenthetical asides that are not numbers ('(elsewhere ...)', '(except
    in P. congolana ...)') are taken out before scoring and kept as unmapped
    rows. Unqualified single-level family and genus values are copied to
    member taxa silent on the trait when every member that states the trait
    agrees (inferred_from_family / inferred_from_genus); subspecies silent
    on a trait inherit their species description. Ranges are minimum and
    maximum, parenthetical extremes are extreme_range rows, a single or
    "c." value is a mean and "to" values are maxima. Hedged statements are
    not scored. Population region is Peninsular Malaysia for species and
    subspecies descriptions (FPM guide); copied family and genus values and
    cited observations have none. Keys and figure captions are not trait
    evidence.
  original_file: |
    Chrysobalanaceae.pdf (Prance 2012, Flora of Peninsular Malaysia Series
    II vol. 3, pp. 13--46)
  notes: |
    data.csv is raw/trait_data.csv with the columns added by
    flora_make_data(). Taxon names are as printed. All 14 accepted species
    and 5 subspecies (Atuna racemosa subsp. racemosa and subsp. excelsa;
    Parinari costata subsp. costata, polyneura and rubiginosa) have a
    description and are scored; there are no excluded or incompletely known
    taxa. The Atuna racemosa and Parinari costata species descriptions are
    scored at species rank, their subspecies descriptions at subspecies
    rank; the P. costata subspecies descriptions give differences only.
    Atuna latifrons and Kostermanthus malayanus are known only from the type
    collection and have no fruits; Atuna penangiana fruits are described
    from immature material and their size is not scored. Of 1,872 rows in
    raw/trait_data.csv, 826 are mapped (589 from the taxa's own
    descriptions and cited observations, 117 copied from family, 52 from
    genus and 68 inherited by subspecies from species) and 1,046 are
    unmapped: 914 description clauses and 132 sentences of Distribution,
    Ecology, Conservation status, Uses, Taxonomy, Note and vernacular
    names. Most frequent unmapped characters: stipules (shape, size,
    persistence), receptacle indumentum and shape, sepal and petal shape,
    indumentum and number, lateral vein number and relief, leaf and petiole
    glands, leaf texture (chartaceous, coriaceous), inner bark and sapwood
    colour, twig and petiole indumentum, epicarp (verrucose, lenticellate),
    endocarp texture and thickness, filaments, pedicels, cotyledons,
    altitude, habitat and conservation status (summary in
    raw/unmapped_terms.csv). Flower visitors, scent and dispersers cited in
    the Licania splendens and Maranthes corymbosa Ecology paragraphs
    (Prance & White 1988; Corner 1988) are in raw/manual_rows.csv with
    source_id and no population region; the hedged bat pollination of
    Maranthes and the genus statements on hornbills and wild boar eating
    Parinari fruits are not scored. Source repairs (missing punctuation
    only) are in raw/source_fixes.csv. Types and types of synonyms are in
    raw/Prance_2012_vouchers.csv; the figures are reproduced from other
    floras and give no specimens.
identifiers: .na
locations: .na
contexts:
  - context_property: commonness qualifier
    category: entity_context
    var_in: commonness_qualifier
  - context_property: population region
    category: entity_context
    var_in: population_region
  - context_property: entity measured
    category: method_context
    var_in: entity_measured
  - context_property: trait scoring method
    category: method_context
    var_in: trait_scoring_method
traits:
  - var_in: bark_colour
    unit_in: .na
    trait_name: bark_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Colour of the outer bark (''Bark grey-brown, smooth''); every colour word scored in text order; patches and colours that change with age not scored.'
  - var_in: bark_texture
    unit_in: .na
    trait_name: bark_texture
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Outer bark texture (''smooth'', ''coarsely flaky''); states that change with age (''becoming smooth'') not scored.'
  - var_in: dispersers
    unit_in: .na
    trait_name: dispersers
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Dispersers named in species Ecology paragraphs from cited works (Prance & White 1988): fruit pigeon (Licania splendens), hornbills and fruit pigeons (Maranthes corymbosa), scored as birds.'
  - var_in: flower_anther_attachment
    unit_in: .na
    trait_name: flower_anther_attachment
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Family description ''anthers small, dorsifixed''; copied to all species.'
  - var_in: flower_anther_colour
    unit_in: .na
    trait_name: flower_anther_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: '''anthers yellow'' in species descriptions.'
  - var_in: flower_anther_dehiscence
    unit_in: .na
    trait_name: flower_anther_dehiscence
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Family description ''anthers ... longitudinally dehiscent''; copied to all species.'
  - var_in: flower_bract_length
    unit_in: unit
    trait_name: flower_bract_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Length of bracts and bracteoles (''bracts and bracteoles to 15 mm long''); entity_measured names them.'
  - var_in: flower_colour
    unit_in: .na
    trait_name: flower_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Petal colour (''petals white'', ''petals blue or white''); tinges and markings not scored; filament and style colours unmapped.'
  - var_in: flower_fertile_stamens_count
    unit_in: unit
    trait_name: flower_fertile_stamens_count
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Stamen number (''stamens 13--20'', ''fertile stamens 7--9 with tooth-like staminodes opposite'', ''stamens 2 fertile with 3 sterile staminodes''); staminodes not counted (question 5).'
  - var_in: flower_filament_length
    unit_in: unit
    trait_name: flower_filament_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Filament length (''filaments 10--12 mm long'').'
  - var_in: flower_length
    unit_in: unit
    trait_name: flower_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Flower length (''Flowers 8--17 mm long'').'
  - var_in: flower_perianth_symmetry
    unit_in: .na
    trait_name: flower_perianth_symmetry
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Family and genus descriptions (''Flowers bisexual, zygomorphic''); actinomorphic scored as actinomorphic_general; genus values copied to member species.'
  - var_in: flower_petal_length
    unit_in: unit
    trait_name: flower_petal_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Petal length (''petals ... 10--11 mm long''); the unequal petals of Kostermanthus heteropetalus (''largest to 15 mm'', ''others ... to 6 mm'') are unmapped.'
  - var_in: flower_scent_production
    unit_in: .na
    trait_name: flower_scent_production
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Maranthes corymbosa Ecology: ''Corner (1988) noted that the flowers smell of milk and seaweed''.'
  - var_in: flower_sepal_length
    unit_in: unit
    trait_name: flower_sepal_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Sepal length (''sepals ... 5--10 mm long'').'
  - var_in: flower_stamen_length
    unit_in: unit
    trait_name: flower_stamen_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Stamen length when stated for the stamen rather than the filament (''stamens 13--20, 8--15 mm long'').'
  - var_in: flower_structural_carpels_count
    unit_in: unit
    trait_name: flower_structural_carpels_count
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Carpel number from family and genus descriptions (''gynoecium of 1--3 carpels'', ''ovary 1-carpellate'', ''ovary 2--3-carpellate'').'
  - var_in: flower_structural_sex_type
    unit_in: .na
    trait_name: flower_structural_sex_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Family and genus descriptions (''Flowers bisexual''); genus values copied to member species.'
  - var_in: flower_style_length
    unit_in: unit
    trait_name: flower_style_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Style length (''style to 15 mm long'').'
  - var_in: flower_tube_length
    unit_in: unit
    trait_name: flower_tube_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Length of the receptacle tube (hypanthium), entity_measured ''receptacle tube'' (question 2); for ''L x W'' sizes the first dimension (question 1).'
  - var_in: flower_visitor
    unit_in: .na
    trait_name: flower_visitor
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Maranthes corymbosa Ecology citing Prance & White (1988): flowers visited by Trigona bees (stingless_bee), moths and the butterfly Graphium scarpedon. Bat pollination (''suggested ... may also be pollinated'') is hedged and not scored.'
  - var_in: fruit_colour
    unit_in: .na
    trait_name: fruit_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Colour of the ripe fruit (''Fruits ripening bright red'') or epicarp (''epicarp yellow-brown''); unripe colours (''pale green or cream-white, ripening pink'') and warts not scored.'
  - var_in: fruit_fleshiness
    unit_in: .na
    trait_name: fruit_fleshiness
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: '''Fruits fleshy'', ''mesocarp thin, fleshy'', ''epicarp smooth and fleshy''; family ''Fruit a fleshy drupe (rarely dry)'' kept at family rank (qualified, not copied).'
  - var_in: fruit_length
    unit_in: unit
    trait_name: fruit_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Fruit length (''2.5--4 cm long''). Immature fruits (Atuna penangiana) not scored.'
  - var_in: fruit_surface_hairs
    unit_in: .na
    trait_name: fruit_surface_hairs
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Epicarp indumentum (''epicarp glabrous''); Atuna and Kostermanthus genus values copied to member species.'
  - var_in: fruit_type
    unit_in: .na
    trait_name: fruit_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Family description ''Fruit a fleshy drupe''; copied to all species.'
  - var_in: fruit_wall_thickness
    unit_in: unit
    trait_name: fruit_wall_thickness
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Mesocarp thickness (''mesocarp 5--8 mm thick'', ''mesocarp 2--2.5 mm''), entity_measured ''mesocarp'' (question 3); endocarp thickness unmapped.'
  - var_in: fruit_width
    unit_in: unit
    trait_name: fruit_width
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Fruit width (''1.5--2 cm wide'') or a stated diameter (''to 7.5 cm diameter'').'
  - var_in: inflorescence_length
    unit_in: unit
    trait_name: inflorescence_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Inflorescence length (''axillary racemes 3--7 cm long''); widths (''6--12 cm across'', ''7--12 cm broad'') unmapped.'
  - var_in: inflorescence_type
    unit_in: .na
    trait_name: inflorescence_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Inflorescence form and position (''axillary racemes or little-branched panicles''); ''raceme-like reduced panicles'' (Parinari elmeri) scored as panicle only; cymules not scored.'
  - var_in: leaf_apex_shape
    unit_in: .na
    trait_name: leaf_apex_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Leaf apex (''apex acuminate with acumen 3--10 mm long''); a blunt acumen scored as acuminate.'
  - var_in: leaf_base_shape
    unit_in: .na
    trait_name: leaf_base_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Leaf base (''base rounded to subcordate''); subcordate and subcuneate have no level and are not scored; ''round'' scored as rounded.'
  - var_in: leaf_compoundness
    unit_in: .na
    trait_name: leaf_compoundness
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Family description ''Leaves simple''; copied to all species.'
  - var_in: leaf_hairs_adult_leaves
    unit_in: .na
    trait_name: leaf_hairs_adult_leaves
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Per-surface indumentum of the lamina: hairy when a surface is hairy, glabrous when both are; not scored when a surface is young, glabrescent or partly hairy (''except for sparsely pilose venation''), or for alternatives. Hairs filling the stomatal cavities beneath (Parinari) scored as hairy (question 4).'
  - var_in: leaf_length
    unit_in: unit
    trait_name: leaf_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'First dimension of the lamina size ''L x W'' (question 1).'
  - var_in: leaf_length_to_width_ratio
    unit_in: unit
    trait_name: leaf_length_to_width_ratio
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Printed leaf index ''(index 1.7--2.7)'' of the Parinari costata subspecies (question 7).'
  - var_in: leaf_margin
    unit_in: .na
    trait_name: leaf_margin
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Family description ''Leaves simple, entire''; copied to all species.'
  - var_in: leaf_phyllotaxis
    unit_in: .na
    trait_name: leaf_phyllotaxis
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Family description ''Leaves ... alternate''; copied to all species.'
  - var_in: leaf_shape
    unit_in: .na
    trait_name: leaf_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Lamina shape; hyphenated shapes (''oblong-lanceolate'') score both levels.'
  - var_in: leaf_surface_reflectivity
    unit_in: .na
    trait_name: leaf_surface_reflectivity
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: '''shiny above'', ''glossy above''.'
  - var_in: leaf_width
    unit_in: unit
    trait_name: leaf_width
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Second dimension of the lamina size ''L x W'' (question 1).'
  - var_in: petiole_length
    unit_in: unit
    trait_name: petiole_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Petiole length (''petioles 2--4 mm long'', ''petioles 2--5 mm'').'
  - var_in: plant_diameter_breast_height
    unit_in: unit
    trait_name: plant_diameter_breast_height
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Bole diameter (''bole to 50 cm diameter''); ''bole to 30 m tall and 1 m diameter'' read as a maximum.'
  - var_in: plant_growth_form
    unit_in: .na
    trait_name: plant_growth_form
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Habit (''Medium-sized tree'', ''Big tree to 40 m tall or a shrub'', ''Big tree ... but sometimes a shrub'').'
  - var_in: plant_height
    unit_in: unit
    trait_name: plant_height
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Plant height (''tree to 30 m tall'', ''Small tree to 10 m''); ''beginning to flower at 5 m'' and bole height unmapped.'
  - var_in: sex_type
    unit_in: .na
    trait_name: sex_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: '''Flowers polygamo-dioecious'' (Parastemon urophyllus); family ''rarely polygamous'' kept at family rank.'
  - var_in: stem_base_form
    unit_in: .na
    trait_name: stem_base_form
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Buttresses and fluting of the bole (''often fluted with steep buttresses at base''); ''unbuttressed'' and ''fluted or not'' not scored.'
