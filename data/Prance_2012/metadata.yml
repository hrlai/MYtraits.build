questions:
  question1: 'Dimension pairs. ''a x b'' sizes are read as length x width for the lamina (all species and subspecies with a size) and the receptacle tube of Maranthes corymbosa (''2.5--4 x 2.5--4 mm''). Confirm.'
  question2: 'Receptacle tube. The hypanthium of Chrysobalanaceae is printed as the ''receptacle'' or ''receptacle tube'' (''receptacle narrow and cylindrical, 8--13 mm long''). Its length is scored as flower_tube_length with entity_measured ''receptacle tube'' (31 rows, family to subspecies). Confirm the mapping, or keep the receptacle unmapped.'
  question3: 'Mesocarp thickness (''mesocarp 5--8 mm thick'', ''mesocarp 2--2.5 mm'') is scored as fruit_wall_thickness with entity_measured ''mesocarp'' (11 rows, 7 taxa); the traits.yml definition says fruit wall thickness often means the fleshy layers. Endocarp thickness (''endocarp 1--3 mm'', ''7--13 mm thick'') is unmapped. Confirm, or score the endocarp too, or keep both unmapped.'
  question4: 'Parinari leaf hairs. ''with stomatal cavities filled with grey lanate pubescence beneath'' (P. oblongifolia) and ''the lower surface with stomatal cavities filled with pubescence'' (P. rigida) are scored leaf_hairs_adult_leaves hairy. P. costata is not scored, because its sentence also describes very young leaves. Confirm that hairs confined to stomatal cavities make a leaf hairy.'
  question5: 'Stamen counts. ''stamens c. 20 ... with tooth-like staminodes opposite'' (Atuna) and the family ''stamens 2--100 ... all fertile or some without anthers'' are scored as flower_fertile_stamens_count, assuming the printed count excludes the staminodes (43 rows). Where the text says ''fertile stamens 7--9'' or ''stamens 2 fertile'' the count is explicit. Confirm, or score the family range only as a total stamen count (no trait).'
  question6: 'Voucher conflict. Kostermans & Anta 1136 (BO) is cited as the neotype of Parinari scabra under Atuna racemosa subsp. racemosa from ''Java'' (p. 20) and as the neotype of Petrocarya excelsa under subsp. excelsa from ''Sumatra, Bangka, Lobok Besar'' (p. 21). Both are kept in raw/Prance_2012_vouchers.csv as printed. Check Flora Malesiana 1, 10 (1989) and decide which citation is correct.'
  question7: 'Leaf index. The Parinari costata subspecies give ''(index 1.7--2.7)'' and ''(index 2.3--3.65)'' after the lamina size; read as length divided by width and scored as leaf_length_to_width_ratio (4 rows). Confirm.'
  question8: 'Petal colour of Kostermanthus heteropetalus: ''petals white tinged pink or deep red''. It is unclear whether ''deep red'' is an alternative petal colour or part of the tinge, so the clause is unmapped. Decide: score white only, white and red, or keep unmapped.'
