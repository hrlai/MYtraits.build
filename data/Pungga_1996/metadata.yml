taxonomic_updates: .na
exclude_observations: .na
questions:
  question1: |
    dispersal_appendage is scored wings for the samara wing ("Fruitlet a
    samara with membranous wing", family; "with transparent wing",
    C. terminale), and the family value is copied to the other three
    species (5 rows). The level wings is defined as a seed extension; the
    wing here is on the fruitlet. Keep wings, or use wing_or_plume?
  question2: |
    C. equisetifolia: "Female inflorescences on lateral woody persistent
    twigs, c. 0.5 cm long" (p. 121) is read as the inflorescence length
    (inflorescence_length 0.5 cm mean, entity_measured female
    inflorescence; 1 row). It could instead give the length of the twigs.
    Confirm the reading.
  question3: |
    C. equisetifolia "style red, 0.3--0.5 cm long" (p. 121) is scored as
    flower_style_length (female flower; 2 rows). The family describes the
    female flower as having "2-branched, divergent stigmas", so the
    structure printed as "style" may be the stigmatic branches. Keep as
    style length, move to flower_stigma_length, or leave unmapped?
  question4: |
    Inflorescence mappings: spikes "at the end(s) of needle-shaped twigs"
    read as terminal (Casuarina, Gymnostoma genera); "capitate" read as head
    (G. nobile, G. sumatranum); a "globose cone" or "globose cone-like
    structures" read as inflorescence_shape spherical (family, Ceuthostoma,
    Gymnostoma; copied to all four species). Not scored: "terminal or
    subterminal" (family, Gymnostoma, G. nobile), "lateral" (Casuarina,
    C. equisetifolia), family male "spike-like structures", "simple or
    compound", and G. nobile male "compound, cone-like structures". Confirm
    the mappings, and decide whether "terminal or subterminal" should be
    scored terminal.
  question5: |
    Sex: the family "Dioecious or less commonly monoecious" is scored
    dioecious (usually) and monoecious (less often). Casuarina and
    Gymnostoma genera give "dioecious or monoecious" (two levels, not
    copied), so G. nobile and G. sumatranum have no sex_type; C.
    equisetifolia is monoecious and C. terminale gets dioecious from the
    Ceuthostoma genus. Neither the AusTraits flora datasets nor this
    treatment gives the sex of G. nobile or G. sumatranum; a source for
    Borneo material is needed. flower_structural_sex_type (unisexual) is implied by
    the separate male and female flowers but never stated, so it is not
    scored. Confirm the "less often" label, and decide whether unisexual
    should be scored at family rank.
  question6: |
    Family counts are scored at family rank only, because numbers are never
    copied down: male perianth lobes 1--2, one stamen per male flower, one
    carpel per female flower, one seed per samara (p. 119). The species
    therefore have no values for these traits although the family states
    them without exception. Keep the rule, or allow invariant family counts
    to be copied?
  question7: |
    Bark texture: "fissured" scored as furrowed and "flakes", "flaking",
    "flaky" as flaky. Unmapped: "ridged" (Casuarina, C. equisetifolia),
    "scaly" (C. terminale, G. nobile), "peeling off into long broad strips"
    (C. terminale) and "shedding off" / "peeling off" into flakes (the flaky
    value is kept). Adema_1996's dictionary maps "peeling" to papery; that
    is not applied here. Should "ridged" count as furrowed, and strips as
    fibrous or stringy?
  question8: |
    Vouchers (raw/Pungga_1996_vouchers.csv): the Fig. 3 caption reads "(A--D
    and from Chew CWL 1389, ...)" (p. 126; image-checked, the gap is in the
    print). Part F (samara) is the only part not otherwise cited, so the
    missing letter is probably F; it is not inferred. The C. equisetifolia
    type is "Rumphius, Herbarium Amboniense 3 (1743) t. 57", an
    illustration, with no status printed; it is recorded with a blank
    status. Confirm both.
  question9: |
    Candidate traits with no entry in config/traits.yml (rows unmapped, see
    raw/unmapped_terms.csv): needle-twig characters other than internode
    length and thickness (twig length, ribs, furrows, stomata, furrow hairs),
    scale-leaves per node and scale-leaf size and shape, fruit cone
    characters (left unmapped, as in the AusTraits flora datasets), bole form
    (straight, cylindrical, twisted), crown shape, wood hardness and
    heartwood colour, stigma branches, floral bracts and bracteoles,
    polyembryony ("often with more than one embryo") and cotyledon number,
    caducous male perianth, altitude (sea level to 2000 m; species 100--1500
    m, to 1000 m, 600--1800 m), habitat and soil (beach sand, kerangas,
    ultramafic soils, peat swamp), gregarious growth, legal protection
    (C. equisetifolia, Sarawak) and uses. Which, if any, should be added
    centrally?
