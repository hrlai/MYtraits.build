  dataset_curators: Hao Ran Lai
dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '2010'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description:
    To describe the morphology, distribution and ecology of Pentaphylacaceae of
    Peninsular Malaysia, represented by one species, Pentaphylax euryoides, as
    part of the Flora of Peninsular Malaysia.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy:
    The treatment was transcribed from page images of the PDF
    (raw/Pentaphylacaceae_transcription.txt); the PDF's OCR text layer was not
    used. Trait values were entered clause by clause by script
    (raw/build_trait_data.R) from the family, genus and species descriptions and
    the species Ecology paragraph; keys, maps and figures were not used. Each
    value keeps the clause it came from (trait_value_raw), the source term
    (trait_value) and the page. Alternatives qualified by a commonness word
    (usually, sometimes, rarely) are recorded on separate rows; parenthetical
    extremes of a range are recorded on commonness qualifier = extreme_range
    rows. A measured range is recorded as minimum and maximum values, a single
    or 'c.' value as a mean and 'to X' as a maximum. Categorical values from the
    genus description are applied to the species (trait_scoring_method =
    inferred_from_genus; the family is monogeneric).
  original_file:
    Pentaphylacaceae.pdf (Yao 2010, Flora of Peninsular Malaysia Series II vol.
    1, pp. 161--164)
  notes:
    'data.csv is raw/trait_data.csv (written by raw/build_trait_data.R), without
    unmapped rows, with three columns added by raw/extra_R_code_Yao_2010.R:
    value (the build column; the source term for categorical traits, mapped with
    substitutions), trait_scoring_method (from rank_scored_from) and source_id.
    Taxon names are as printed. Type and figure specimens are listed in
    raw/Yao_2010_vouchers.csv. Characters with no trait in traits.yml are kept
    as unmapped rows (blank trait) in raw/trait_data.csv and summarised in
    raw/unmapped_terms.csv: stipules, venation, bracteoles, perianth parts and
    aestivation, ovule count, capsule valves, seed shape and wing size, embryo,
    sepal and petal width, organ hairs and shapes, leaf texture and colour in
    life, size at first flowering, habitat and elevation, distribution,
    conservation status, aluminium accumulation, uses.'
identifiers: .na
locations: .na
contexts:
