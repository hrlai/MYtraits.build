substitutions:
  - trait_name: plant_canopy_form
    find: 'dense crowns'
    replace: 'dense-crowned'
  - trait_name: leaf_arrangement
    find: 'spirally arranged'
    replace: 'spiral'
  - trait_name: inflorescence_type
    find: 'axillary, spike-like; solitary flowers'
    replace: 'axillary spike solitary'
  - trait_name: flower_perianth_symmetry
    find: 'actinomorphic'
    replace: 'actinomorphic_general'
  - trait_name: flower_anther_dehiscence
    find: 'terminal pores'
    replace: 'poricidal'
  - trait_name: fruit_dehiscence
    find: 'splitting loculicidally'
    replace: 'dehiscent'
  - trait_name: plant_growth_form
    find: 'Shrub or small to medium-sized tree'
    replace: 'shrub tree'
  - trait_name: bark_texture
    find: 'smooth or rugose; flaking-off in small papery scales'
    replace: 'smooth rough flaky'
  - trait_name: bark_colour
    find: 'dark brown to black'
    replace: 'brown_dark black'
  - trait_name: bark_colour
    find: 'yellow to reddish brown'
    replace: 'yellow brown'
  - trait_name: stem_hairs
    find: 'sparsely minutely pubescent'
    replace: 'hairy'
  - trait_name: leaf_shape
    find: 'lanceolate to elliptic'
    replace: 'lanceolate elliptical'
  - trait_name: leaf_shape
    find: 'ovate or falcate'
    replace: 'ovate falcate'
  - trait_name: leaf_surface_reflectivity
    find: 'glossy'
    replace: 'shiny'
  - trait_name: leaf_hairs_adult_leaves
    find: 'sparsely minutely pubescent'
    replace: 'hairy'
  - trait_name: leaf_hairs_adult_leaves
    find: 'subglabrous'
    replace: 'glabrous'
  - trait_name: leaf_hairs_adult_leaves
    find: 'sparsely, or minutely pubescent'
    replace: 'hairy'
  - trait_name: leaf_base_shape
    find: 'cuneate to slightly rounded'
    replace: 'cuneate rounded'
  - trait_name: leaf_margin_posture
    find: 'slightly revolute'
    replace: 'revolute'
  - trait_name: flower_colour
    find: 'white to pale green'
    replace: 'white_cream green'
  - trait_name: fruit_colour
    find: 'ripening brown to black'
    replace: 'brown black'
  - trait_name: dispersal_appendage
    find: 'wing'
    replace: 'wings'
  - trait_name: dispersal_syndrome
    find: 'wind dispersal'
    replace: 'anemochory'
taxonomic_updates: .na
exclude_observations: .na
questions:
  question2:
    'The author is given only as T. L. Yao (Forest Research Institute Malaysia);
    no full given name or ORCID was found.'
  question3:
    "Dispersal syndrome is scored anemochory from 'The dehiscent fruits with
    winged seeds suggest wind dispersal.' The author hedges (suggest), and the
    sentence is an inference from fruit and seed morphology. Kept on the
    curator's decision; confirm."
  question4:
    "Flowering time is scored all 12 months from 'flowers more-or-less
    continuously throughout the year' (hedged), population region = Peninsular
    Malaysia. Confirm."
  question5:
    'Judgement mappings to check -- bark texture rugose -> rough; bark colour
    reddish brown -> brown; leaf hairs subglabrous -> glabrous; fruit diameter
    -> fruit_width; bud diameter -> bud_width; actinomorphic ->
    actinomorphic_general; spike-like -> spike; carpel count 5 inferred from
    5-locular ovary; bole diameter to 10 cm -> plant_diameter_breast_height
    (height of measurement not stated).'
  question6:
    "The sentence 'glossy above, sparsely minutely pubescent, subglabrous
    beneath' is ambiguous; adaxial leaf hairs are scored hairy and abaxial
    glabrous (usually) / hairy (rarely, 'so near the base')."
  question7:
    "Sepal '(0.5)-1 x c. 1 mm' and petal 'c. 2-3 x (0.5)-1.5 mm' are read as
    length x width. Lengths are scored; widths are kept as unmapped rows
    (candidate flower_sepal_width, flower_petal_width)."
  question8:
    "'without buttresses' and 'without stipules' are not scored (stem_base_form
    has no 'absent' level). 'beginning to flower at 60 cm' is unmapped (size at
    first flowering, not plant height). Leaf arrangement spiral is scored;
    leaf_phyllotaxis has no spiral level."
  question9:
    "The text was transcribed from page images (pdf pages 8, 9, 11), not the OCR
    layer. OCR errors fixed against the image: SFNJ 1332 -> SFN11332, '(0.5}-1'
    -> (0.5)-1, '(--6)' -> (-6). The Flora chapter has no Methods text, so
    sampling_strategy describes the extraction. "
