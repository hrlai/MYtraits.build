taxonomic_updates: .na
exclude_observations: .na
questions:
  question1: 'Syncarp versus fruit. Benstonea and Pandanus fruits are drupes (or phalanges of fused drupes) packed into a syncarp (compound fruiting head); Freycinetia berries likewise. Following the Casuarinaceae cone rule (Pungga_1996), syncarp size, shape and drupe number are unmapped (57 rows, 46 taxa) and the drupe or berry is scored as the fruit (fruit_length, fruit_width). Ripe syncarp colour (e.g. B. affinis "maturing red-orange to brick red", 11 rows) is scored as fruit_colour with entity_measured = syncarp, because the syncarp surface is the exposed drupe tops. Confirm, or decide on an infructescence trait for syncarp size.'
  question2: 'Phalanges. In P. dubius, P. kaida, P. odorifer and P. tectorius the drupes are fused into phalanges (multi-carpellate units that fall as one). Phalange sizes are scored as fruit_length and fruit_width with entity_measured = phalange (17 rows; P. odorifer and P. tectorius by hand in raw/manual_rows.csv because the size is two clauses after the word). AusTraits (ABRS_2023) scores Pandanus polydrupes the same way. P. klossii "drupes ... 60--100 x 20--39 mm" are connate in phalanges but printed as drupes and scored without entity_measured. Confirm.'
  question3: 'Dimension triples. Drupe sizes are printed "length x width x thickness" (e.g. B. affinis "20--22 x 4--6 x 2--3 mm"); the first is scored as fruit_length, the second as fruit_width, the third is not scored. Seed and anther "a x b" sizes are read as length x width. Confirm, or say whether the third dimension should go to fruit_height.'
  question4: 'Growth form. Arborescent pandans score plant_growth_form = tree palmoid and pandan shrubs shrub palmoid (standing rule, user 2026-10-30), including the Freycinetia kamiana shrub ("Shrubs to 2 m tall or climber"). Ten species are described only as "pandan" (e.g. "Clustering pandan, trunk 2--7 m tall", "Massive acaulescent pandan") and get no growth form. Decide whether "pandan" alone should score palmoid (and with which noun).'
  question5: 'Heights. (a) A height given for the trunk or stem ("Trunk to 2--3 m tall", "Shrubs with stems 30--60 cm tall") is scored as plant_height with entity_measured trunk or stem (9 species), following the tree-fern rule. (b) Freycinetia climber lengths "2--18 m long" (F. imbricata, F. javanica, F. sumatrana) and F. angustifolia "Climber on trees 1.5 m high or more" (minimum) are scored as plant_height_climbing_plant. Confirm both.'
  question6: 'Leaf armature (help wanted). Prickles on leaf margins, the midrib beneath and the upper-surface pleats (length, colour, direction, spacing, position along the leaf) are the main diagnostic characters of Benstonea and Pandanus and are unmapped (about 190 rows, 49 taxa). config/traits.yml has no leaf prickle trait; plant_spinescence is a whole-plant density scale. Decide whether to propose a leaf armature trait centrally (e.g. presence and length of marginal prickles).'
  question7: 'Leaf base. (a) Freycinetia leaf-base auricles ("leaf base auricles 15--20 x 3.5--5 mm") are scored as leaf_base_shape = auriculate (9 species). (b) "Base amplexicaul" (18 Benstonea and Pandanus species) and Pandanus genus "leaf-base half-amplexicaul" stay unmapped, as in Cheek_2012 question 8. The family "base sheathing" is not copied down because Freycinetia species score auriculate only. Confirm (a), and decide (b) together with Cheek_2012 question 8.'
  question8: 'Cultivated and non-native taxa. P. amaryllifolius, P. kaida and P. tectorius (section "Cultivated Plants") are scored with a "cultivated" note (38 mapped rows, including copy-down); sizes of harvested or pruned plants are not scored. P. polycephalus and P. nitidus ("Not accepted as native", no Peninsular Malaysian record) are not scored. Confirm.'
