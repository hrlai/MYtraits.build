dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '2023'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description:
    Pandanaceae (Benstonea, Freycinetia and Pandanus; 45 native species and
    three cultivated species) of Peninsular Malaysia.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: |
    Born-digital PDF (assets/myflora_metadata.csv); rows come from the PDF text
    layer (pdf pages 8--106, printed 117--215) read with flora_read_pdf_lines()
    and segmented by raw/segment_source.R. No page was image-checked:
    flora_layer_flags() flagged only the front matter, the full-page Figures
    3--13 (low text; captions in the layer) and the plates (pdf 108--137,
    photographs); no bad glyphs, no page-number breaks and no decimals split
    by a space in the treatment. Two missing closing parentheses are repaired
    in raw/source_fixes.csv. Each Description sentence was split into ';'
    pieces and ',' chunks outside parentheses; chunks were scored by organ in
    raw/build_trait_data.R, and every other chunk is kept verbatim as an
    unmapped row. Unqualified single-level family and genus values are copied
    to member species silent on the trait when no member disagrees
    (trait_scoring_method inferred_from_family or inferred_from_genus);
    male-flower values are not copied to species whose males are unknown.
    Ranges are minimum and maximum, parenthetical extremes are extreme_range
    rows, a single or "c." value is a mean, "to" values are maxima and "or
    more" values minima. Hedged statements (probably, possibly, apparently,
    "?", "assumed", "more-or-less" before a number) are not scored. Population
    region is Peninsular Malaysia for species descriptions (FPM guide).
  original_file:
    Pandanaceae.pdf (Beentje & Callmander 2023, Flora of Peninsular Malaysia
    Series II vol. 10, pp. 117--215)
  notes: |
    Mapped and unmapped rows share raw/trait_data.csv; raw/unmapped_terms.csv
    summarises the unmapped rows by organ and character. Largest unmapped
    groups: syncarp (compound fruiting head) shape, size and drupe number
    (question 1); leaf armature, i.e. prickle size, colour, direction and
    spacing on margins, midrib and pleats (49 taxa; question 6); leaf colour
    per surface, texture (coriaceous, chartaceous), venation (parallel veins
    per half, tessellate), M-shaped section and pleats; amplexicaul bases
    (18 taxa; question 7); caudate or cucullate leaf apices and cauda length;
    trunk and stem diameter, colour and leaf scars; prop/stilt root size;
    inflorescence bracts, peduncle, spikes and stamen phalanges; pileus,
    style, stigma, endocarp and mesocarp of the drupe; stigmas per berry.
    Distribution, Ecology (habitat, altitude, swamp, limestone), Conservation
    status, Uses, Taxonomy, Notes and vernacular names are kept as unmapped
    sentences. Keys, the "Spot characters" and "Specific habitats" lists and
    figure captions are not read. The cultivated species (P. amaryllifolius,
    P. kaida, P. tectorius; section "Cultivated Plants") are scored with a
    "cultivated" note; P. kaida and P. amaryllifolius sizes of harvested or
    pruned plants and P. amaryllifolius male inflorescences "not seen in
    Peninsular Malaysia" are not scored. P. polycephalus and P. nitidus
    (section "Not accepted as native", no Peninsular Malaysian record) are
    kept as unmapped rows only and listed in raw/taxon_flags.csv. Ecology
    statements citing Corner (1978) are scored in raw/manual_rows.csv with
    source_id Corner_1978 and no population region (question 9); hedged
    pollination and dispersal statements in the family and genus Ecology are
    not scored. Types and types of synonyms are in
    raw/Beentje_2023_vouchers.csv.
identifiers: .na
locations: .na
contexts:
  - context_property: commonness qualifier
    category: entity_context
    var_in: commonness_qualifier
  - context_property: population region
    category: entity_context
    var_in: population_region
  - context_property: entity measured
    category: method_context
    var_in: entity_measured
  - context_property: trait scoring method
    category: method_context
    var_in: trait_scoring_method
traits:
  - var_in: clonal_spread_mechanism
    unit_in: .na
    trait_name: clonal_spread_mechanism
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'B. nana ''tufted pandan with stolons (Stone 11788) or a rhizome'': stolons scored as the spreading organ (clumping alone is not scored).'
  - var_in: flower_anther_length
    unit_in: unit
    trait_name: flower_anther_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Anther length of male flowers from species descriptions (first dimension of ''a x b'' sizes); the apiculus measured separately (''with apiculus 0.2 mm'') is excluded.'
  - var_in: flower_filament_length
    unit_in: unit
    trait_name: flower_filament_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Filament length of male flowers from species descriptions.'
  - var_in: flower_scent_production
    unit_in: .na
    trait_name: flower_scent_production
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Fragrant, scented or sweet-smelling male (rarely female) inflorescences, spikes or bracts in species descriptions; Pandanus genus ''Male flowers ... fragrant'' copied to Pandanus species with known male flowers.'
  - var_in: flower_visitor
    unit_in: .na
    trait_name: flower_visitor
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'P. dubius flowering heads ''full of beetles'' (Corner 1978, cited in the species Ecology).'
  - var_in: flowering_time
    unit_in: .na
    trait_name: flowering_time
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'F. angustifolia ''flowering Mar.-Apr.'' quoted from Corner (1978); months as printed.'
  - var_in: fruit_colour
    unit_in: .na
    trait_name: fruit_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Ripe colour only (ripe, ripening, maturing, mature). Syncarp colour is scored with entity_measured syncarp (question 1); the colour of P. odorifer phalanges with entity_measured phalange.'
  - var_in: fruit_length
    unit_in: unit
    trait_name: fruit_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Length of the drupe (Benstonea, Pandanus), berry (Freycinetia) or phalange of fused drupes (entity_measured phalange; question 2); first dimension of ''a x b (x c)'' sizes. Syncarp size is not scored (question 1).'
  - var_in: fruit_type
    unit_in: .na
    trait_name: fruit_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Drupe (Benstonea, Pandanus) or berry (Freycinetia) where a species description names the fruit; Benstonea and Freycinetia genus statements (''Syncarps of simple drupes'', ''baccate'', ''berry-like'') copied to species silent on it.'
  - var_in: fruit_width
    unit_in: unit
    trait_name: fruit_width
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Second dimension of drupe, berry or phalange ''a x b (x c)'' sizes; the third dimension (thickness of angular drupes) is not scored (question 3).'
  - var_in: fruiting_time
    unit_in: .na
    trait_name: fruiting_time
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'F. angustifolia ''fruiting June'' quoted from Corner (1978).'
  - var_in: inflorescence_length
    unit_in: unit
    trait_name: inflorescence_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Length of the male or female inflorescence (entity_measured) from species descriptions; peduncle, spike and bract lengths are not scored.'
  - var_in: leaf_apex_shape
    unit_in: .na
    trait_name: leaf_apex_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Leaf apex from species descriptions (acuminate, acute). Caudate, attenuate and cucullate (boat-prow) apices have no level and are unmapped.'
  - var_in: leaf_arrangement
    unit_in: .na
    trait_name: leaf_arrangement
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: '''Leaves ... crowded'' (B. ornata; family ''usually crowded towards the apex of the branch'', not copied).'
  - var_in: leaf_base_shape
    unit_in: .na
    trait_name: leaf_base_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Freycinetia leaf-base auricles scored as auriculate (question 7); ''base sheathing'' (family, Freycinetia genus). Amplexicaul bases are unmapped (question 7).'
  - var_in: leaf_compoundness
    unit_in: .na
    trait_name: leaf_compoundness
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Family and Freycinetia genus ''Leaves ... simple'', copied to all species.'
  - var_in: leaf_glaucousness
    unit_in: .na
    trait_name: leaf_glaucousness
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Glaucous leaf surface (either surface) from species descriptions; subglaucous and ''slightly glaucous'' as subglaucous.'
  - var_in: leaf_length
    unit_in: unit
    trait_name: leaf_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Leaf length of adult (mature, unpruned) leaves, first dimension of ''a x b'' sizes; juvenile, rosette-stage, harvested and young-shoot leaves are not scored. Extremes with a query (''(-?5)'') are not scored (question 11).'
  - var_in: leaf_margin
    unit_in: .na
    trait_name: leaf_margin
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Freycinetia leaf margins (denticulate, entire). Prickles on Benstonea and Pandanus margins are armature and stay unmapped (question 6).'
  - var_in: leaf_shape
    unit_in: .na
    trait_name: leaf_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Leaf shape from family, genus and species descriptions (linear, oblong, lanceolate, elliptic).'
  - var_in: leaf_width
    unit_in: unit
    trait_name: leaf_width
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Leaf width of adult leaves, second dimension of ''a x b'' sizes.'
  - var_in: plant_climbing_mechanism
    unit_in: .na
    trait_name: plant_climbing_mechanism
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Freycinetia: ''adventitious roots clasping'' (genus) and ''roots ... strongly clasping tree trunks'' (F. sumatrana).'
  - var_in: plant_growth_form
    unit_in: .na
    trait_name: plant_growth_form
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Habit sentence: arborescent -> tree palmoid, shrub(s) -> shrub palmoid (standing rule for pandans), climbers -> climber, woody climbers or lianas -> climber_woody (question 4).'
  - var_in: plant_growth_substrate
    unit_in: .na
    trait_name: plant_growth_substrate
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Epiphytes (B. alticola, B. epiphytica) and plants growing on rocks or limestone (lithophyte).'
  - var_in: plant_height
    unit_in: unit
    trait_name: plant_height
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Plant height from the habit sentence; a height given for the trunk or stem has entity_measured trunk or stem (question 5).'
  - var_in: plant_height_climbing_plant
    unit_in: unit
    trait_name: plant_height_climbing_plant
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Freycinetia climbers: ''m long'' or ''m high'' of the climbing plant (question 5).'
  - var_in: root_system_type
    unit_in: .na
    trait_name: root_system_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Prop and stilt roots (''prop/stilt roots'' scores both levels).'
  - var_in: seed_length
    unit_in: unit
    trait_name: seed_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Seed length from species descriptions; seed locules and cavities are not seeds.'
  - var_in: seed_shape
    unit_in: .na
    trait_name: seed_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Seed shape (ellipsoid, flattened ellipsoid).'
  - var_in: seed_width
    unit_in: unit
    trait_name: seed_width
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Second dimension of seed ''a x b'' sizes.'
  - var_in: sex_type
    unit_in: .na
    trait_name: sex_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Freycinetia genus ''dioecious'', copied to the eight Freycinetia species.'
  - var_in: stem_growth_habit
    unit_in: .na
    trait_name: stem_growth_habit
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Habit sentence terms: acaulescent or stemless, erect, decumbent, prostrate, creeping, tufted, rhizomatous, stoloniferous, sprawling.'
  - var_in: vegetative_reproduction_ability
    unit_in: .na
    trait_name: vegetative_reproduction_ability
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'B. nana stolons (see clonal_spread_mechanism).'
