substitutions:
  - trait_name: bark_colour
    find: 'dark_green dark_brown blackish'
    replace: 'green brown_dark black'
  - trait_name: flower_anther_connective_extension
    find: 'connective produced above the anthers'
    replace: 'present_general'
  - trait_name: flower_anther_dehiscence
    find: 'dehiscing lengthwise'
    replace: 'longitudinal_slit'
  - trait_name: flower_perianth_symmetry
    find: 'radially symmetrical'
    replace: 'actinomorphic_general'
  - trait_name: fruit_type
    find: 'capsules'
    replace: 'capsule'
  - trait_name: inflorescence_type
    find: 'racemes'
    replace: 'raceme'
  - trait_name: leaf_margin
    find: 'serrulate'
    replace: 'toothed_serrate'
  - trait_name: leaf_shape
    find: 'narrow-oblong'
    replace: 'narrowly_oblong'
  - trait_name: plant_growth_form
    find: 'shrubs trees'
    replace: 'shrub tree'
  - trait_name: seed_surface_hairs
    find: 'hairy'
    replace: 'hairs'
taxonomic_updates: .na
exclude_observations: .na
questions:
  question1: |
    Placentation: the genus description says "ovules numerous, crowded on
    the slightly convex base of the ovary ... placentation parietal" (p. 376).
    Ovules on the base of the ovary read as basal, but the text names
    parietal. flower_gynoecium_placentation is scored parietal as printed
    (genus row and its copy to S. borneensis, 2 rows). Keep parietal, change
    to basal, or leave unmapped?
  question2: |
    Carpel number: the ovary is "1-locular" with "stigmatic lobes 9--12" and
    parietal placentation, and the fruit is "9--12-ribbed ... breaking up ...
    into 9--12 segments" (pp. 375--376). The usual rule (one locule per
    carpel) would give 1 carpel, which these features contradict, so
    flower_structural_carpels_count is not scored. Leave unscored, or score
    9--12 carpels from the stigma lobes and fruit segments?
  question3: |
    Inflorescence: "basic units of short-peduncled racemes ... the
    tubular-bracteate raceme units solitary in the distal leaf axils or
    arranged on a slender flowering main stalk terminal to a leafy branch"
    (p. 375). The author notes that this interpretation differs from van
    Steenis (1957). inflorescence_type is scored raceme for the basic unit
    (genus row and its copy to the species), and the arrangement of units is
    unmapped. Should axillary and terminal also be scored, or should the
    compound structure be scored as panicle?
  question4: |
    Perianth counts from "perianth 6-lobed (3 outer and 3 inner tepals),
    ... connate" (p. 375): flower_perianth_parts_count 6,
    flower_perianth_whorls_count 2 and flower_perianth_merism 3, all at genus
    rank only (numbers are not copied down). Confirm that the lobes of a
    connate perianth count as parts. flower_perianth_fusion_categorical is
    not scored: male lobes are "shorter than the tube" and female lobes
    "longer than the tube". Should it be scored (for example
    perianth_parts_partially_fused, by sex)?
  question5: |
    The perianth tube is scored as flower_tube_length (males 4--5 mm,
    females c. 2 mm; p. 376), although the trait may be intended for a
    corolla tube. Tepal lobe sizes (male outer c. 3 x 2 mm, inner c. 2 x 1.5
    mm; female c. 6 x 4 mm) have no trait for petaloid tepals and stay
    unmapped. Confirm the tube mapping, and decide whether tepal lobe length
    and width should be a trait or go to flower_petal_length.
  question6: |
    Stamens "3, connate into in a column with common apical connective
    produced above the anthers, anthers 4-locular, extrorse, dehiscing
    lengthwise" (p. 375). Scored: flower_fertile_stamens_count 3,
    flower_anther_connective_extension present_general,
    flower_anther_orientation extrorse, flower_anther_dehiscence
    longitudinal_slit. Not scored: the fusion into a column
    (flower_filament, flower_filament_fusion; degree not stated) and the
    "staminal column 2--3 mm long" (p. 376), which is not a single stamen
    length. Confirm, and decide whether the column length should go to
    flower_stamen_length.
  question7: |
    "Shrub or tree to 20 m tall, 40 cm diameter" (p. 376): "to" is read as
    governing the diameter as well, so plant_diameter_breast_height is
    scored as a 40 cm maximum (1 row). The height at which diameter was
    measured is not stated. Keep as maximum, or record as mean?
  question8: |
    Term mappings to confirm: leaf margin "serrulate" to toothed_serrate;
    leaf "narrow-oblong" to narrowly_oblong; "radially symmetrical" to
    actinomorphic_general; bark "dark green to dark brown or blackish" to
    green brown_dark black; seeds "shortly erect-patent hairy over whole
    surface" to seed_surface_hairs hairs (the seed hairs are not scored as a
    dispersal_appendage).
  question9: |
    Petiole "1(--3) mm thick" (p. 376) is scored as petiole_width (usually 1
    mm, extreme maximum 3 mm). Confirm that thickness can be recorded as
    width, or leave it unmapped.
  question10: |
    Inflorescence parts (p. 376): the male and female "peduncles" (2.5--20
    mm; 12--35 mm) are read as those of the raceme units and scored as
    peduncle_length with entity_measured male or female raceme unit. The
    bracts each subtend one flower, so their lengths are scored as
    flower_bract_length (male 5--10 mm; female 1--4 mm, first dimension of
    "1--4 x 2--3 mm" read as length although the bract may be wider than
    long). Confirm both readings.
  question11: |
    Ecology: "Flowering and fruiting all the year around with local
    variation" (p. 376). "with local variation" qualifies the statement, so
    flowering_time and fruiting_time are not scored (default for qualified
    statements). Score both as all year (yyyyyyyyyyyy), or leave unscored?
  question12: |
    "base rounded, often decurrent down the petiole" (p. 376): the decurrent
    leaf base is scored as petiole_shape decurrent with commonness
    qualifier "often" (1 row). Confirm the trait, and that "often" is
    accepted in a species description.
  question13: |
    Candidate traits with no entry in config/traits.yml (rows unmapped, see
    raw/unmapped_terms.csv): exudate absent; stipule size (1--2 x 1 mm),
    shape and persistence (caducous); twig angularity; raceme unit length;
    bract width; tepal lobe length and width; disc glands; staminal column
    length; ovary size; ovule aril; funicle length; fruit rib and segment
    number; altitude (20--1700 m, Sarawak); uses (leaves used as fish poison,
    Sarawak). Which, if any, should be added centrally?
