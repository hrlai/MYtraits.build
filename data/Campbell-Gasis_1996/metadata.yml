source:
  primary:
    key: Campbell-Gasis_1996
    bibtype: InBook
    year: 1996
    author: E. J. F. Campbell-Gasis
    title: Scyphostegiaceae
    booktitle: Tree Flora of Sabah and Sarawak, Volume 2
    editor: E. Soepadmo and K. M. Wong and L. G. Saw
    publisher:
      Sabah Forestry Department and Forest Research Institute Malaysia and
      Sarawak Forestry Department
    place: Kepong, Malaysia
    pages: 375--378
    isbn: 983-9592-56-4
contributors:
  data_collectors:
    - last_name: Campbell-Gasis
      given_name: E. J. F.
      ORCID: .na
      affiliation: Taman Fajar, Lahad Datu, Sabah, Malaysia
  dataset_curators: Hao Ran Lai
dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '1996'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description: |
    To describe the morphology, distribution and ecology of the
    Scyphostegiaceae, a monogeneric family with one species (Scyphostegia
    borneensis) endemic to Borneo, as part of the Tree Flora of Sabah and
    Sarawak.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: |
    Trait values were transcribed by hand (raw/build_trait_data.R, with
    flora_hand()) from the text layer of the 2007 electronic version of the
    treatment (L. G. Saw and B. Aslina), which is born-digital
    (assets/myflora_metadata.csv), clause by clause, from the genus and
    species descriptions and the Ecology, Uses and Notes paragraphs (PDF pages
    7--10, printed 375--378). The text layer was not routinely checked
    against page images: flora_layer_flags() found no unmapped glyphs and no
    break in the printed-page offset on the treatment pages. Only PDF page 9
    (printed 377), a plate with no text layer, was image-checked, for its
    figure caption (voucher). Keys were not used (the treatment has none).
    Each value keeps the clause it came from (trait_value_raw), the source
    term (trait_value) and the page. Several values are listed in text
    order; a parenthetical extreme a--b(--c) is recorded as a typical range
    on usually rows plus an extreme_range row; a single or "c." value is a
    mean and "to X" a maximum. The family has one genus, so there is no
    family description; categorical values stated singly and without
    qualification in the genus description are applied to the species, which
    is silent on those traits (trait_scoring_method = inferred_from_genus).
    Numeric genus values are not copied down.
  original_file:
    Scyphostegiaceae.pdf (Campbell-Gasis 1996, Tree Flora of Sabah and Sarawak
    vol. 2, pp. 375--378; electronic version 2007)
  notes: |
    data.csv is raw/trait_data.csv (written by raw/build_trait_data.R) with
    three columns added by flora_make_data(): value (the source term for
    categorical traits, mapped with substitutions), trait_scoring_method
    (from rank_scored_from) and source_id. Taxon names are as printed. The
    genus description is kept as genus-rank records as well as copied to the
    species. Species description values have population region Sabah and
    Sarawak; the species is endemic to Borneo and also known in Kalimantan,
    and the Ecology and Uses paragraphs state Sabah or Sarawak separately. One
    source typo ("chartaccous", p. 376) is repaired in raw/source_fixes.csv;
    it is in an unmapped clause. Every clause with no trait in
    config/traits.yml stays in raw/trait_data.csv as an unmapped record
    (summary in raw/unmapped_terms.csv): exudate (absent), twig angularity,
    stipules, venation, raceme units and bracts, tepal sizes and fusion,
    staminal column, disc glands, ovary, style and stigma, ovules and aril,
    fruit ribs and dehiscence pattern, seed hairs and base, funicle, inner
    bark and wood colour, altitude, habitat, distribution, phenology (see
    questions), uses (fish poison), taxonomy and the differential note.
    Type and figure specimens are listed in raw/Campbell-Gasis_1996_vouchers.csv.
identifiers: .na
locations: .na
contexts:
  - context_property: commonness qualifier
    category: entity_context
    var_in: commonness_qualifier
  - context_property: population region
    category: entity_context
    var_in: population_region
  - context_property: entity measured
    category: method_context
    var_in: entity_measured
  - context_property: trait scoring method
    category: method_context
    var_in: trait_scoring_method
traits:
  - var_in: bark_colour
    unit_in: .na
    trait_name: bark_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Outer bark colour; inner bark and wood colour are not scored.
  - var_in: bark_texture
    unit_in: .na
    trait_name: bark_texture
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Outer bark surface (smooth); lenticels and thickness stay unmapped.
  - var_in: flower_anther_connective_extension
