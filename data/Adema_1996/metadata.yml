    unit_in: .na
    trait_name: bark_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Outer bark colour from the Bark clause; inner bark, cambium, spots and lenticels excluded.'
