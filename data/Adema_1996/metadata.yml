questions:
  question1: >-
    Dimensions printed 'a x b (x c)' are read as length, width (and height) for
    leaflets, leaves, sepals, petals, bracts, fruits and seeds. Confirm this
    order, in particular for fruits printed with three dimensions (e.g.
    Nephelium aculeatum 'c. 3 x 2 x 1.75 cm').
  question2: >-
    Leaflet shape, base, apex, margin, hairs and reflectivity are scored to
    leaf_shape, leaf_base_shape, leaf_apex_shape, leaf_margin,
    leaf_hairs_adult_leaves and leaf_surface_reflectivity with entity_measured
    'leaflet' (or 'lowermost leaflets', 'upper leaflets', 'lateral leaflets',
    'terminal leaflets'). Leaflet sizes go to
    leaflet_length/leaflet_width. Confirm using the leaf traits for leaflets.
  question3: >-
    Unifoliolate and 1-foliolate leaves are scored leaf_compoundness = compound
    (one leaflet), with no leaf_lamina_division. Confirm, or score unifoliolate
    as simple.
  question4: >-
    Arillode (a false aril) is scored dispersal_appendage = aril; sarcotesta =
    sarcotesta. Confirm the arillode mapping.
  question5: >-
    Ovary locule number ('2(-3)-locular') is scored as
    flower_structural_carpels_count, assuming one locule per carpel; sepal
    number is scored as flower_perianth_merism (entity_measured calyx). Petal
    number, petal width, sepal width, petiolule length, rachis length, lateral
    vein spacing and leaflet pair number are unmapped (no trait). Confirm these
    mappings and whether any of the unmapped characters should become traits.
  question6: >-
    26 flower_bract_length and flower_petal_length values are below the
    traits.yml minimum of 1 mm (e.g. Guioa bracteoles 0.2 mm, Pometia petals 0.4
    mm). They are as printed and will be excluded at build. Decide centrally
    whether to lower allowed_values_min for these traits.
  question7: >-
    Zollingeria borneensis (p.374): bracts and bracteoles printed '0.6-12 x
    0.1-0.4 mm'. 12 mm is implausible for acicular bracts 0.1-0.4 mm wide; it
    may be a lost decimal point (0.6-1.2). Rows are scored as printed (maximum
    12 mm). Keep, correct via source_fixes.csv, or drop?
  question8: >-
    Lepisanthes ramiflora (p.322): 'Small tree or shrub to 22 m tall' is scored
    plant_height maximum 22 m as printed, although a small tree to 22 m is odd.
    Keep or flag as a probable slip?
  question9: >-
    Infraspecific treatments printed inside keys (Dimocarpus longan varieties,
    Nephelium cuspidatum varieties and subvarieties, N. lappaceum varieties,
    Xerospermum laevigatum subspecies) have their own description text. These
    are scored at infraspecific rank and also inherit species values for silent
    traits. The TFSS guide expects infraspecific annotations without
    descriptions. Confirm that these descriptions should be scored. The two
    Lepisanthes divaricata formae have only a key lead and nomenclature and are
    not scored.
  question10: >-
    Two description chunks give a second value for a trait already scored in
    the same context (Xerospermum laevigatum inflorescences 'to 20 cm long if
    solitary' vs 'to 5 cm long if tufted'; Lepisanthes amoena 'Tree to 10 m
    tall, or shrub to 6 m'). The first is scored; the other is an unmapped row
    noting 'second statement'. Decide whether to add a context (e.g. growth
    form) and score them.
  question11: >-
    Family (223 rows) and genus (486 rows) values are copied down to member
    species silent on a trait when unqualified, single-level and agreeing with
    every member that scores the trait (flora_copy_down). Confirm copy-down from
    the family description, which covers Sapindaceae worldwide rather than only
    Sabah and Sarawak.
  question12: >-
    Phenology: months are scored from Ecology sentences that name them
    ('Flowering in August to May' -> wrap-around range). Qualifiers such as
    'mainly' are kept in trait_value but the calendar marks all months named;
    'throughout the year' -> all months. One printed sequence, 'Flowering in
    July to November to January' (p.303), is read as one continuous range, July
    to January. Confirm.
  question13: >-
    Vouchers: 21 type rows are printed with a repository but no status word
    ('Type: ... (L)'); they use specimen_status 'type', which is not in the
    shared voucher vocabulary. Decide whether to add 'type' or map these to
    'holotype'/'possible holotype'.
