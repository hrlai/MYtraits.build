questions:
  question1:
    The source text layer is usable for prose but has OCR-like slips. A complete
    image-based transcription and number comparison have not yet been completed.
  question2:
    Subspecies, varieties and forma treatments were detected but are not yet
    extracted as separate taxa or inherited from species.
  question3:
    Manual review is needed for every parsed leaflet and fruit dimension,
    especially treatments with multi-lobed fruits.
  question4:
    Phenology page provenance currently uses the species heading page rather
    than the exact Ecology page when they differ.
  question5: No type or figure-specimen vouchers have yet been transcribed.
