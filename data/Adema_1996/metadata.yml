questions:
  question1: >-
    Sapindaceae pp. 263--374: the scanner-produced text layer contains OCR-like
    slips. Transcribe the scanned page images, verify measurements against them,
    then rerun extraction before accepting any species trait rows.
  question2: >-
    Subspecies, varieties and forma headings in Sapindaceae were not extracted.
    Segment these taxa and confirm parent-species inheritance before release.
  question3: >-
    Review every leaflet and fruit dimension against its source clause. The
    current parser uses broad organ regexes and may capture adjacent organs or
    miss fruit lobes; confirm affected mapped rows before release.
  question4: >-
    Ecology and description rows use the species heading page rather than the
    clause page after a page turn. Restore clause-level PDF and printed pages
    before release.
  question5: >-
    The Adema_1996 voucher CSV contains only a header. Transcribe types and
    figure specimens from Sapindaceae before release.
