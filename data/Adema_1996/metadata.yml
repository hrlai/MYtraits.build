dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '1996'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description: |
    Morphological and phenological traits of the Sapindaceae of Sabah and
    Sarawak (21 genera, 60 species, 19 infraspecific taxa), extracted from the
    family treatment in the Tree Flora of Sabah and Sarawak.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: |
    The PDF (inst/extdata/myflora/pdf/TFSS/Sapindaceae.pdf) is the 2007 electronic edition
    (L.G. Saw & B. Aslina), re-typeset vector text rather than a scan. A draft
    transcription was generated from its text layer and every page (PDF pages
    7--118, printed 263--374) was checked against 220 dpi page renders for
    reading order, headings, paragraph breaks, numbers and printed page
    numbers (raw/Sapindaceae_transcription.txt). Retyping slips of this
    edition are kept verbatim in the transcription and repaired, where
    certain or likely, in raw/source_fixes.csv. The transcription is segmented
    in raw/segment_source.R; raw/build_trait_data.R splits each family, genus,
    species and infraspecific description into sentences, ';' pieces and ','
    clauses, assigns each clause to an organ and scores configured traits.
    Every unscored clause stays in raw/trait_data.csv as an unmapped row, as do
    the Distribution, Ecology, Uses, Notes and unlabelled distribution
    paragraphs (one row per sentence). Months are scored from Ecology text.
    Family and genus values are copied down to silent members, and
    infraspecific taxa inherit species values for silent traits.
  original_file: |
    Sapindaceae.pdf (Adema, Leenhouts & van Welzen 1996, Tree Flora of Sabah and
    Sarawak vol. 2, pp. 263--374; electronic edition 2007)
  notes: |
    Taxon names are kept as printed, including Trigonachras sp. A and sp. B.
    Descriptions in this flora refer to Sabah and Sarawak (or Borneo).
    Cardiospermum and Dodonaea are annotated only in the generic key and are
    not scored. Four species are represented by their single local
    infraspecific taxon, which carries the description (Dictyoneura acuminata,
    Dimocarpus fumatus, Lepisanthes falcata, Litchi chinensis); the two
    Lepisanthes divaricata formae have no description. The transcription was
    image-checked page by page; the clause-to-trait mapping is a scripted
    parse whose rules and mapping decisions are listed under questions.
    An independent clause-by-clause review of the 2,387 scored description
    rows found about 5% errors (organ ownership, alternatives, qualifiers);
    the parser rules were corrected for every reported pattern. A second
    row-by-row review (2026-10) of all 2,372 scored description rows against
    the transcription found 150 errors (6.3%), mainly trunk diameters after
    'to X m tall' scored as means, outer and inner sepal sizes without
    entity_measured, petal blade sizes scored as petal length, misplaced
    qualifiers, and acumen shapes scored as apex shape; parser rules now
    resolve all but 8 rows (qualifiers spread over listed alternatives and
    one prose range), which remain as scored.
    Unmapped description clauses are summarised in raw/unmapped_terms.csv.
    Type, synonym-type and figure specimens are in raw/Adema_1996_vouchers.csv.
identifiers: .na
locations: .na
contexts:
  - context_property: commonness qualifier
    category: entity_context
    var_in: commonness_qualifier
  - context_property: entity measured
    category: method_context
    var_in: entity_measured
  - context_property: trait scoring method
    category: method_context
    var_in: trait_scoring_method
traits:
