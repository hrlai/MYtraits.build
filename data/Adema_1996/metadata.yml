dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '1996'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description:
    UNDONE, not release-ready. Provisional, incomplete species-only extraction
    of morphological and phenological traits for Sapindaceae in Sabah and
    Sarawak.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy:
    Preliminary species-only pass using the scanner-produced PDF text layer and
    raw/build_trait_data.R. Selected layout and OCR slips were checked against
    rendered pages, but the full treatment has not been transcribed or verified.
    The script extracts selected terms from flattened species blocks, including
    phenology from Ecology text. Genus, family and infraspecific descriptions
    have not been extracted. No born-digital copy is available; completion
    requires transcription and verification from the scanned page images. This
    dataset is UNDONE and must not be released as complete. Work can continue
    from the available scan without waiting for a born-digital copy.
  original_file:
    Sapindaceae.pdf (Adema, Leenhouts & van Welzen 1996, Tree Flora of Sabah and
    Sarawak vol. 2, pp. 263--374)
  notes:
    Taxon names are kept as printed. This preliminary pass detected 60
    species-level headings, including Trigonachras sp. A and sp. B. It does not
    cover subspecies, varieties, most described characters or unmapped clauses.
    The voucher file is a header-only placeholder. Reported PDF pages for
    Ecology values and some description values are species-heading pages, not
    verified clause pages. Leaflet measurements and categorical traits need
    organ-level review; dimensions were read as length x width. A future
    born-digital copy could improve OCR accuracy, omitted-clause coverage and
    clause-page provenance; recheck the extraction against it if obtained. Its
    absence does not prevent image-based verification of the current scan.
