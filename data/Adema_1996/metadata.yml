dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '1996'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description:
    Morphological and phenological traits for Sapindaceae occurring in Sabah and
    Sarawak.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy:
    Trait values were extracted from the PDF text layer with
    raw/build_trait_data.R. Rendered pages were checked for treatment layout and
    selected OCR slips. Measurements and mapped categorical terms come from
    species descriptions. Phenology values come from species Ecology paragraphs.
    Keys, figures, synonymy and generic descriptions were not scored.
  original_file:
    Sapindaceae.pdf (Adema, Leenhouts & van Welzen 1996, Tree Flora of Sabah and
    Sarawak vol. 2, pp. 263--374)
  notes:
    Taxon names are kept as printed. The treatment contains 60 species-level
    headings, including Trigonachras sp. A and sp. B. Subspecies and varieties
    require a later dedicated extraction pass. Leaflet measurements and
    categorical leaflet traits require review because the treatment describes
    compound leaves. Dimensions are interpreted as length x width.
