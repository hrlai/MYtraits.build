dataset:
  data_is_long_format: no
  custom_R_code: .na
  collection_date: sampling_date
  taxon_name: taxon_name
  location_name: location
  individual_id: tree_id
  description: Traits matrix for tree species in selectively logged forest at SAFE
    and in old-growth forest in Danum Valley and Maliau Basin. Sampled during the
    BALI project traits campaign.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: From each target tree, we attempted to sample a fully sunlit
    canopy branch and a fully shaded branch; however, branches of only one type were
    available for most trees (91%) because it was uncommon for large-canopy trees
    to possess fully shaded branches and for small understorey trees to have fully
    sunlit branches. Branch samples were collected by tree climbing or by cutting
    from the ground with telescopic branch cutters. Target tree height ranged from
    2.3 to 78.1 m, and sample height ranged from 2.3 to 53 m. Branches were c. 2--4
    cm in diameter and provided sufficient leaf material for all analyses. Photosynthetic
    activity was only measured on trees selected by the basal area sampling strategy
    as a result of time constraints (n = 298), whereas all other functional traits
    were determined on all trees. Undamaged mature leaves were collected and cleaned
    with water for subsequent analyses. Fresh and dry leaf weight, (specific) leaf
    area, leaf thickness, leaf dry matter content (LDMC), (specific) force to punch
    and branch wood density were determined in a field laboratory. Dried bulked and
    milled leaf material was used for determination of Ca, K, Mg, P, C and N concentrations,
    δ13C and δ15N stable isotope composition, cellulose, hemicellulose and lignin
    concentrations. Analyses of pigments (Chla, Chlb and carotenoids), phenols and
    tannins were conducted on 0.7-cm-diameter leaf discs punched from fresh leaves
    immediately after field collection and frozen in liquid N. Herbarium voucher specimens
    were taken for identification of trees and were deposited in the herbarium at
    Danum Valley Field Centre. All trait measurements follow standardized protocols
    (Pérez-Harguindeguy et al., 2013).
  original_file: raw/Both_tree_functional_traits.xlsx
  notes: For precise replicate numbers, see columns with _n suffix in the original
    file
