dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '2010'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description: |
    To describe the morphology, distribution and ecology of the Casuarinaceae
    of Peninsular Malaysia, represented by one genus (Casuarina) with one
    native species (C. equisetifolia), as part of the Flora of Peninsular
    Malaysia.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: |
    The source PDF is a scan with an Acrobat OCR text layer (scanned_ocr).
    The OCR layer was used only to draft text. Every page of the treatment
    (printed pp. 87--91, PDF pp. 8--12) and the Plate 11 caption (p. 303)
    was checked against page images rendered at 220 dpi, and the corrected
    text was saved in raw/Casuarinaceae_transcription.txt. Trait values were
    then transcribed by hand (raw/build_trait_data.R, with flora_hand())
    from that image-checked text, clause by clause, from the family, genus
    and species descriptions and the Ecology paragraphs. Keys and figure
    captions were not used as trait evidence. Each value keeps the clause it
    came from (trait_value_raw), the source term (trait_value) and the page.
    Several values are listed in text order, and alternatives qualified by
    a commonness word (usually, sometimes, rarely, less commonly) are
    recorded on separate rows. A measured range is recorded as minimum and
    maximum values, a parenthetical extreme as an extreme_range row, a "c."
    value as a mean and "to X" as a maximum. Categorical values stated
    singly and without qualification in the family or genus description
    are applied to the species where its own description is silent
    (trait_scoring_method = inferred_from_family / inferred_from_genus).
  original_file:
    Casuarinaceae.pdf (Nor-Ezzawanis 2010, Flora of Peninsular Malaysia
    Series II vol. 1, pp. 87--91)
  notes: |
    data.csv is raw/trait_data.csv (written by raw/build_trait_data.R) with
    three columns added by flora_make_data(): value (the source term for
    categorical traits, mapped with substitutions), trait_scoring_method
    (from rank_scored_from) and source_id. Taxon names are as printed. The
    family and genus descriptions are kept as family- and genus-rank records
    as well as copied to the species. Every clause was checked against the
    page images; no clause is unchecked and no source repair was needed
    (OCR slips corrected in the transcription are listed in its header).
    The extraction is complete for the treatment, apart from the open
    questions below. A born-digital copy would not change the values.
    Species description values have population region Peninsular Malaysia
    (FPM guide). The Plate 11 photographs, Figure 1 (reproduced from Tree
    Flora of Sabah and Sarawak vol. 2, 1996) and the type illustration cite
    no specimen (raw/Nor-Ezzawanis_2010_2_vouchers.csv). Three species named
    as planted ornamentals in the family Distribution are not treated and
    not scored (raw/taxon_flags.csv). The printed text marks diagnostic
    characters in italics; this does not change any value. Every clause
    with no trait in config/traits.yml stays in raw/trait_data.csv as an
    unmapped record (summary in raw/unmapped_terms.csv): twig dimorphism
    and green-twig size, colour and branching; scale leaves per node; bole
    form; crown symmetry; buttress height; sapwood; inner bark texture;
    perianth absence; bracteoles; filament, anther and ovary shape and
    colour; stigmatic arm colour; ovary locules and ovules; infructescence
    shape, size, bracts and bracteoles; fruit length (suspect value) and
    shape; endosperm; anthesis; habitat; distribution; conservation status;
    uses.
