questions:
  question1: |
    Fruit length (C. equisetifolia, p. 90): "Samaroid nut ... c. 3.5 cm
    long". Tree Flora of Sabah and Sarawak vol. 2 (1996) gives "Samara
    0.6--0.8 cm long" for the same species, and Figure 1C (reproduced from
    that flora) has a 3 cm scale bar. The value looks like a typo, but the
    intended value cannot be read from the source, so fruit_length is not
    scored (one unmapped row). Decide: score 35 mm as printed, score a
    corrected value, or leave unscored.
  question2: |
    Functional leaves: the leaves are reduced to scale leaves 0.5--1 mm
    long (green twigs) or to 4 mm (woody twigs); the green needle-like
    twigs (to 34 cm long, internodes to 1.3 cm x 0.5--1 mm, p. 88) are the
    photosynthetic organs. Currently leaf_type = scale and leaf_length are
    scored from the scale leaves, and green-twig sizes are unmapped. Decide
    whether leaf traits should describe the scale leaves (current), the
    green twigs, or both with an entity label; this matters for any
    leaf-size analysis.
  question3: |
    Scale leaf length is scored on two entity_measured labels, "scale
    leaves on woody twigs" (max 4 mm) and "scale leaves on green twigs"
    (0.5--1 mm). Confirm these labels, or keep only the green-twig values.
  question4: |
    Leaves per node: family "whorls of 4--20", genus "5--18 per node",
    species "(6--)7(--8) per node". No trait holds a whorl or node count
    (leaf_count is per plant), so all three are unmapped. Is a trait such
    as leaves_per_node wanted in config/traits.yml?
  question5: |
    flower_bract_length: male and female flower bracts are 0.8--1 mm long
    (p. 90). The trait's allowed range starts at 1 mm, so the 0.8 mm
    minimum rows will be excluded by the build. Decide: widen the range in
    config/traits.yml, or accept the exclusion.
  question6: |
    flower_stigma_length is scored from "stigmatic arms red, 1.5--5 mm
    long" (female flowers, p. 90). The arms are style branches whose
    surface is stigmatic. Confirm the mapping, or leave unmapped.
  question7: |
    Bole "27--100(--200) cm diameter" (p. 88) is scored as
    plant_diameter_breast_height; the height of measurement is not stated
    (same treatment as Yao_2010). Confirm.
  question8: |
    Judgement mappings to check: bark greyish brown -> brown; inner bark
    pale brown -> brown_light, pinkish -> pink; bark scaly-fissured ->
    furrowed; scale-leaf apex narrowly acute -> acute; spike-like -> spike;
    samaroid nut -> samara (not nut); fruit pale yellow-brown -> brown;
    anther golden brown (in life) -> brown; crown "initially conical, then
    spreading with age" -> spreading (conical has no level).
  question9: |
    Female inflorescence position conflicts between ranks: the family says
    "terminal or subterminal on both brown and green twigs" (p. 87), the
    genus says "lateral on persistent woody twigs" (p. 88). Neither is
    scored as a position; only the family "head" is copied to the species
    as inflorescence_type (female). Decide whether either position should
    be scored, and whether "head" fits an ellipsoid female inflorescence
    to 6 mm long.
  question10: |
    "perianth absent" (male and female flowers, family description) is not
    scored because the perianth traits have no absent level. Should it be
    scored as flower_perianth_parts_count = 0?
  question11: |
    nitrogen_fixing = nitrogen_fixer is scored at genus rank from the
    family Ecology sentence "Root nodules, containing symbiotic
    nitrogen-fixing bacteria, enable Casuarina species to grow ..."
    (citing Corner 1988), with source_id Corner_1988, and copied to C.
    equisetifolia. Confirm the source attribution (FPM text vs Corner).
  question12: |
    Infructescence ("cone-like", globose or ovoid-cylindric, to 2 cm long,
    1.5 cm diameter) is a multiple structure, not a fruit, so its size is
    unmapped; only peduncle_length (2--20 mm) is scored, with entity
    "infructescences". Lim_2010 put conifer seed cones under fruit traits.
    Decide: map infructescence size to fruit_length and fruit_width with an
    entity label, or keep unmapped (candidate infructescence traits).
  question13: |
    sex_type is scored as printed: species "usually dioecious, rarely
    monoecious" (p. 88), family "dioecious or less commonly monoecious".
    Tree Flora of Sabah and Sarawak vol. 2 describes the same species as
    "Monoecious trees". Confirm FPM's wording is to be kept as a separate
    observation.
  question14: |
    Stamen number: the family says "stamen 1" (male flowers), scored at
    family rank only (numbers are not copied down); the species says
    "stamens with filaments 1.2--3 mm long". Should flower_fertile_stamens_count
    = 1 also be applied to C. equisetifolia?
  question15: |
    Vouchers: the type is an illustration (Rumphius, Herb. Amboin. 3 (1743)
    t. 57) with no status printed, so specimen_status is blank. Figure 1 is
    reproduced from Tree Flora of Sabah and Sarawak vol. 2 (1996) without
    its specimens (that flora cites S. 13733, S. 42032 and SAN 87058);
    these are not added here because they belong to that flora's dataset.
    Confirm both decisions, and whether the voucher vocabulary needs a
    level for an illustration type.
  question16: |
    Inner bark "fibrous, soft" and sapwood "yellowish to yellow, hard" (p.
    88) have no traits and are unmapped. Are inner-bark texture or sapwood
    colour traits wanted?
