    booktitle: Tree Flora of Sabah and Sarawak, Volume 5
    editor: E. Soepadmo and L. G. Saw and R. C. K. Chung
    publisher:
      Sabah Forestry Department and Forest Research Institute Malaysia and
      Sarawak Forestry Department
    place: Kepong, Malaysia
    pages: 63--388
    isbn: 983-2181-59-3
    doi: 10.26525/TFSS5002
contributors:
  data_collectors:
    - last_name: Ashton
      given_name: P. S.
