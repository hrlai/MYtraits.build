dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '2004'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description: |
    Morphological traits of the Dipterocarpaceae of Sabah and Sarawak (9
    genera, 267 species: Anisoptera 5, Cotylelobium 3, Dipterocarpus 39,
    Dryobalanops 7, Hopea 42, Parashorea 6, Shorea 130, Upuna 1, Vatica 33;
    40 subspecies), with family-level ecology, extracted from the family
    treatment in the Tree Flora of Sabah and Sarawak.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: |
    The PDF (inst/extdata/myflora/pdf/TFSS/Dipterocarpaceae.pdf, PDF pages
    7--332, printed 63--388) is the born-digital 2008 electronic edition (L.
    G. Saw and B. Aslina). Rows come from its text layer
    (flora_read_pdf_lines()); no routine image check was made.
    flora_layer_flags() found no bad glyphs; it flagged the 36 figure pages
    (low text: an image and its caption) and the front matter. The layer
    prints every ';' as U+037E and every hyphen as U+00AD; both are read as
    the printed characters. raw/segment_source.R segments the text; key
    leads and figure captions are dropped. raw/build_trait_data.R splits
    each family, genus, species and subspecies description into sentences,
    ';' pieces and ',' clauses, assigns each clause to an organ and scores
    configured traits. Every unscored clause stays in raw/trait_data.csv as
    an unmapped row, as do the Distribution, Ecology, Uses, Notes,
    vernacular-name and subspecies key-annotation paragraphs (one row per
    sentence). Unqualified single-level family and genus values are copied
    to member taxa silent on the trait when every member that states the
    trait agrees (trait_scoring_method inferred_from_family /
    inferred_from_genus); statements naming a genus, section or 'some',
    'most' or 'many' species are not copied. Subspecies treated only in a key
    annotation inherit the species rows (inferred_from_species). The family
    Ecology statements on pollination, breeding system, mycorrhiza, seed
    dormancy and dispersal are in raw/manual_rows.csv at family rank and are
    not copied down. Keys and figure captions are not trait evidence; type
    and figure specimens are in raw/Ashton_2004_vouchers.csv.
  original_file: |
    Dipterocarpaceae.pdf (Ashton 2004, Tree Flora of Sabah and Sarawak vol.
    5, pp. 63--388; electronic edition 2008)
  notes: |
    data.csv is raw/trait_data.csv (written by raw/build_trait_data.R) with
    the columns added by flora_make_data(). Taxon names are as printed
    (including Vatica oblongifolia subsp. oblongifolius). All 267 accepted
    species of the treatment (the family Distribution paragraph gives 9
    genera with 267 species; every genus count agrees) are segmented. 260
    have their own description; the other 7 (Dipterocarpus caudatus, D.
    conformis, Dryobalanops oblongifolia, Shorea curtisii, S. falciferoides,
    S. hemsleyana, Vatica venulosa) are represented by their one subspecies
    in Sabah and Sarawak, whose description is scored at subspecies rank. 33
    further subspecies of 13 species are treated only in key annotations
    (distribution and ecology) and inherit the species rows. There are no
    excluded, cultivated or incompletely known taxa. The printed page range
    of this electronic edition (63--388) differs from the volume contents
    list (61); page numbers in this dataset are those printed in the PDF.
    Family and genus descriptions are kept as family- and genus-rank records
    as well as copied to member taxa. Species and subspecies description
    values have population region Sabah and Sarawak (TFSS guide); copied and
    inherited values have none. Three source repairs change values
    (raw/source_fixes.csv; question 8). The fruit is measured on the nut;
    the wing-like calyx lobes have no trait (question 1). Of 25,022 rows in
    raw/trait_data.csv, 9,319 are mapped (6,160 from the taxa's own
    descriptions, 2,199 copied from the family, 272 from genera, 688
    inherited by key-annotated subspecies) and 15,703 are unmapped: 13,604
    description clauses and 2,099 sentences of Distribution, Ecology, Uses,
    Notes, vernacular names, conservation status and subspecies key
    annotations. The most frequent unmapped characters are fruit calyx
    (wing) size, shape and number; lateral vein number and relief;
    intercostal venation; twig size; leaf texture and dried colour; midrib
    relief; stipule size, shape and persistence; nut shape and style remnant;
    ovary and style form; bracteoles; inner bark and sapwood; indumentum
    sentences listing several organs; canopy position; altitude, soils and
    distribution (summary in raw/unmapped_terms.csv). Type and figure
    specimens are in raw/Ashton_2004_vouchers.csv (292 type citations and
    the 36 figure captions; the figure rows were spot-checked only).
identifiers: .na
locations: .na
contexts:
  - context_property: commonness qualifier
    category: entity_context
    var_in: commonness_qualifier
  - context_property: population region
    category: entity_context
    var_in: population_region
  - context_property: entity measured
    category: method_context
    var_in: entity_measured
  - context_property: trait scoring method
    category: method_context
    var_in: trait_scoring_method
traits:
  - var_in: bark_colour
    unit_in: .na
    trait_name: bark_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Outer bark colour from the Bark sentence; inner bark, lenticels, mottling, patches and dammar excluded; compound colours score every word.
  - var_in: bark_texture
    unit_in: .na
    trait_name: bark_texture
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Outer bark surface from the Bark sentence (fissured as furrowed, flaky, smooth, corky, papery for peeling); cracked, scroll-marked and powdery have no level and stay unmapped.
  - var_in: breeding_system
    unit_in: .na
    trait_name: breeding_system
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family Ecology statement 'Dipterocarps are self-compatible', scored at family rank only.
  - var_in: bud_length
    unit_in: unit
    trait_name: bud_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Leaf (terminal) bud and flower bud length from the Leaf buds sentence and the Flowers 'buds ...' clause; the entity is in entity_measured. In 'a x b' the first dimension is taken as length.
  - var_in: bud_width
    unit_in: unit
    trait_name: bud_width
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Leaf bud and flower bud width, the second dimension of 'a x b'; the entity is in entity_measured.
  - var_in: dispersal_appendage
    unit_in: .na
    trait_name: dispersal_appendage
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family Ecology statement on the 'twisted wing-like fruit sepals', scored as wings at family rank only (question).
  - var_in: dispersal_syndrome
    unit_in: .na
    trait_name: dispersal_syndrome
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family Ecology statements: fruits 'primarily dispersed by gyration' of the winged fruit (anemochory, question) and 'a few species are water-dispersed' (hydrochory); family rank only.
  - var_in: flower_anther_connective_extension
    unit_in: .na
    trait_name: flower_anther_connective_extension
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      A connectival appendage named in the Flowers sentence scored present_general (question); the family statement is copied down.
  - var_in: flower_colour
    unit_in: .na
    trait_name: flower_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Petal (corolla) colour from the Flowers sentence; parts of the petal (base, stripe, tinge, outside in bud) and hairs excluded; compound colours score every word.
  - var_in: flower_fertile_stamens_count
    unit_in: unit
    trait_name: flower_fertile_stamens_count
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Stamen number from the Flowers sentence ('stamens 15', 'stamens c. 35').
  - var_in: flower_orientation
    unit_in: .na
    trait_name: flower_orientation
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family description 'Flowers ... nodding' scored as down and copied down.
  - var_in: flower_ovary_position
    unit_in: .na
    trait_name: flower_ovary_position
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Ovary position as stated in family and genus descriptions.
  - var_in: flower_perianth_symmetry
    unit_in: .na
    trait_name: flower_perianth_symmetry
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family description 'Flowers ... radially symmetrical' scored as actinomorphic_general and copied down.
  - var_in: flower_petal_length
    unit_in: unit
    trait_name: flower_petal_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Petal length where printed.
  - var_in: flower_scent_production
    unit_in: .na
    trait_name: flower_scent_production
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family description 'Flowers ... scented' scored as scent_produced and copied down.
  - var_in: flower_structural_carpels_count
    unit_in: unit
    trait_name: flower_structural_carpels_count
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Ovary locule number scored as carpels (axile placentation, family description).
  - var_in: flower_structural_sex_type
    unit_in: .na
    trait_name: flower_structural_sex_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family description 'Flowers bisexual', copied down.
  - var_in: fruit_dehiscence
    unit_in: .na
    trait_name: fruit_dehiscence
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family description 'Fruits indehiscent ... nuts'.
  - var_in: fruit_length
    unit_in: unit
    trait_name: fruit_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Nut length from the Nuts sentence ('Nuts ovoid, to 3 x 2 cm'); entity_measured nut. The persistent calyx lobes (wings) are not part of this size (question).
  - var_in: fruit_surface_hairs
    unit_in: .na
    trait_name: fruit_surface_hairs
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Nut indumentum from the Nuts sentence; glabrescent and young states not scored.
  - var_in: fruit_type
    unit_in: .na
    trait_name: fruit_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family description 'Fruits indehiscent 1(-many)-seeded nuts' scored as nut and copied down.
  - var_in: fruit_width
    unit_in: unit
    trait_name: fruit_width
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Nut width or diameter from the Nuts sentence; entity_measured nut.
  - var_in: inflorescence_length
    unit_in: unit
    trait_name: inflorescence_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Inflorescence length ('Inflorescences to 20 cm long') or rachis length ('rachis to 8 cm long', entity_measured inflorescence rachis; question).
  - var_in: inflorescence_type
    unit_in: .na
    trait_name: inflorescence_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Inflorescence kind and position from the Inflorescences sentence (paniculate, racemose, cymose; terminal, axillary).
  - var_in: leaf_apex_shape
    unit_in: .na
    trait_name: leaf_apex_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaf apex from the leaf blade piece; 'apex with acumen' scored as acuminate.
  - var_in: leaf_base_shape
    unit_in: .na
    trait_name: leaf_base_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaf base from the leaf blade piece; 'unequal' scored as oblique.
  - var_in: leaf_hairs_adult_leaves
    unit_in: .na
    trait_name: leaf_hairs_adult_leaves
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaf surface indumentum in the first Leaves piece: hairy when a surface is hairy, glabrous when both are; glabrescent, lepidote (scales) and 'glabrous or pubescent' alternatives not scored. Indumentum sentences listing several organs stay unmapped.
  - var_in: leaf_length
    unit_in: unit
    trait_name: leaf_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Leaf blade length, the first dimension of 'a x b cm' in the blade piece.
  - var_in: leaf_margin
    unit_in: .na
    trait_name: leaf_margin
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaf margin as stated in family and genus descriptions.
  - var_in: leaf_margin_posture
    unit_in: .na
    trait_name: leaf_margin_posture
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaf margin posture from the blade piece (revolute, flat).
  - var_in: leaf_phyllotaxis
    unit_in: .na
    trait_name: leaf_phyllotaxis
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family description 'Leaves alternate', copied down.
  - var_in: leaf_shape
    unit_in: .na
    trait_name: leaf_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaf blade shape from the blade piece; 'broadly' scored as widely.
  - var_in: leaf_width
    unit_in: unit
    trait_name: leaf_width
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Leaf blade width, the second dimension of 'a x b cm' in the blade piece.
  - var_in: mycorrhizal_association_type
    unit_in: .na
    trait_name: mycorrhizal_association_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family Ecology statement 'Dipterocarps are ectotrophic mycorrhizal', scored at family rank only.
  - var_in: petiole_length
    unit_in: unit
    trait_name: petiole_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Petiole length from the leaf petiole piece.
  - var_in: plant_canopy_form
    unit_in: .na
    trait_name: plant_canopy_form
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Crown shape from the habit sentence (hemispherical, spreading, dense as dense-crowned, open as open-crowned; question).
  - var_in: plant_diameter_breast_height
    unit_in: unit
    trait_name: plant_diameter_breast_height
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Trunk diameter from the habit sentence ('to 2 m diameter'), as printed (no height of measurement stated).
  - var_in: plant_growth_form
    unit_in: .na
    trait_name: plant_growth_form
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Growth form noun from the habit sentence; canopy position words and their qualifiers are not growth forms.
  - var_in: plant_height
    unit_in: unit
    trait_name: plant_height
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Height from the habit sentence ('to 70 m tall').
  - var_in: pollination_vector_known
    unit_in: .na
    trait_name: pollination_vector_known
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family Ecology statement 'Dipterocarps are insect pollinated', scored at family rank only.
  - var_in: root_system_type
    unit_in: .na
    trait_name: root_system_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Stilt roots named in the habit or buttress clauses; 'few or none' not scored.
  - var_in: seed_dormancy_class
    unit_in: .na
    trait_name: seed_dormancy_class
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family Ecology statement 'Dipterocarp seeds lack dormancy', scored at family rank only.
  - var_in: seedling_germination_location
    unit_in: .na
    trait_name: seedling_germination_location
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Germination epigeal or hypogeal from family and genus descriptions; single-term genus values copied down.
  - var_in: stem_base_form
    unit_in: .na
    trait_name: stem_base_form
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Buttresses named in the habit sentence (flying buttresses and 'buttresses absent' not scored).
  - var_in: stem_hairs
    unit_in: .na
    trait_name: stem_hairs
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Twig indumentum from the Twigs sentence; glabrescent and young states not scored.
