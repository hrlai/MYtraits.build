questions:
  question1: |
    Winged fruit size. The dipterocarp fruit is a nut held in a persistent
    calyx whose lobes expand into wings ("Fruits: calyx lobes unequal, 3
    longer lobes spatulate, to 15 x 2.8 cm ... Nuts ovoid, to 3 x 2 cm").
    The nut size is scored as fruit_length / fruit_width with
    entity_measured = nut (441 rows); the wing (calyx lobe) sizes stay
    unmapped (601 unmapped 'fruit calyx | size' rows). Confirm the nut as
    the measured fruit, and decide whether a fruit-wing length trait should
    be added to traits.yml (it is the main dispersal character of the
    family).
  question2: |
    Connectival appendage. Family "connective with more or less prominent
    appendage" and species clauses such as "connectival appendage aristate,
    sericeous, exceeding anther" are scored flower_anther_connective_extension
    = present_general (308 rows, mostly copied from the family). Its
    length relative to the anther ("c. 3x the length of anther", "short,
    vestigial") is not mapped to short_extension / long_extension. Confirm
    present_general, or ask for length levels to be scored.
  question3: |
    Inflorescence rachis. "Inflorescences terminal or axillary; rachis to 8
    cm long, singly branched" is scored as inflorescence_length with
    entity_measured = inflorescence rachis (160 rows); "Inflorescences
    to 20 cm long" is inflorescence_length with no entity. Confirm the
    rachis mapping.
  question4: |
    Bud sizes. Leaf (terminal) bud and flower bud sizes ("Leaf buds ovoid, to
    1.2 mm long"; "Flowers: buds ellipsoid, to 5 x 3 mm") are scored as
    bud_length / bud_width with entity_measured = leaf bud or flower bud
    (888 rows); in "a x b" the first dimension is taken as length.
    Confirm both bud kinds belong in these traits.
  question5: |
    Crown shape. Habit clauses such as "crown hemispherical, rather even" and
    "crown dark, dense, hemispherical" are scored as plant_canopy_form
    (hemispherical, spreading; dense -> dense-crowned; open -> open-crowned;
    100 rows). Confirm these mappings.
  question6: |
    Family flower statements copied down. "Flowers bisexual, radially
    symmetrical, scented, nodding" (family description, p. 63) is copied to
    every taxon as flower_structural_sex_type bisexual,
    flower_perianth_symmetry actinomorphic_general, flower_scent_production
    scent_produced and flower_orientation down (about 300 rows each). No
    species states otherwise. Confirm that 'nodding' is flower_orientation
    down and that these family values should be copied.
  question7: |
    Family dispersal statements (Ecology, p. 66). "Fruits are primarily
    dispersed by gyration occasioned by the twisted wing-like fruit sepals,
    though many appear to have no means of dispersal. ... A few species are
    water-dispersed." Scored at family rank only, not copied: dispersal_syndrome
    anemochory (commonness 'primarily'; gyration taken as wind dispersal),
    dispersal_syndrome hydrochory ('a few species'), dispersal_appendage
    wings. The hedged "many appear to have no means of dispersal" is not
    scored. Confirm the mappings, and whether the family rows should be
    copied to species.
  question8: |
    Source repairs that change values (raw/source_fixes.csv). Shorea
    dealbata "to 30 m tall, to 60 m diameter" (p. 248) repaired to 60 cm;
    Shorea seminis "to 45 m tall, to 1.3 mm diameter" (p. 334) to 1.3 m;
    Vatica vinosa nut "to 0.8 mm diameter" inside calyx lobes "to 0.9 x 0.8
    cm" (p. 387) to 0.8 cm. Confirm the three repairs.
  question9: |
    Width larger than length. Dipterocarpus costulatus flower "buds to 3 x 5
    cm" (p. 101) is scored as printed (bud_length 3 cm, bud_width 5 cm);
    other Dipterocarpus buds are 0.5--2 cm wide, so "3 x 0.5 cm" may be
    intended. Decide whether to repair it or drop the width. Likewise Vatica
    globosa "petiole 0.7--1.5 mm long" (p. 367; other Vatica petioles are
    0.5--2 cm) is scored as printed; 0.7--1.5 cm may be intended.
  question10: |
    Indumentum of several organs. Most species have a sentence such as
    "Twig, inflorescence, petiole, leaf bud, parts of flower exposed in bud,
    stipules and venation below more or less persistently rusty-brown
    scabrid-pubescent" (700 unmapped 'indumentum' rows). These are not
    scored, so stem_hairs and leaf_hairs_adult_leaves are scored for few
    species (6 and 26 taxa). Leaves "cream-lepidote below"
    (scales, not hairs) are not scored either. Decide whether stem_hairs
    (twig listed, hairs persistent) and leaf_hairs_adult_leaves (leaf
    surface listed) should be scored from these sentences.
  question11: |
    Subspecies. Seven species have one subspecies in Sabah and Sarawak whose
    description is scored at subspecies rank. 33 subspecies of 13 species are
    treated only in key annotations (distribution and ecology); they inherit
    the species rows (rank_scored_from = species). Species clauses naming a
    subspecies ("10--15 x 6--10 cm (subsp. agamii) or narrowly ovate,
    4.5--10 x 2.5--4 cm (subsp. diminuta)", Shorea agamii p. 220) are left
    unmapped rather than assigned to the subspecies, and where one piece gives
    two sizes for two forms (Shorea ovalis leaf blade, p. 302) only the first
    is scored. Confirm, or ask for subspecies values to be scored from these
    clauses.
  question12: |
    Canopy position. Nearly every habit names a canopy position
    ("emergent", "main canopy", "subcanopy", "understorey"; 247 taxa),
    and many name buttress height, bole form and dammar colour. None has a
    trait in traits.yml; they are unmapped. Consider a canopy-position trait
    centrally.
