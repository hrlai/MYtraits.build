dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '2015'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description: |
    To describe the morphology, distribution and ecology of the Nymphaeaceae
    of Peninsular Malaysia, represented by Barclaya (3 species) and Nymphaea
    (2 species), as part of the Flora of Peninsular Malaysia.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: |
    Trait values were transcribed by hand (raw/build_trait_data.R, with
    flora_hand()) from the born-digital PDF text layer of the treatment,
    clause by clause, from the family, genus and species descriptions and
    the Ecology, Distribution, Uses, Conservation status, Note and Taxonomy
    paragraphs. flora_layer_flags() found no unmapped glyphs and no
    page-number breaks on the treatment pages (pdf 8--20 = pp. 207--219), so
    no page images were checked; the only low-text page in the treatment
    (p. 215) is Fig. 1. Keys were not used; figure and plate captions were
    used for vouchers only. Each value keeps the clause it came from
    (trait_value_raw), the source term (trait_value) and the page. Several
    values are listed in text order, and alternatives qualified by a
    commonness word (usually, sometimes, rarely) are recorded on separate
    rows. A measured range is recorded as minimum and maximum values, with
    parenthetical extremes on extreme_range rows; a single or "c." value is
    a mean and "to X" a maximum. Categorical values stated singly and
    without qualification in the family or genus description are applied to
    member species whose own descriptions are silent, when every member
    that describes the trait agrees (trait_scoring_method =
    inferred_from_family / inferred_from_genus). Hedged statements
    (suggest, possibly, appears, may) are not scored.
  original_file:
    Nymphaeaceae.pdf (Kiew 2015, Flora of Peninsular Malaysia Series II vol.
    5, pp. 207--219)
  notes: |
    data.csv is raw/trait_data.csv (written by raw/build_trait_data.R) with
    three columns added by flora_make_data(): value (the source term for
    categorical traits, mapped with substitutions), trait_scoring_method
    (from rank_scored_from) and source_id. Taxon names are as printed. Family
    and genus descriptions are kept as family- and genus-rank records as well
    as copied to member species. Species description and species Ecology
    values have population region Peninsular Malaysia; the Nymphaea genus
    flowering statement has Malaysia; statements cited from Williamson &
    Schneider (1994) and family and genus values have none. Statements
    explicitly from outside the flora region (Thailand, Borneo, Sumatra,
    Sri Lanka, "elsewhere") and from cultivation in aquaria are kept as
    unmapped records only. Leaf surface colour, reflectivity and hairs are
    recorded per surface in entity_measured (upper surface, lower surface).
    Every clause with no trait in config/traits.yml stays in
    raw/trait_data.csv as an unmapped record (summary in
    raw/unmapped_terms.csv): leaf position in the water (floating,
    submerged, emergent), pedicel length, sepal number, width and colour,
    petal and corolla-lobe number, corolla length, staminodes, vein number
    and relief, basal lobes and sinus, petiole hairs and colour, rhizome
    size, fruit shape, seed number, anthesis time, water depth, habitat,
    distribution, conservation status, uses and taxonomy. No source repairs
    were needed. Type and figure specimens are in
    raw/Kiew_2015_vouchers.csv; raw/taxon_flags.csv lists the taxa.
identifiers: .na
locations: .na
contexts:
  - context_property: commonness qualifier
    category: entity_context
    var_in: commonness_qualifier
  - context_property: population region
    category: entity_context
    var_in: population_region
  - context_property: entity measured
    category: method_context
    var_in: entity_measured
  - context_property: trait scoring method
    category: method_context
    var_in: trait_scoring_method
traits:
