    unit_in: .na
    trait_name: breeding_system
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Self-pollination (autogamy) and cleistogamy from the Ecology paragraphs, partly cited from Williamson & Schneider (1994).
  - var_in: dispersal_appendage
    unit_in: .na
    trait_name: dispersal_appendage
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Arillate seeds (Nymphaea genus description).
  - var_in: dispersal_syndrome
    unit_in: .na
    trait_name: dispersal_syndrome
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Seeds dispersed by water (Nymphaea genus Ecology, citing Mabberley 2008).
