questions:
  question1: |
    Barclaya ovary position conflicts within the treatment. The family
    description (p. 207) says "gynoecium inferior (Barclaya)" and the family
    Taxonomy (p. 208) says "the gynoecium is completely inferior", and the
    corolla tube is "adnate to the syncarpous ovary" (p. 209); but the genus
    description (p. 209) and the key to genera (p. 208) say "Flowers
    hypogynous". flower_ovary_position is not scored for Barclaya. Which is
    correct: inferior, or hypogynous (superior)?
  question2: |
    Nymphaea "Flowers perigynous" (p. 216). flower_ovary_position has no
    perigynous level, so ovary position is not scored for Nymphaea. Should
    perigynous be mapped (for example to half_inferior), or should a level or
    a separate trait for hypanthium position be added centrally?
  question3: |
    Leaf position in the water has no trait: "floating, submerged or rarely
    emergent" (family), "submerged or just above the water surface"
    (Barclaya), "Leaves mostly floating on the water surface" (Nymphaea),
    and per-species statements (B. rotundifolia leaves "above the water
    surface"). All are kept unmapped. Add a candidate trait such as
    leaf_position_in_water (floating, submerged, emergent, above_water)?
  question4: |
    Growth habit of aquatics. "Submerged aquatic herb" (B. longifolia, B.
    motleyi) is scored as stem_growth_habit "submerged rhizomatous" and
    plant_growth_substrate aquatic_rooted; "marsh plant" (B. rotundifolia
    and family "rarely marsh plants") is scored semiaquatic. Rhizome
    statements are scored stem_growth_habit rhizomatous rather than
    clonal_spread_mechanism rhizome or storage_organ rhizome_fleshy
    (Barclaya "rhizome fleshy, creeping"). Confirm these mappings.
  question5: |
    plant_growth_substrate is not scored for the two Nymphaea species: their
    descriptions are silent, and the family Ecology "Confined to freshwater
    ... rooted in mud" (p. 207) cannot be copied down because B. rotundifolia
    is semiaquatic. Should Nymphaea nouchali and N. pubescens receive
    aquatic_rooted from the family Ecology statement?
  question6: |
    Pedicel length is given for every species (for example B. longifolia
    "(4--)15--30 cm", B. motleyi "(5--)10.5--19 cm long, lengthening to
    (9.5--)22--26.5 cm in fruit") but there is no pedicel trait; all are
    unmapped. Add a candidate trait pedicel_length (with a fruiting context)?
  question7: |
    Sepal and petal characters without a trait: sepal width (second
    dimension of "L x W"), sepal number, sepal colour, petal or corolla-lobe
    number, corolla length (B. longifolia "corolla 20--25 mm long") and
    staminode number (Barclaya "staminodia 10--20") are unmapped. Candidate
    traits: flower_sepal_width, flower_sepal_count, flower_petal_count,
    flower_corolla_length. Which should be added?
  question8: |
    In Barclaya the petals are connate into a tube; corolla-lobe length
    ("lobes 12--15, 7--9 x 3--5 mm") is scored as flower_petal_length and
    tube length as flower_tube_length (3 species). Confirm that corolla
    lobes count as petals for flower_petal_length.
  question9: |
    Barclaya flower colour is scored from the corolla tube only (B.
    longifolia "deep purple or deep red", B. motleyi "dark red, purplish or
    greenish yellow", B. rotundifolia "deep violet-pink, dark red, pinkish
    maroon or brownish"). The lobes are coloured by series (outermost
    greenish, middle four magenta or pink-magenta, innermost white) and are
    unmapped. Mappings: violet-pink to pink; dark red, pinkish maroon and
    brownish to red_brown; purplish to blue_purple; greenish yellow to
    yellow_orange. Should the lobe colours be added, and are the mappings
    acceptable?
  question10: |
    Leaf surface colour mappings (entity_measured upper or lower surface):
    purplish green and dull green to green; brownish green to green_brown;
    red-brown, reddish brown and purplish brown to brown; deep magenta and
    purplish to purple; reddish to red; pale brown to brown. Confirm, or
    keep the compound colours unmapped.
  question11: |
    Leaf shape and apex mappings: "broadly oval" and "broadly elliptic" to
    widely_elliptical; "ovate-rotund" to widely_ovate; "rotund" and
    "circular" to orbicular; family "rarely ribbon-like" to strap-shaped;
    B. motleyi apex "sometimes obtusely acute" to acute. Not scored: Nymphaea
    "orbicular to sagittate" (sagittate is a base shape, not a leaf_shape
    level), N. pubescens "to slightly peltate" and family "peltate or
    attached at lamina base". Confirm, and should petiole attachment
    (peltate vs basal) become its own trait?
  question12: |
    Leaf margin "sinuate" (Nymphaea genus) and "entire or slightly sinuate"
    (N. nouchali) have no leaf_margin level; only "entire" and "dentate" are
    scored. Barclaya "margin undulate" is scored as leaf_margin_posture
    undulate. Should a sinuate level be added?
  question13: |
    Diameters are scored as widths: Barclaya petiole "diameter when dry"
    (petiole_width, measured on dry material) and Nymphaea petiole diameter
    (state not given); berry diameter (fruit_width); Barclaya genus seeds "c.
    1 mm diameter" (seed_width). Keep the dry petiole measurements, and is
    width the right home for a diameter?
  question14: |
    Seed size conflict: the Barclaya genus description gives seeds "c. 1 mm
    diameter" (p. 209) but B. rotundifolia seeds are "c. 2 mm long" (p.
    214). Both are scored. Is one a source error?
  question15: |
    Water depth conflict for B. motleyi: leaves "submerged in water to c. 65
    cm deep" (Ecology, p. 212) vs "thriving underwater to a depth of c. 30
    cm" (Taxonomy, p. 213). Both unmapped (no water-depth trait). Which is
    correct, and is a water-depth trait wanted?
  question16: |
    Carpel number: ovary locules are scored as carpels (B. motleyi "locules
    c. 9", N. nouchali "10--20 locules", N. pubescens "13--16 locules"),
    assuming one locule per carpel. Stigma number (B. longifolia "stigmas c.
    9", B. rotundifolia "about 9") is not used. Confirm, and should stigma
    number count as carpel number in Barclaya?
  question17: |
    Hedged statements are not scored (default; the skill asks before
    scoring any): Barclaya rotundifolia fly pollination ("suggested ... a
    possible pollinator", Williamson & Schneider 1994); B. motleyi beetle
    pollination ("suggesting", and inferred from flower structure); N.
    nouchali bee pollination ("suggesting"); N. pubescens beetles ("possibly
    beetles"); B. motleyi seasonal flowering ("suggesting"); B. rotundifolia
    peak flowering February--April and August ("appears"); Barclaya fruit
    dispersal by water and seeds on fur or feathers ("may be"). The
    pollinator statements could go to pollination_vector_possible, which
    exists for uncertain vectors. Score them there, or leave them unscored?
  question18: |
    Breeding system: B. longifolia autogamy (species Ecology, p. 211) and
    "sometimes cleistogamous" (Williamson & Schneider 1994, genus Ecology);
    B. motleyi autogamy from exclusion experiments (Williamson & Schneider
    1994), while the same paragraph suggests beetle pollination. The place
    of the 1994 study is not stated, so these rows have no population
    region. Keep, and should pollination_syndrome self also be scored?
  question19: |
    Cultivated plants: N. nouchali "Cultivated plants attract Trigona bees"
    is scored as flower_visitor stingless_bee; B. longifolia "In
    cultivation, it flowers and fruits seasonally in July" and its aquarium
    leaf sizes (30--80 x 6.5 cm) are unmapped. Should observations on
    cultivated plants be scored, excluded, or flagged with a context?
  question20: |
    Flower lifespan: Nymphaea genus "last for 2--3 days" and N. pubescens
    "last for 3 days" are scored as flower_lifespan; B. rotundifolia "blooms
    for three days" (Williamson & Schneider 1994) is unmapped because it is
    unclear whether one flower or the plant blooms for three days. Score it?
  question21: |
    Copy-down from Nymphaea to both species: flowering_time all year ("in
    Malaysia flowering throughout the year"), protogynous, style absent,
    aril, herb, perennial, rhizomatous, and dispersal_syndrome hydrochory
    (genus Ecology citing Mabberley 2008). N. pubescens is "perhaps of
    cultivated origin". Confirm these copy-downs.
  question22: |
    Copy-down from the family to all five species: leaf_compoundness
    simple, flower_perianth_symmetry actinomorphic_general, bisexual,
    inflorescence solitary, placentation laminar (from "lamellar"). Family
    "organs spirally arranged" is not copied because Barclaya petals are
    connate and its stamens epipetalous. Confirm, especially actinomorphic
    for Barclaya, whose corolla lobes differ by series.
  question23: |
    Barclaya seeds are spiny and "without an aril". seed_surface_texture
    spiny is scored; dispersal_appendage is not (no "spines" or "none" row),
    because the treatment only suggests epizoochory. Should
    dispersal_appendage spines be scored from the morphology, as winged
    seeds were scored wings in Berhaman_1995?
  question24: |
    B. motleyi seeds "germinate within 48--72 hours on wet mud but do not
    germinate when submerged (Lok et al., Nature in Singapore 2 (2009) 237)"
    is unmapped: the cited study could not be verified (title unknown) and
    was probably made in Singapore. Score seed_germination_time 2--3 d with
    that source, or leave unmapped?
  question25: |
    Scent: B. motleyi "produces a strong stink at night" (pers. comm.) and
    B. rotundifolia "pungent fermenting odour" (Williamson & Schneider 1994)
    and "smelling of rotten meat" (specimen Poore 6415) are scored as
    flower_scent_production scent_produced. B. longifolia smelling of
    "decomposing prawns" in Thailand is outside the flora region and not
    scored. Confirm.
  question26: |
    Family-rank values from general statements: "Waterlilies are insect
    pollinated either by bees ... or beetles" (family Ecology) is scored as
    family pollination_syndrome "bee beetle", and the family numeric ranges
    (stamens 14 to many, carpels 3--40) include genera not in the region.
    Keep these family-rank rows?
  question27: |
    N. pubescens "filaments narrowly triangular, outer stamens 35--40 mm
    long, inner ones 6--17 x 1--9 mm": only the outer stamens are scored
    (flower_stamen_length, entity_measured outer stamens); "inner ones" may
    mean inner stamens or filaments and is unmapped. "a short appendage less
    1 mm long" is read as "less than 1 mm" (unmapped). Which organ is meant?
  question28: |
    Voucher issues (raw/Kiew_2015_vouchers.csv): N. pubescens type printed
    "East India (no specimen cited). (M, barcode M0171693)", with no status;
    the type of B. motleyi var. kunstleri, Kunstler 10866, is printed from
    "Bera, Perak" although Tasik Bera is in Pahang; N. nouchali and N.
    stellata type statuses are not stated. Confirm how to record these.
