questions:
  question1: |
    Source fixes on p. 61 (Canarium odontophyllum): the electronic version
    prints "1.52 cm", "38 pairs", "310 mm", "9.528 x 411 cm" and "1223 pairs"
    with the range dashes missing (they are missing in the rendered page
    too). They are read as 1.5--2, 3--8, 3--10, 9.5--28 x 4--11 and 12--23,
    the only ascending readings; leaflet length and width depend on this.
    The S. sarawakana infructescence "to 11.5 m long" (p. 95) is read as cm
    (unmapped record). Confirm, ideally against the 1995 print.
  question2: |
    Leaflet apex "pointed" (about 54 taxa), "long-pointed" and "cuspidate"
    have no level in leaf_apex_shape and stay unmapped. Should "pointed" map
    to acute, or stay unmapped?
  question3: |
    Leaflet number is printed as pairs of leaflets ("Leaves with 3--4 pairs
    of leaflets"; family: pinnate with a terminal leaflet). It is kept as an
    unmapped record. Should it be converted to leaflet_count as 2n + 1?
  question4: |
    "Thyrse" and "thyrsoid" inflorescences are scored as panicle in
    inflorescence_type. Confirm, or leave them unmapped.
  question5: |
    Infraspecific taxa listed as annotations under a species description
    (key leads with nomenclature and distribution only, e.g. C. littorale
    forma pruinosum) do not inherit the species values, because the TFSS
    guide makes the species description cover all of them (e.g. S.
    apiculata twigs "glabrous or densely brownish hairy (var. pilosa)").
    Clauses that name an infraspecific taxon are not scored. Confirm.
  question6: |
    Ovary cell number ("ovary 3-celled", family "3--5 cells") is recorded as
    flower_structural_carpels_count, assuming one locule per carpel.
    Confirm.
  question7: |
    Mapping decisions from the family description: "anthers dehiscing
    inwards" scored as introrse; "disc ... nectariferous" scored as
    nectar_produced and copied to all taxa; seedling "first 2 leaves opposite
    or alternate" scored as paired/single (Santiria species: paired);
    "male and female on separate trees" scored as dioecious. Confirm.
  question8: |
    Family and genus descriptions are kept as family- and genus-rank records
    in data.csv (taxon names Burseraceae, Canarium, ...), in addition to the
    copies on member taxa. Coode_2018 kept only the copies. Keep both?
  question9: |
    Stem diameter ("40 cm diameter") is recorded as
    plant_diameter_breast_height maximum, though the height of measurement
    is not stated. S. apiculata "rarely more than 30 m tall" is not scored;
    S. oblongifolia "30 m tall, very rarely to 50 m tall" is recorded as 30
    (usually) and 50 maximum (very rarely). Confirm.
  question10: |
    Hedged statements are not scored (default): D. expansa inflorescences
    "probably lateral on axillary shoots". Confirm.
  question11: |
    D. elmeri fruit width is printed "2.25 cm" (p. 67); it may be a range
    with a missing dash (2--2.5), but cannot be checked against the 1995
    print and is kept as printed. Confirm.
