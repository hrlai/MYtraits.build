source:
  primary:
    key: Kochummen_1995
    bibtype: InBook
    year: 1995
    author: K. M. Kochummen
    title: Burseraceae
    booktitle: Tree Flora of Sabah and Sarawak, Volume 1
    editor: E. Soepadmo and K. M. Wong
    publisher:
      Sabah Forestry Department and Forest Research Institute Malaysia and
      Sarawak Forestry Department
    place: Kepong, Malaysia
    pages: 45--100
    isbn: 983-9592-34-3
contributors:
  data_collectors:
    - last_name: Kochummen
      given_name: K. M.
      ORCID: .na
      affiliation: Forest Research Institute Malaysia, Kepong, Malaysia
  dataset_curators: Hao Ran Lai
dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '1995'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description: |
    To describe the morphology, distribution and ecology of the Burseraceae
    of Sabah and Sarawak, represented by Canarium (23 species), Dacryodes
    (11), Garuga (1), Haplolobus (6), Protium (1), Santiria (15),
    Scutinanthe (1) and Triomma (1), as part of the Tree Flora of Sabah and
    Sarawak.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: |
    Trait values were extracted with a script (raw/build_trait_data.R) from
    the text layer of the 2007 electronic version of the treatment (L. G. Saw
    and B. Aslina), clause by clause, from the genus and species
    descriptions, and from the months stated in the species Ecology
    paragraphs. The family description, and genus statements about named
    species, were transcribed by hand (raw/manual_rows.csv). Keys and figures
    were not used. The electronic version has embedded fonts and no page
    images on its text pages, so the text layer is what renders; it is a
    retyped text, and no scan of the 1995 print was available to check it.
    Each value keeps the clause it came from (trait_value_raw), the source
    term (trait_value) and the page. Several values are listed in text
    order, and alternatives qualified by a commonness word (usually, often,
    sometimes, rarely) are recorded on separate rows. A measured range is
    recorded as minimum and maximum values, a single or "c." value as a mean
    and "to X" as a maximum. Categorical values stated singly and without
    qualification in the family or genus description are applied to member
    taxa whose own descriptions are silent, when every member that describes
    the trait agrees (trait_scoring_method = inferred_from_family /
    inferred_from_genus). Two family statements that name an exception are
    applied to all genera except the one named (fruit a drupe and fruits
    dispersed by animals, both except Triomma).
  original_file:
    Burseraceae.pdf (Kochummen 1995, Tree Flora of Sabah and Sarawak vol. 1,
    pp. 45--100; electronic version 2007)
  notes: |
    data.csv is raw/trait_data.csv (written by raw/build_trait_data.R) with
    three columns added by flora_make_data(): value (the source term for
    categorical traits, mapped with substitutions), trait_scoring_method
    (from rank_scored_from) and source_id. Taxon names are as printed. Family
    and genus descriptions are kept as family- and genus-rank records as well
    as copied to member taxa. Canarium asperum and Garuga floribunda each
    have one infraspecific taxon in the region (subsp. asperum var. asperum;
    var. floribunda), which carries the description (TFSS guide); those
    values are recorded at variety rank. The 25 forms, subspecies and
    varieties that follow a species description as key annotations have no
    description of their own; they are listed in raw/taxon_flags.csv, their
    annotations are kept as unmapped records, and they do not inherit the
    species values. Species description values have population region Sabah
    and Sarawak; copied family and genus values have none. Source repairs
    (missing range dashes on p. 61, a unit on p. 95) are in
    raw/source_fixes.csv; the electronic version also repeats two lines at
    the p. 62/63 page turn, which raw/segment_source.R drops. Every clause
    with no trait in config/traits.yml stays in raw/trait_data.csv as an
    unmapped record (summary in raw/unmapped_terms.csv): leaflet pair
    count, apex shape "pointed", vein number and relief, midrib relief,
    petiolule length and swelling, stipules, twig thickness, inner bark,
    sapwood, terminal buds, fruit shape, fruiting calyx, stigma position,
    leaflet texture and colour on drying, flower and fruit indumentum,
    altitude, habitat and distribution. Type and figure specimens are listed
    in raw/Kochummen_1995_vouchers.csv.
identifiers: .na
locations: .na
contexts:
  - context_property: commonness qualifier
    category: entity_context
    var_in: commonness_qualifier
  - context_property: population region
    category: entity_context
    var_in: population_region
  - context_property: entity measured
    category: method_context
    var_in: entity_measured
  - context_property: trait scoring method
    category: method_context
    var_in: trait_scoring_method
traits:
  - var_in: bark_colour
    unit_in: .na
    trait_name: bark_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Outer bark colour. Extracted from the family and genus and species descriptions (trait scoring method).
  - var_in: bark_texture
    unit_in: .na
    trait_name: bark_texture
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Outer bark surface (smooth, fissured, flaky); scaly, dippled, cracking and lenticellate have no level and stay unmapped. Extracted from the family and genus and species descriptions (trait scoring method).
  - var_in: dispersal_appendage
    unit_in: .na
    trait_name: dispersal_appendage
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Winged seeds (Triomma). Extracted from the genus and species descriptions (trait scoring method).
  - var_in: dispersal_syndrome
    unit_in: .na
    trait_name: dispersal_syndrome
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      From the family Ecology paragraph: drupaceous fruits dispersed by animals (zoochory), the winged seeds of Triomma by wind (anemochory). Extracted from the family and genus descriptions (trait scoring method).
  - var_in: dispersal_unit
    unit_in: .na
    trait_name: dispersal_unit
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Triomma: winged seeds dispersed by wind (family Ecology paragraph). Extracted from the genus descriptions (trait scoring method).
  - var_in: flower_anther_dehiscence
    unit_in: .na
    trait_name: flower_anther_dehiscence
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Anthers opening by a longitudinal slit (Canarium genus description). Extracted from the genus descriptions (trait scoring method).
  - var_in: flower_anther_orientation
    unit_in: .na
    trait_name: flower_anther_orientation
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Anthers dehiscing inwards, scored as introrse (family description). Extracted from the family descriptions (trait scoring method).
  - var_in: flower_colour
    unit_in: .na
    trait_name: flower_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Colour of the flowers or petals as stated; calyx colour is not scored. Extracted from the family and genus and species descriptions (trait scoring method).
  - var_in: flower_fertile_stamens_count
    unit_in: unit
    trait_name: flower_fertile_stamens_count
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Stamen number; in unisexual flowers male-flower counts only (rudimentary stamens of female flowers are not scored). Extracted from the genus and species descriptions (trait scoring method).
  - var_in: flower_filament_length
    unit_in: unit
    trait_name: flower_filament_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Filament length. Extracted from the species descriptions (trait scoring method).
  - var_in: flower_gynoecium_placentation
    unit_in: .na
    trait_name: flower_gynoecium_placentation
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Axile ovules (Haplolobus genus description). Extracted from the genus descriptions (trait scoring method).
  - var_in: flower_length
    unit_in: unit
    trait_name: flower_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Flower length as stated. Extracted from the species descriptions (trait scoring method).
  - var_in: flower_nectar_production
    unit_in: .na
    trait_name: flower_nectar_production
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Nectariferous disc (family description), scored as nectar produced. Extracted from the family descriptions (trait scoring method).
  - var_in: flower_ovary_position
    unit_in: .na
    trait_name: flower_ovary_position
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Superior ovary (family description). Extracted from the family descriptions (trait scoring method).
  - var_in: flower_ovules_per_functional_carpel_count
    unit_in: unit
    trait_name: flower_ovules_per_functional_carpel_count
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Ovules per ovary cell. Extracted from the family and genus descriptions (trait scoring method).
  - var_in: flower_perianth_fusion_categorical
    unit_in: .na
    trait_name: flower_perianth_fusion_categorical
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Sepals and petals free (Triomma). Extracted from the genus descriptions (trait scoring method).
  - var_in: flower_perianth_merism
    unit_in: unit
    trait_name: flower_perianth_merism
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Merism of the flower (3-, 4--5- or 5-merous). Extracted from the family and genus descriptions (trait scoring method).
  - var_in: flower_petal_length
    unit_in: unit
    trait_name: flower_petal_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Petal length. Extracted from the species descriptions (trait scoring method).
  - var_in: flower_structural_carpels_count
    unit_in: unit
    trait_name: flower_structural_carpels_count
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Ovary cell (locule) number, scored as carpel number assuming one locule per carpel. Extracted from the family and genus descriptions (trait scoring method).
  - var_in: flower_structural_sex_type
    unit_in: .na
    trait_name: flower_structural_sex_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Flowers unisexual or bisexual; 'functionally unisexual' (Haplolobus) and 'structurally not always completely unisexual' (Protium) are not scored. Extracted from the family and genus descriptions (trait scoring method).
  - var_in: flowering_time
    unit_in: .na
    trait_name: flowering_time
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Months in which flowering material was collected, from the Ecology paragraph, as printed (y/n for January to December). Extracted from the species descriptions (trait scoring method).
  - var_in: fruit_colour
    unit_in: .na
    trait_name: fruit_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Colour of the fresh, ripe fruit; colours on drying are not scored and for 'X ripening (to) Y' only Y is scored. Extracted from the genus and species descriptions (trait scoring method).
  - var_in: fruit_dehiscence
    unit_in: .na
    trait_name: fruit_dehiscence
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Capsule splitting into valves (Triomma). Extracted from the genus descriptions (trait scoring method).
  - var_in: fruit_fleshiness
    unit_in: .na
    trait_name: fruit_fleshiness
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Pericarp fleshy or dry; 'wrinkled when dry' is not a fleshiness statement. Extracted from the genus descriptions (trait scoring method).
  - var_in: fruit_length
    unit_in: unit
    trait_name: fruit_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Fruit length; the first dimension of 'L x W'. A diameter ('across') of a round fruit is scored as length and width. Extracted from the species descriptions (trait scoring method).
  - var_in: fruit_surface_hairs
    unit_in: .na
    trait_name: fruit_surface_hairs
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Fruit (pericarp) surface hairs. Extracted from the genus and species descriptions (trait scoring method).
  - var_in: fruit_type
    unit_in: .na
    trait_name: fruit_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Fruit type (drupe, capsule). Extracted from the family and genus descriptions (trait scoring method).
  - var_in: fruit_width
    unit_in: unit
    trait_name: fruit_width
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Fruit width; the second dimension of 'L x W'. Extracted from the species descriptions (trait scoring method).
  - var_in: fruiting_time
    unit_in: .na
    trait_name: fruiting_time
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Months in which fruiting material was collected, from the Ecology paragraph, as printed (y/n for January to December). Extracted from the species descriptions (trait scoring method).
  - var_in: inflorescence_length
    unit_in: unit
    trait_name: inflorescence_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Inflorescence length; infructescence lengths are not scored. Extracted from the species descriptions (trait scoring method).
  - var_in: inflorescence_type
    unit_in: .na
    trait_name: inflorescence_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Inflorescence architecture and position; thyrse/thyrsoid scored as panicle. Extracted from the family and genus and species descriptions (trait scoring method).
  - var_in: leaf_apex_shape
    unit_in: .na
    trait_name: leaf_apex_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaflet apex shape; 'pointed', 'cuspidate' and 'long-pointed' have no level and stay unmapped. Extracted from the species descriptions (trait scoring method).
  - var_in: leaf_arrangement
    unit_in: .na
    trait_name: leaf_arrangement
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaf arrangement (spiral, crowded). Extracted from the family and species descriptions (trait scoring method).
  - var_in: leaf_base_shape
    unit_in: .na
    trait_name: leaf_base_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaflet base shape; unequal or asymmetric bases scored as oblique; subcordate has no level. Extracted from the genus and species descriptions (trait scoring method).
  - var_in: leaf_compoundness
    unit_in: .na
    trait_name: leaf_compoundness
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Compound leaves (stated pairs of leaflets, imparipinnate or trifoliolate). Extracted from the family and genus and species descriptions (trait scoring method).
  - var_in: leaf_glaucousness
    unit_in: .na
    trait_name: leaf_glaucousness
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaflets glaucous or white waxy beneath. Extracted from the species descriptions (trait scoring method).
  - var_in: leaf_hairs_adult_leaves
    unit_in: .na
    trait_name: leaf_hairs_adult_leaves
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaflet hairs; surface in entity measured (abaxial, adaxial, or leaflet when not stated). Hair statements that differ between infraspecific taxa are not scored. Extracted from the species descriptions (trait scoring method).
  - var_in: leaf_lamina_division
    unit_in: .na
    trait_name: leaf_lamina_division
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Pinnately compound (imparipinnate) or trifoliolate leaves. Extracted from the family and genus and species descriptions (trait scoring method).
  - var_in: leaf_length
    unit_in: unit
    trait_name: leaf_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Length of the compound leaf. Extracted from the species descriptions (trait scoring method).
  - var_in: leaf_margin
    unit_in: .na
    trait_name: leaf_margin
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaflet margin. Extracted from the family and genus and species descriptions (trait scoring method).
  - var_in: leaf_margin_posture
    unit_in: .na
    trait_name: leaf_margin_posture
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaflet margin curled inwards (involute) or recurved (revolute). Extracted from the species descriptions (trait scoring method).
  - var_in: leaf_phenology
    unit_in: .na
    trait_name: leaf_phenology
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Deciduous trees (Garuga genus description). Extracted from the genus descriptions (trait scoring method).
  - var_in: leaf_shape
    unit_in: .na
    trait_name: leaf_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaflet blade shape. Extracted from the species descriptions (trait scoring method).
  - var_in: leaf_surface_reflectivity
    unit_in: .na
    trait_name: leaf_surface_reflectivity
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Upper leaflet surface shiny. Extracted from the species descriptions (trait scoring method).
  - var_in: leaflet_length
    unit_in: unit
    trait_name: leaflet_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Leaflet blade length; first dimension of 'L x W'. Extracted from the species descriptions (trait scoring method).
  - var_in: leaflet_width
    unit_in: unit
    trait_name: leaflet_width
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Leaflet blade width; second dimension of 'L x W'. Extracted from the species descriptions (trait scoring method).
  - var_in: pedicel_length
    unit_in: unit
    trait_name: pedicel_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Pedicel (flower stalk) length. Extracted from the species descriptions (trait scoring method).
  - var_in: petiole_width
    unit_in: unit
    trait_name: petiole_width
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Petiole thickness near the base. Extracted from the species descriptions (trait scoring method).
  - var_in: plant_diameter_breast_height
    unit_in: unit
    trait_name: plant_diameter_breast_height
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Stem diameter as printed ('80 cm diameter'), recorded as a maximum; height of measurement not stated. Extracted from the species descriptions (trait scoring method).
  - var_in: plant_growth_form
    unit_in: .na
    trait_name: plant_growth_form
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Tree (including treelet) or shrub. Extracted from the family and genus and species descriptions (trait scoring method).
  - var_in: plant_height
    unit_in: unit
    trait_name: plant_height
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Plant height; 'to X m tall' is a maximum. Extracted from the species descriptions (trait scoring method).
  - var_in: root_system_type
    unit_in: .na
    trait_name: root_system_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Stilt roots. Extracted from the genus and species descriptions (trait scoring method).
  - var_in: seed_colour
    unit_in: .na
    trait_name: seed_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Testa colour (Canarium genus description). Extracted from the genus descriptions (trait scoring method).
  - var_in: seedling_first_node_leaf_count
    unit_in: .na
    trait_name: seedling_first_node_leaf_count
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      First two seedling leaves opposite (paired) or alternate (single). Extracted from the family and species descriptions (trait scoring method).
  - var_in: seedling_germination_location
    unit_in: .na
    trait_name: seedling_germination_location
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Epigeal or hypogeal germination. Extracted from the family and genus and species descriptions (trait scoring method).
  - var_in: sex_type
    unit_in: .na
    trait_name: sex_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Dioecious or monoecious; 'male and female on separate trees' scored as dioecious. Extracted from the family and genus descriptions (trait scoring method).
  - var_in: stem_base_form
    unit_in: .na
    trait_name: stem_base_form
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Buttresses or fluted bole. Extracted from the family and genus and species descriptions (trait scoring method).
  - var_in: stem_hairs
    unit_in: .na
    trait_name: stem_hairs
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Twig hairs; statements limited to young twigs or twig tips are not scored. Extracted from the species descriptions (trait scoring method).
substitutions:
  - trait_name: bark_colour
    find: 'brownish'
    replace: 'brown'
  - trait_name: bark_colour
    find: 'brownish green'
    replace: 'brown green'
  - trait_name: bark_colour
    find: 'brownish reddish'
    replace: 'brown red'
  - trait_name: bark_colour
    find: 'dark_brown'
    replace: 'brown_dark'
