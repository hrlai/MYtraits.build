source:
  primary:
    key: Berhaman_1995
    bibtype: InBook
    year: 1995
    author: A. Berhaman
    title: Bignoniaceae
    booktitle: Tree Flora of Sabah and Sarawak, Volume 1
    editor: E. Soepadmo and K. M. Wong
    publisher:
      Sabah Forestry Department and Forest Research Institute Malaysia and
      Sarawak Forestry Department
    place: Kepong, Malaysia
    pages: 33--44
    isbn: 983-9592-34-3
contributors:
  data_collectors:
    - last_name: Berhaman
      given_name: A.
      ORCID: .na
      affiliation: Forest Research Centre, Sabah Forestry Department, Sandakan, Malaysia
  dataset_curators: Hao Ran Lai
dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '1995'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description: |
    To describe the morphology, distribution and ecology of the Bignoniaceae
    of Sabah and Sarawak, represented by Deplanchea (1 species),
    Dolichandrone (1), Oroxylum (1), Radermachera (3, one undescribed) and
    the woody climber genus Nyctocalos (4 unnamed species, key annotation
    only), as part of the Tree Flora of Sabah and Sarawak.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: |
    Trait values were transcribed by hand (raw/build_trait_data.R, with
    flora_hand()) from the text layer of the 2007 electronic version of the
    treatment (L. G. Saw and B. Aslina), clause by clause, from the family,
    genus and species descriptions and the Ecology and Uses paragraphs. The
    electronic version has embedded fonts and no page images on its text
    pages, so the text layer is what renders; every text page was checked
    against a page render. It is a retyped text, and no scan of the 1995
    print was available to check it. Keys were not used; figure captions
    were used for vouchers only. Each value keeps the clause it came from
    (trait_value_raw), the source term (trait_value) and the page. Several
    values are listed in text order, and alternatives qualified by a
    commonness word (usually, rarely) are recorded on separate rows. A
    measured range is recorded as minimum and maximum values, a single or
    "c." value as a mean and "to X" as a maximum. Categorical values stated
    singly and without qualification in the family or genus description are
    applied to member taxa whose own descriptions are silent, when every
    member that describes the trait agrees (trait_scoring_method =
    inferred_from_family / inferred_from_genus).
  original_file:
    Bignoniaceae.pdf (Berhaman 1995, Tree Flora of Sabah and Sarawak vol. 1,
    pp. 33--44; electronic version 2007)
  notes: |
    data.csv is raw/trait_data.csv (written by raw/build_trait_data.R) with
    three columns added by flora_make_data(): value (the source term for
    categorical traits, mapped with substitutions), trait_scoring_method
    (from rank_scored_from) and source_id. Taxon names are as printed. Family
    and genus descriptions are kept as family- and genus-rank records as well
    as copied to member taxa. Radermachera pinnata has one infraspecific
    taxon in the region (subsp. acuminata), which carries the description
    (TFSS guide); its values are recorded at subspecies rank. Radermachera
    sp. A has no description (differential note only) and Nyctocalos is
    treated only as an annotation in the key to genera; neither is scored
    (raw/taxon_flags.csv). Species description values have population
    region Sabah and Sarawak; copied family and genus values, the family
    Ecology statements about Oroxylum indicum and the Dolichandrone
    spathacea wood density (Uses) have none. Source repairs (missing range
    dashes on p. 42) are in raw/source_fixes.csv. Every clause with no trait
    in config/traits.yml stays in raw/trait_data.csv as an unmapped record
    (summary in raw/unmapped_terms.csv): leaflet pair number, vein number
    and relief, glands and domatia, leaf texture, inner bark, sapwood, young
    twigs, calyx shape and size, corolla length and width, corolla lobes,
    stamen exsertion, disc, ovules, style and stigma, fruit shape, seed
    wing size, nocturnal anthesis, cauliflory, altitude, habitat,
    distribution, uses and taxonomy. "glands scattered on the flower
    surface", printed among the leaf clauses of Oroxylum indicum (p. 38), is
    kept unmapped. Type and figure specimens are listed in
    raw/Berhaman_1995_vouchers.csv.
identifiers: .na
locations: .na
contexts:
  - context_property: commonness qualifier
    category: entity_context
    var_in: commonness_qualifier
  - context_property: population region
    category: entity_context
    var_in: population_region
  - context_property: entity measured
    category: method_context
    var_in: entity_measured
  - context_property: trait scoring method
    category: method_context
    var_in: trait_scoring_method
traits:
  - var_in: bark_colour
    unit_in: .na
    trait_name: bark_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Outer bark colour; inner bark and sapwood are not scored.
  - var_in: bark_texture
    unit_in: .na
    trait_name: bark_texture
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Outer bark surface (smooth, fissured, flaky); fissured scored as furrowed; scaly and lenticellate have no level and stay unmapped.
  - var_in: dispersal_appendage
    unit_in: .na
    trait_name: dispersal_appendage
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Winged seeds.
  - var_in: dispersal_syndrome
    unit_in: .na
    trait_name: dispersal_syndrome
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      From the family Ecology paragraph: the winged seeds are dispersed by wind (anemochory).
  - var_in: flower_colour
    unit_in: .na
    trait_name: flower_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Colour of the corolla or flowers as stated; calyx colour is not scored. Oroxylum indicum outer and inner corolla colours are recorded with entity_measured.
  - var_in: flower_fertile_stamens_count
    unit_in: unit
    trait_name: flower_fertile_stamens_count
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Stamen number; a fifth rudimentary stamen (Dolichandrone spathacea) is not counted.
  - var_in: flower_length
    unit_in: unit
    trait_name: flower_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Flower length as stated (Oroxylum indicum).
  - var_in: flower_nectar_production
    unit_in: .na
    trait_name: flower_nectar_production
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Nectary usually present (family description).
  - var_in: flower_orientation
    unit_in: .na
    trait_name: flower_orientation
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Flowers erect (Radermachera ramiflora), scored as up.
  - var_in: flower_ovary_position
    unit_in: .na
    trait_name: flower_ovary_position
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Superior ovary (family description).
  - var_in: flower_perianth_symmetry
    unit_in: .na
    trait_name: flower_perianth_symmetry
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Corolla bilaterally symmetrical or zygomorphic.
  - var_in: flower_scent_production
    unit_in: .na
    trait_name: flower_scent_production
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Flowers fragrant or with musky odour.
  - var_in: flower_shape
    unit_in: .na
    trait_name: flower_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Corolla funnel-shaped, campanulate or salver-shaped.
  - var_in: flower_structural_carpels_count
    unit_in: unit
    trait_name: flower_structural_carpels_count
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Ovary cells, scored as carpels assuming one locule per carpel.
  - var_in: flower_structural_sex_type
    unit_in: .na
    trait_name: flower_structural_sex_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Flowers bisexual (family description).
  - var_in: flower_style_length
    unit_in: unit
    trait_name: flower_style_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Style length.
  - var_in: flower_tube_length
    unit_in: unit
    trait_name: flower_tube_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Corolla tube length; for Radermachera ramiflora the narrow basal part of the corolla.
  - var_in: flowering_time
