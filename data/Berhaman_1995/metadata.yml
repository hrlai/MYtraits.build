    trait_name: flowering_time
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Months of flowering from the Ecology paragraph, as printed (y/n for January to December).
  - var_in: fruit_dehiscence
    unit_in: .na
