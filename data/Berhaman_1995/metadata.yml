questions:
  question1: |
    Source fixes on p. 42 (Radermachera ramiflora): the electronic version
    prints "3045 m tall, 3050 cm diameter" and "3.58.5 x 1.53.5 cm" with the
    range dashes missing (they are missing in the rendered page too). They
    are read as 30--45 m, 30--50 cm and 3.5--8.5 x 1.5--3.5 cm, the only
    ascending readings; plant height, stem diameter and leaflet size depend
