  collection_date: 07-2014/09-2014
  taxon_name: species
  location_name: unknown
  description:
    We measured the terminal velocity of helicopter-like fruit from the
    Dipterocarpaceae family and present a model predicting the terminal
    velocities for all dipterocarp species in the Malesiana region. A ballistic
    model of seed dispersal using the observed terminal velocities predicted
    dispersal distances of 17–77 m under normal atmospheric conditions. These
    data are of applied use in parametizing models of species coexistence,
    forest regeneration and habitat connectivity in Southeast Asian tropical
    forests.
  basis_of_record: field
  life_stage: adult
  sampling_strategy:
    Dipterocarp fruit have between zero and five elongated sepals which act as
    wings to disperse the fruit via gravity or gyration (Suzuki & Ashton 1996,
    Smith et al. 2015). We collected mature fruit belonging to 16 dipterocarp
    species from five genera (one Dipterocarpus, one Dryobalanops, three Hopea,
    two Parashorea, and nine Shorea) (Table 1) found in the Sepilok Forest
    Reserve (SFR)(5°51′ N 117°56′ E) or the Danum Valley Conservation Area
    (DVCA), Sabah, Malaysian Borneo. SFR is a 4420 ha fragment of primarily
    tropical lowland dipterocarp forest, ranging in altitude 0–170 m asl (Fox
    1973). DVCA is a 438 km2 area of uninhabited primary lowland dipterocarp
    forest (Marsh & Greer 1992). Fruit were collected from the ground during the
    2014 community-wide mast fruiting event occurring between July and
    September.
  original_file: unknown
  notes:
    The paper also predicted fruit traits but I did not include them because the
    field-measured traits are the focus of this study. The predicted traits are
    based on Flora Malesiana, which we will digitise one day, so I want to avoid
    duplication pre-emptively now.
