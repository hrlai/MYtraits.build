traits:
  - var_in: dbh
    unit_in: cm
    trait_name: plant_diameter_breast_height
    entity_type: population
    value_type: maximum
    basis_of_value: measurement
    replicates: see number of rows in the original file
    methods: Diameter at breast height during the 2005 census of the 50-ha plot.
  - var_in: diameter
    unit_in: m
    trait_name: plant_width
    entity_type: population
    value_type: maximum
    basis_of_value: measurement
    replicates: see number of rows in the original file
    methods:
      We measured crown diameters as the mean distance between the center and
      the edge of the crown in the four cardinal directions. Note, the center of
      the crown was projected onto the ground and was often displaced from the
      tree’s trunk. Heights and crown diameters approach species-level maximum
      values because (1) we targeted the six largest individuals of the 100 most
      abundant species in the 50-ha plot and (2) there were 894 individuals of
      the 100th most abundant species in the 2005 census.
  - var_in: height
    unit_in: m
    trait_name: plant_height
    entity_type: population
    value_type: maximum
    basis_of_value: measurement
    replicates: see number of rows in the original file
    methods:
      We measured height with a telescoping pole for trees less than 15.2 m tall
      and with a laser range finder and clinometer for taller trees. We
      calculated the heights of taller trees as the sum of the height of the
      observer’s eye and the product of the distance and the sine of the angle
      to the uppermost leaves.
  - var_in: "N"
    unit_in: g/g
    trait_name: leaf_N_per_dry_mass
    entity_type: population
    value_type: mean
    basis_of_value: measurement
    replicates: unknown
    methods:
      We determined mean species-level leaf tissue nitrogen (%) and leaf tissue
      phosphorus concentrations (%) for sun leaves exposed to direct sunlight
      and shaded leaves with minimal exposure to direct sunlight. Sun leaves had
      exposure values of 3, 4, or 5 (see previous paragraph). Shade leaves had
      exposure values of 1 or 2 (see previous paragraph). To determine mean
      values for each species and exposure category, we pooled equal masses of
      oven-dried leaf tissue from the appropriate trees. FRIM laboratory
      protocols for nitrogen and phosphorus determinations can be found at the
      end of this document. Unfortunately, the original laboratory report
      includes just one significant digit for many phosphorus concentrations.
  - var_in: P
    unit_in: g/g
    trait_name: leaf_P_per_dry_mass
    entity_type: population
    value_type: mean
    basis_of_value: measurement
    replicates: unknown
    methods:
      We determined mean species-level leaf tissue nitrogen (%) and leaf tissue
      phosphorus concentrations (%) for sun leaves exposed to direct sunlight
      and shaded leaves with minimal exposure to direct sunlight. Sun leaves had
      exposure values of 3, 4, or 5 (see previous paragraph). Shade leaves had
      exposure values of 1 or 2 (see previous paragraph). To determine mean
      values for each species and exposure category, we pooled equal masses of
      oven-dried leaf tissue from the appropriate trees. FRIM laboratory
      protocols for nitrogen and phosphorus determinations can be found at the
      end of this document. Unfortunately, the original laboratory report
      includes just one significant digit for many phosphorus concentrations.
