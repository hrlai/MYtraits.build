questions:
  question1: 'Symplocos theifolia is described in full but ''Not yet collected from Peninsular Malaysia''; it is known in the flora region only from Singapore (Kranji), and the family Distribution says it ''is also included in this account''. Its rows (31 mapped) are scored with a blank population_region and a note. Decide: keep them so, give them population_region Singapore, or drop them as outside the region.'
  question2: 'Calyx. The calyx is printed as a whole (''calyx glabrous, 1.5--2.5 mm long'') and by its lobes (''lobes 1--1.5 mm long''). The lobe length is scored as flower_sepal_length with entity_measured calyx lobe (47 rows); the whole calyx (limb) length stays unmapped (25 rows). Confirm, or score the calyx length instead.'
  question3: 'Dimension pairs. ''a x b'' sizes are read as length x width for the lamina (all taxa with a lamina size) and for the fruits of S. cochinchinensis subsp. laurina var. laurina (''4--6 x 3--5 mm'') and S. laeteviridis var. laeteviridis (''7--12 x 3--5(--6) mm''). Confirm.'
  question4: 'Inflorescence axis. ''axis 2--6 cm long'' is scored as inflorescence_length with entity_measured inflorescence axis (43 rows), as the rachis is in Ashton_2004. Lengths of the axis ''in fruit'' (S. cerasifolia var. cerasifolia) and hair lengths printed after the axis are not scored; ''axis 0--1--2 cm long'' (S. crassipes var. curtisii, p. 240, a printed slip) is unmapped. Confirm the mapping.'
  question5: 'Dispersers. ''The fruits were observed to be eaten by birds (Kochummen FRI 23118)'' (S. celastrifolia Ecology, p. 230) is scored dispersers = birds with no population region (1 row, raw/manual_rows.csv). Eating is not stated as dispersal. Confirm, or keep the sentence unmapped.'
  question6: 'Sex type. The genus description says ''rarely by reduction unisexual and the plant androdioecious (e.g., S. wikstroemifolia)''; the species description says ''Flowers white, bisexual and male, probably all flowers on a plant the same''. S. wikstroemifolia is scored sex_type androdioecious from the genus statement (1 row, raw/manual_rows.csv) and flower_structural_sex_type bisexual unisexual from its own description. Confirm, or drop the sex_type row because the species statement is hedged (''probably'').'
  question7: 'Corolla length. ''corolla 2--5 mm long'' is scored as flower_length with entity_measured corolla (67 rows), by the user rule for corolla length. In subgen. Symplocos the corolla is ''divided nearly to the base'' and petals are ''connate only at the very base'', so the corolla length is in effect the petal length. Confirm flower_length, or score these as flower_petal_length.'
  question8: 'Hypanthium. Symplocos has an inferior ovary enclosed by the hypanthium (''hypanthium broadly funnel-shaped, glabrous, 1--1.5 mm high, completely covering the fruit''). Its height (26 rows, 1 per taxon) is unmapped. Prance_2012 scores the free receptacle tube of Chrysobalanaceae as flower_tube_length (Prance_2012 question 2). Decide: score the hypanthium height as flower_tube_length with entity_measured hypanthium, or keep it unmapped.'
  question9: 'S. crassipes var. crassipes is known only from the type and its description ends ''Inflorescences and flowers as in var. brandiana''. The brandiana inflorescence and flower values (bract length, pedicel length, calyx lobe length, stamen count) are not copied to var. crassipes, which instead inherits the species values where it is silent. Decide whether to copy the var. brandiana values.'
  question10: 'Bract length below the traits.yml range. flower_bract_length allows 1--100 mm, but bracts and bracteoles of S. ophirensis and its varieties, S. sumuntia and S. cochinchinensis subsp. laurina var. laurina are printed as 0.5 or 0.8 mm (9 rows, minima of ranges such as ''bracts 0.5--2 mm long''). They will be excluded at build. Decide whether to lower the trait minimum in traits.yml (upstream, AusTraits Plant Dictionary).'
