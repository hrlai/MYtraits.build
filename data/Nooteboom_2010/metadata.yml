taxonomic_updates:
  - find: Symplocos cochinchinensis subsp. cochinchinensis var. cochinchinensis
    replace: Symplocos cochinchinensis subsp. cochinchinensis
    reason: Exact match of the first three words of the taxon name to an accepted
      canonical name (2026-11-09)
    taxonomic_resolution: subspecies
  - find: Symplocos cochinchinensis subsp. laurina var. laurina
    replace: Symplocos cochinchinensis subsp. laurina
    reason: Exact match of the first three words of the taxon name to a synonymous
      canonical name (2026-11-09)
    taxonomic_resolution: subspecies
  - find: Symplocos ophirensis subsp. ophirensis var. densireticulata
    replace: Symplocos ophirensis subsp. ophirensis
    reason: Exact match of the first three words of the taxon name to an accepted
      canonical name (2026-11-09)
    taxonomic_resolution: subspecies
  - find: Symplocos ophirensis subsp. ophirensis var. ophirensis
    replace: Symplocos ophirensis subsp. ophirensis
    reason: Exact match of the first three words of the taxon name to an accepted
      canonical name (2026-11-09)
    taxonomic_resolution: subspecies
  - find: Symplocos ophirensis subsp. perakensis var. perakensis
    replace: Symplocos ophirensis subsp. perakensis
    reason: Exact match of the first three words of the taxon name to an accepted
      canonical name (2026-11-09)
    taxonomic_resolution: subspecies
  - find: Symplocos pendula var. pendula
    replace: Symplocos pendula
    reason: Exact match of the first two words of the taxon name to an accepted canonical
      name (2026-11-09)
    taxonomic_resolution: species
  - find: Symplocos wikstroemifolia
    replace: Symplocos wikstroemiifolia
    reason: Fuzzy match of taxon name to an accepted canonical name in WCVP v16 once
