  custom_R_code: .na
  collection_date: 1995/1995
  taxon_name: species
  location_name: unknown
  description:
    The species investigated include a wide range of primary forest species, but
    focus on five genera that indude sympatric species ranging in stature from
    understory treelets to canopy trees---Aporusa (Euphorbiaceae), Baccaurea
    (Euphorbiaceae), Diospyros (Ebenaceae), Garcinia (Clusiaceae), and Ixora
    (Rubiaceae).
  basis_of_record: field
  life_stage: sapling
  sampling_strategy:
    Leaf length and width were measured for 8 randomly sampled fully expanded
    leaves from each of 3 saplings and 3 adult trees for each species studied.
    Leaves were considered to be fully expanded if they had attained the color
    and texture characteristic of mature leaves of a given species (cf. Kursar &
    Coley 1992). To locate saplings of each species we selected undamaged
    individuals falling within the 1.0 cm diameter size class and less than 4 m
    in height, where possible. For some larger and uncommon tree species we
    included saplings up to 2.5 cm in diameter, and for the smallest-statured
    tree species we located smaller saplings (approx. 0.5 cm diameter and 1-2 m
    in height) in order that all individuals considered as saplings were below
    estimated reproductive size thresholds for the species in question.
    Measurements on adult trees generally made use of the largest individuals
    found within the 50 ha plot; we used trees above estimated reproductive size
    thresholds where such estimates were available (based on Thomas 1993). Some
    adult trees showed signs of previous damage, usually scars from broken
    limbs, but all were outwardly healthy. Individuals in gaps were
    avoided---all trees sampled were under shaded conditions with the exception
    of adult individuals of several large canopy species (Dipterocarpus
    cornutus, Shorea macroptera, Diospyros maingayi, and some individuals of
    Aporusa swamp sp nov, Garcinia nervosa and Lithocarpus wrayi). For saplings,
    eight leaves were randomly selected for measurement among the subset of
    undamaged fully expanded leaves on each individual. For adult trees, fallen
    leaves were collected from beneath the crown, and eight leaves were randomly
    chosen from those found. We avoided adult trees with dose conspecific
    neighbors, so that the source of fallen leaves was unambiguous. The species
    sampled all possess simple, entire leaves.
  original_file: unknown
  notes:
    Collection date was not stated in the original paper, HR Lai put it down as
    1995, the published date.
