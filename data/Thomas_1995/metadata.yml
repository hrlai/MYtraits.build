traits:
  - var_in: area_sapling_mean
    unit_in: cm2
    trait_name: leaf_area
    entity_type: population
    value_type: mean
    basis_of_value: measurement
    replicates: "3"
    methods:
      A subset of leaves from each species was collected and dried flat at 50C
      to constant weight. For some of these leaves length and width measurements
      were made to the nearest mm before drying, to quantify leaf shrinkage.
      Similar measurements were subsequently made on dried leaf samples from all
      species in the main study genera, in conjunction with leaf area
      measurements using an electronic leaf area meter (LI-3100 Li-Cor Inc.,
      Lincoln, Nebraska, U.S.A.).
