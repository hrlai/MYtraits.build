traits:
  - var_in: Asat_area
    unit_in: umol{CO2}/m2/s
    trait_name: leaf_photosynthetic_rate_per_area_saturated
    entity_type: individual
    value_type: mean
    basis_of_value: measurement
    replicates: unknown
    methods:
      We measured Asat, Vcmax and Rleaf on non-senescing, fully formed leaves
      using two cross-calibrated portable photosynthesis systems (LI-6400XT and
      LI-6800, LI-COR, Nebraska, USA). For measurements of Asat and Vcmax,
      leaves were allowed to stabilise for a minimum of 20 minutes in full
      sunlight before being placed within the leaf chamber of the LI-6800
      (Verryckt et al., 2020). Inside the leaf chamber, a CO2 concentration of
      400 ppm, photosynthetically active radiation (PAR) of 1500 umol m-2 s-1, a
      temperature of 28C and relative humidity of 60-70 % was set. We measured
      net photosynthetic assimilation under these conditions to estimate
      photosynthesis under saturating light (Asat) and used the one-point method
      to estimate maximum rates of rubisco carboxylation (Vcmax) standardised to
      25C following the equations of De Kauwe et al. (2016), using measured
      Rleaf values (see below). In order to maintain data quality,
      photosynthesis measurements were only taken if stomatal conductance
      exceeded 0.05 mol m-2 s-1 (Rowland et al., 2015).
  - var_in: Asat_mass
    unit_in: umol{CO2}/kg/s
    trait_name: leaf_photosynthetic_rate_per_dry_mass_saturated
    entity_type: individual
    value_type: mean
    basis_of_value: measurement
    replicates: unknown
    methods:
      We measured Asat, Vcmax and Rleaf on non-senescing, fully formed leaves
