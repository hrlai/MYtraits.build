      exceeded 0.05 mol m-2 s-1 (Rowland et al., 2015).
  - var_in: Rleaf_area
    unit_in: umol{CO2}/m2/s
    trait_name: leaf_dark_respiration_per_area
    entity_type: individual
    value_type: mean
    basis_of_value: measurement
    replicates: unknown
    methods:
      Rleaf was measured on a leaf adjacent to that used to measure
      photosynthetic capacity using a LI-6400XT. We wrapped these leaves inside
      aluminium foil for a minimum of 30 minutes to adapt them to the dark
      before placing them inside the leaf chamber. Rleaf measurements were taken
      directly after photosynthesis measurements. Leaf chamber conditions were
      maintained at 400 ppm CO2, 0 umol m-2 s-1 PAR, 28C and 60-70 % relative
      humidity. Five measurements of Rleaf were recorded at 5 second intervals,
      and subsequently standardised to 25C following Rowland et al. (2015), and
      the mean calculated. We use the stomatal conductance from the Rleaf
      measurement as a measure of gdark, with lower values an indicator of
      greater resource conservation. Steady state conditions within the leaf
      chamber were reached before all gas exchange measurements were recorded.
  - var_in: Rleaf_mass
    unit_in: umol{CO2}/kg/s
    trait_name: leaf_dark_respiration_per_dry_mass
    entity_type: individual
    value_type: mean
    basis_of_value: measurement
    replicates: unknown
    methods:
      Rleaf was measured on a leaf adjacent to that used to measure
      photosynthetic capacity using a LI-6400XT. We wrapped these leaves inside
      aluminium foil for a minimum of 30 minutes to adapt them to the dark
      before placing them inside the leaf chamber. Rleaf measurements were taken
      directly after photosynthesis measurements. Leaf chamber conditions were
      maintained at 400 ppm CO2, 0 umol m-2 s-1 PAR, 28C and 60-70 % relative
      humidity. Five measurements of Rleaf were recorded at 5 second intervals,
      and subsequently standardised to 25C following Rowland et al. (2015), and
      the mean calculated.
  - var_in: LMA
    unit_in: g/m2
    trait_name: leaf_mass_per_area
    entity_type: individual
    value_type: mean
    basis_of_value: measurement
    replicates: unknown
    methods:
      Once leaf gas exchange measurements were complete, we removed both the
      photosynthesis and respiration leaves and placed them in an airtight
      ziplock bag. Moist cotton wool was used to maintain humidity inside the
      bag and prevent water loss from the leaves. Leaves were weighed
      immediately on return to the lab and scanned using a flatbed scanner
      (CanoScan LiDE 120, Canon Inc., Tokyo, Japan). Leaf area was calculated
      using ImageJ software (Schneider et al., 2012). Leaves were subsequently
      placed in an oven at 50C and dried to a constant mass for 48-72 hours,
      before being re-weighed. LMA for the Vcmax and Rleaf leaves was calculated
      by dividing dry leaf mass by leaf area, allowing gas exchange measurements
      to be expressed on both an area and mass basis. The mean of these leaves
      was used for LMA estimates.
  - var_in: leaf.thickness
    unit_in: mm
    trait_name: leaf_thickness
    entity_type: individual
    value_type: mean
    basis_of_value: measurement
    replicates: unknown
    methods:
      Once leaf gas exchange measurements were complete, we removed both the
      photosynthesis and respiration leaves and placed them in an airtight
      ziplock bag. Moist cotton wool was used to maintain humidity inside the
      bag and prevent water loss from the leaves. Leaf thickness was measured at
      three points on both the Vcmax and Rleaf leaves using precision digital
      callipers avoiding major veins. A mean of means was calculated to generate
      an estimate of branch level leaf thickness.
  - var_in: gdark
    unit_in: mol/m2/s
    trait_name: .na
    entity_type: individual
    value_type: mean
    basis_of_value: measurement
    replicates: unknown
    methods:
      We use the stomatal conductance from the Rleaf measurement as a measure of
      gdark, with lower values an indicator of greater resource conservation.
      Steady state conditions within the leaf chamber were reached before all
      gas exchange measurements were recorded.
  - var_in: n.leaf
    unit_in: g/kg
    trait_name: leaf_N_per_dry_mass
    entity_type: individual
    value_type: mean
    basis_of_value: measurement
    replicates: unknown
    methods:
      Leaves from the additional harvested branch were analysed to quantify
      [N]leaf, [P]leaf, [Ca]leaf, [K]leaf and [Mg]leaf concentrations. Leaves
      were dried in a lab oven to constant weight and then ground using a Wiley
      Mill ED-5 (Thomas Scientific, USA) to pass a 2-mm sieve. A portion of each
      sample was further dried at 105C to determine the moisture content, which
      was used to convert all data (based on air-dry values) to oven-dry values.
      Subsamples of the ground leaves were analysed for total N, P, Ca, K, and
      Mg concentrations. Leaves were digested following the Kjeldahl method
      using concentrated sulphuric acid (Anderson and Ingram, 1993) and [N]leaf
      was measured using a micro-SFA (Astoria2 Analyzer, Astoria Pacific,
      Oregon, USA). For the determination of [P]leaf, [Ca]leaf, [K]leaf, and
      [Mg]leaf, the ground samples were digested using the sulphuric
      acid-hydrogen peroxide method (Allen, 1989). [P]leaf was determined
      colorimetrically using the molybdenum-blue method (Anderson and Ingram,
      1993) by measuring the absorbance at 880 nm on a Spectrophotometer
      (Hitachi U-2900 UV/Vis , Tokyo, Japan). [Ca]leaf, [K]leaf and [Mg]leaf
      were measured spectrophotometrically on a Spectro Arcos ICP-OES (Spectro
      Analytical Instruments, Kleve, Germany). Leaf nutrient concentrations were
      multiplied by LMA (see above) to convert concentrations from a mass- to
      area-basis.
  - var_in: p.leaf
    unit_in: g/kg
    trait_name: leaf_P_per_dry_mass
