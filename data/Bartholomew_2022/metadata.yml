      sample was further dried at 105C to determine the moisture content, which
      was used to convert all data (based on air-dry values) to oven-dry values.
      Subsamples of the ground leaves were analysed for total N, P, Ca, K, and
      Mg concentrations. Leaves were digested following the Kjeldahl method
      using concentrated sulphuric acid (Anderson and Ingram, 1993) and [N]leaf
      was measured using a micro-SFA (Astoria2 Analyzer, Astoria Pacific,
      Oregon, USA). For the determination of [P]leaf, [Ca]leaf, [K]leaf, and
      [Mg]leaf, the ground samples were digested using the sulphuric
      acid-hydrogen peroxide method (Allen, 1989). [P]leaf was determined
      colorimetrically using the molybdenum-blue method (Anderson and Ingram,
      1993) by measuring the absorbance at 880 nm on a Spectrophotometer
      (Hitachi U-2900 UV/Vis , Tokyo, Japan). [Ca]leaf, [K]leaf and [Mg]leaf
      were measured spectrophotometrically on a Spectro Arcos ICP-OES (Spectro
      Analytical Instruments, Kleve, Germany). Leaf nutrient concentrations were
      multiplied by LMA (see above) to convert concentrations from a mass- to
      area-basis.
