  - var_in: Vcmax_mass
    unit_in: umol{CO2}/kg/s
    trait_name: leaf_photosynthesis_Vcmax_per_mass
    entity_type: individual
    value_type: mean
    basis_of_value: measurement
    replicates: unknown
    methods:
      We measured Asat, Vcmax and Rleaf on non-senescing, fully formed leaves
      using two cross-calibrated portable photosynthesis systems (LI-6400XT and
      LI-6800, LI-COR, Nebraska, USA). For measurements of Asat and Vcmax,
