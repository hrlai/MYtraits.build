dataset:
  data_is_long_format: no
  custom_R_code: .na
  collection_date: collection.date
  taxon_name: species
  location_name: plot
  individual_id: id
  description:
    This study evaluated how leaf physiological function changes with nutrient
    availability across a fine-scale edaphic gradient and whether these
    relationships vary according to tree height. Furthermore, we tested whether
    intraspecific leaf trait variation allows generalist species to populate a
    wider range of environments. We measured leaf traits of 218 trees ranging in
    height from 4 to 66 m from 13 dipterocarp species within four tropical
    forest types (alluvial, mudstone, sandstone, kerangas) occurring along an
    <5km edaphic gradient in North Borneo. The traits measured included
    saturating photosynthesis (Asat), maximum photosynthetic capacity (Vcmax),
    leaf dark respiration (Rleaf), leaf mass per area (LMA), leaf thickness,
    minimum stomatal conductance (gdark) and leaf nutrient concentrations (N, P,
    Ca, K, Mg).
  basis_of_record: field
  life_stage: adult
  sampling_strategy:
    Leaves were sampled from a sunlit branch, or a branch from the top of the
    crown for understorey trees, using rope-climbing canopy access. Leaves from
    cut branches were used to measure 14 leaf traits--- saturating
    photosynthesis (Asat), maximum photosynthetic capacity (Vcmax) and leaf dark
    respiration (Rleaf) standardised to 25 degC, abaxial leaf conductance after
    30 min of dark adaptation (gdark), leaf mass per area (LMA), leaf thickness
    and leaf nutrient concentrations ([N]leaf, [P]leaf, [Ca]leaf, [K]leaf,
    [Mg]leaf). We present both mass-based and area-based measures of Asat, Vcmax
    and Rleaf. For each tree, we collected a sunlit branch, or a branch from the
    top of the crown for understory trees, of approximately 1-2 m length and 1-2
    cm diameter. All trees, or neighbouring trees, were climbed using single and
    double-rope climbing techniques to access the canopy. Branches were cut
    between 0900 and 1400, except when logistical challenges associated with
    tree climbing delayed branch harvesting. Following branch harvesting, the
    branch was trimmed to a length of approximately 1 m for gas exchange
    measurements, placed in water and cut twice underwater to restore water
    supply to the leaves (Domingues et al., 2010). For leaf nutrient samples, an
    additional branch of 60-80 cm length was collected, placed in a large, black
    plastic bag with wet tissue paper and transported back to the Forest
    Research Centre, Sepilok, for further processing on the day of collection.
  original_file: raw/Bartholomew_2022_FunEcol_data.xlsx
  notes:
    This dataset contains stomatal conductance at dark respiration, but this
    trait is not available in the traits.build dictionary
