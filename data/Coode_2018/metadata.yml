dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '2018'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description:
    To describe the morphology, distribution and ecology of the Elaeocarpaceae
    of Peninsular Malaysia, represented by Elaeocarpus (36 species including a
    new unnamed species) and Sloanea (3 species), as part of the Flora of
    Peninsular Malaysia.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy:
    Trait values were extracted with a script (raw/build_trait_data.R) from the
    text layer of the treatment PDF, clause by clause, from the family, genus,
    informal species-group and species descriptions; keys, maps, plates and the
    index were not used. Values from the Ecology and Notes paragraphs were
    transcribed by hand (raw/manual_rows.csv). Each value keeps the clause it
    came from (trait_value_raw), the source term (trait_value) and the page.
    Several values are listed in the order they appear in the text, and
    alternatives qualified by a commonness word (usually, often, sometimes,
    rarely) are recorded on separate rows; parenthetical extremes of a measured
    range are recorded on commonness qualifier = extreme_range rows. A measured
    range is recorded as minimum and maximum values, a single or "c." value as
    a mean and "to X" as a maximum. Categorical values stated singly and
    without qualification in the family, genus or species-group description
    are applied to member taxa whose own descriptions are silent, when every
    member that describes the trait agrees (trait_scoring_method =
    inferred_from_family / inferred_from_genus / inferred_from_species_group).
    Subspecies and varieties silent on a trait take their species' values
    (inferred_from_species).
  original_file:
    Elaeocarpaceae.pdf (Coode 2018, Flora of Peninsular Malaysia Series II vol.
    7, pp. 33--126)
  notes:
    'data.csv is raw/trait_data.csv (written by raw/build_trait_data.R) with
    three columns added by raw/extra_R_code_Coode_2018.R: value (the build
    column; the source term for categorical traits, mapped with substitutions),
    trait_scoring_method (from rank_scored_from) and source_id (Roubik_2006,
    Ng_2014 or Corner_1988 for the Ecology statements that cite those works).
    Taxon names are as printed in the treatment. The two informal forms of
    Elaeocarpus angustifolius (Sumatra/Peninsular Malaysia form, widespread
    form) are merged into the species and recorded with a form context; the
    intermediate form (no description) and the ovalis form of E. petiolatus
    (not collected in Peninsular Malaysia) are not scored. Elaeocarpus sp. nov.
    (unnamed, Coilopetalum group) is kept under its printed label. Excluded
    species (E. euneurus, E. serratus) and the incompletely known E.
    macrocarpus are not scored. E. obtusus subsp. krukovii has no description;
    its values come from the differential paragraph. Pollination records cited
    from Sarawak are kept (population region); dispersal records from India
    and southern Thailand are not. Genus statements qualified by "sometimes"
    (e.g. flowers sometimes fragrant) are not copied to species. Type and
    figure specimens are listed in raw/Coode_2018_vouchers.csv; per-taxon
    status flags in raw/taxon_flags.csv. Characters with no trait in
    traits.yml are listed in raw/unmapped_terms.csv (not extracted as candidate
    traits): twig thickness, colour and shape; petal apical divisions, hairs,
    keel, basal pockets and width; nectary form; inflorescence position and
    flowers per inflorescence; stone (endocarp) size, shape, sutures, sculpture
    and locules; terminal buds; sepal and stamen persistence; stipules; leaf
    texture, verrucae and dots; domatia; lateral vein count; ovary hairs; bract
    persistence and shape; fruit shape, stalk length and spines; petiole
    swelling; embryo shape and endosperm; seeds per locule; height at first
    flowering; altitude and habitat text.'
identifiers: .na
locations: .na
contexts:
  - context_property: commonness qualifier
