questions:
  question1:
    Elaeocarpus cupreus has unisexual flowers. Stamen counts, filament and
    anther lengths are recorded for male flowers (entity measured = male
    flowers); filament and anther lengths given for the staminodes of female
    flowers were dropped so they are not read as fertile stamens. Confirm this
    treatment.
  question2:
    Ovary locule number ("2-locular", "ovary with 2--5 loculi") is recorded as
    flower_structural_carpels_count, assuming one locule per carpel in the
    syncarpous ovary. Confirm.
  question3:
    None of these taxa occurs in Australia, so they will not match APC; check
    how names are aligned (taxon_list.csv) before the build. Names are kept as
    printed, including Elaeocarpus sp. nov. (unnamed).
  question4:
    The author is given as M.J.E. Coode; no full given names or ORCID were
    found (ORCID registry searched 2026-10).
  question5:
    Source fix in raw/build_trait_data.R. E. fraseri lamina "14--18.5 x
    (7--)9--12" has no unit; read as cm, as in every other lamina.
  question6:
    Some source terms have no allowed value and are left unmapped (they reach
    excluded_data). Leaf shape compounds (ovate-elliptic, obovate-elliptic,
    obovate-oblong, ovate-panduriform, obovate-panduriform); leaf margin
    subentire and more-or-less entire; leaf phyllotaxis subopposite; leaf base
    decurrent and peltate; leaf apex cuspidate and emarginate; bark granular.
  question7:
    Values copied from the family, genus or species-group descriptions are
    accepted only when the statement is unqualified and every member taxon that
    describes the trait agrees. Statements with "sometimes" are used only when
    they appear in a species treatment, not at genus level (e.g. genus
    "sometimes fragrant").
  question8:
    Figure 4 caption labels the fruits as var. robustus (2A--D) and var.
    megacarpus (3A--D), but the variety headings cite the opposite. The
    illustrated specimens in raw/Coode_2018_vouchers.csv follow the caption.
  question9:
    Two source values fall outside traits.yml ranges and are excluded at build
    -- E. petiolatus bract length minimum 0.5 mm (flower_bract_length minimum
    1 mm) and Sloanea malayana filament length minimum 0 mm ("filaments 0--2
    mm long"). Consider lowering flower_bract_length allowed_values_min.
