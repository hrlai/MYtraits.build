source:
  primary:
    key: Hughes_2013
    bibtype: InBook
    year: 2013
    author: M. Hughes
    title: Memecylaceae
    booktitle: 'Flora of Peninsular Malaysia, Series II: Seed Plants, Volume 4'
    editor: R. Kiew and R. C. K. Chung and L. G. Saw and E. Soepadmo
    series: Malayan Forest Records No. 49
    publisher: Forest Research Institute Malaysia
    place: Kepong, Selangor, Malaysia
    pages: 269--324
contributors:
  data_collectors:
    - last_name: Hughes
      given_name: M.
      ORCID: .na
      affiliation: Royal Botanic Garden Edinburgh and Singapore Botanic Gardens
  dataset_curators: Hao Ran Lai
dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '2013'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description:
    Morphological descriptions, distribution and ecology of Memecylaceae in
    Peninsular Malaysia.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: |
    Treatment pages 269--324 (PDF pages 7--62) were rendered at 220 dpi and
    checked against a corrected transcription. The segmenter reads
    raw/Memecylaceae_transcription.txt, not the PDF text layer. The PDF is
    born-digital (typeset text, no page scans); its text layer was used only as
    a draft and navigation aid. Traits were scored only from directly stated,
    image-verified description clauses. Ecology, Distribution, Uses, Taxonomy,
    Notes and Conservation status were reviewed and retained as unmapped source
    clauses when no configured trait applied. Keys, maps, figures and captions
    were excluded as trait evidence.
  original_file:
    Memecylaceae.pdf (Hughes 2013, FPM Series II vol. 4, pp. 269--324)
  notes: |
    The PDF is born-digital: its text layer is the publication's typeset text,
    not OCR of page scans. The transcription was made before this was known, so
    every treatment page from printed pp. 269--324 was checked against a
    rendered image, including accepted headings, descriptions, later sections
    and type or figure vouchers. Repairs of typos in the published text are
    recorded in raw/source_fixes.csv. The dataset
    remains provisional, not release-ready: a curator must decide whether fruit
    diameter should also be represented as fruit length for globose berries, and
    whether parenthetical measurement extremes require a different data model.
    Nomenclatural type text and figure specimens are in
    raw/Hughes_2013_vouchers.csv.
