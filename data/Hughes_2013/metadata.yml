questions:
  question1:
    'For fruit diameter, raw rows score fruit_width. Confirm whether globose
    berries should also have fruit_length scored from the same source dimension.'
  question2:
    'Parenthetical measurement extremes remain in verbatim raw text but are not
    scored as separate extreme-range rows. Confirm whether a different
    representation is required.'
