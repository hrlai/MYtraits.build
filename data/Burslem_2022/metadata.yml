traits:
- var_in: RL:SL
  unit_in: mm{root}/mm{shoot}
  trait_name: root_shoot_ratio
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: For each seedling, the length of the longest root and shoot length were
    measured using a ruler and shoot diameter was measured just below the first branch
    using precision callipers.
- var_in: LMF
  unit_in: g/g
  trait_name: leaf_mass_fraction
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: LMF and RMF were calculated by dividing dry leaf and dry root mass by total
    dry mass, respectively. dried to constant weight in an oven at 50C before being
    weighed
- var_in: RMF
  unit_in: g/g
  trait_name: root_mass_fraction
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: LMF and RMF were calculated by dividing dry leaf and dry root mass by total
    dry mass, respectively. dried to constant weight in an oven at 50C before being
    weighed
- var_in: LMA
  unit_in: g/m2
  trait_name: leaf_mass_per_area
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Leaves were scanned using a flatbed scanner and the area was calculated
    using ImageJ software. Leaves were subsequently dried in an oven at 50C for 48
    hours before being weighed. LMA was calculated by dividing dry leaf mass by leaf
    area.
- var_in: Leaf.Thickness
  unit_in: mm
  trait_name: leaf_thickness
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: 3
  methods: Leaf thickness was measured at three locations on three leaves (or all
    leaves if fewer than three available) using digital callipers and avoiding any
    major veins. A mean of means was subsequently calculated.
- var_in: leaf_work_to_punch
  unit_in: N/mm
  trait_name: leaf_work_to_punch
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: 3
  methods: LFP was measured at three points on the leaf using a Chantillon DFXII Digital
    Force Gauge with a 1 mm2 flat head rod (AMETEK Sensors, New York, USA) and the
    mean was calculated.
- var_in: LA:SA
  unit_in: cm2/mm2
  trait_name: .na
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Total leaf area was calculated as described above. Shoot area was calculated
    by measuring the diameter of the shoot immediately below the leaves assuming a
    perfect circle. LA:SA was calculated by dividing leaf area by shoot area.
- var_in: SMRL
  unit_in: mm/g
  trait_name: root_specific_root_length
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: SMRL was calculated by dividing the length of the longest root by dry root
    mass
