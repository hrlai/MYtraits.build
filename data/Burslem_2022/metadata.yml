dataset:
  data_is_long_format: no
  custom_R_code: .na
  collection_date: Date
  taxon_name: Species
  location_name: Seedling.Plot
  individual_id: uid
  description: This dataset includes values of 15 traits (total dry mass; root length
    to shoot length ratio; leaf mass fraction; root mass fraction; shoot mass fraction;
    leaf thickness; leaf force to punch; leaf area to shoot area ratio; leaf concentrations
    of N, P, K, Ca and Mg; leaf NP concentration ratio; specific maximum root length)
    measured in February 2020 on 394 seedlings of 15 woody plant species growing in
    logged in the Ulu Segama Forest Reserve or unlogged forest in the Danum Valley
    Conservation Area, Malaysia. The purpose of this data collection was to determine
    whether the expression of plant functional traits differed between tree seedlings
    recruited into logged and unlogged forests. This information is important for
    understanding the drivers of variation in seedling growth and survival in response
    to logging disturbance, and to uncover the mechanisms giving rise to differentiation
    in tree seedling composition in response to logging.
  basis_of_record: field
  life_stage: seedling
  sampling_strategy: Trait data were collected by direct sampling of seedlings adjacent
    to 75, 1 m2 seedling plots (46 in unlogged primary forest; 26 in logged forest).
    The length of the longest root and shoot length were measured using a ruler and
    shoot diameter was measured just below the first branch using precision callipers.
    Shoot diameter was converted into shoot cross-sectional area based on the assumption
    that all shoots were circular. To calculate leaf area, all leaves were scanned
    using a flatbed scanner (CanoScan LiDE 120, Canon Inc., Tokyo, Japan) and analysed
    using ImageJ software in the R package LeafArea (Katabuchi, 2015). Leaf thickness
    was measured on three leaves, where available, using precision callipers avoiding
    any major veins and a mean was calculated. Leaf force to punch was measured at
    three points on the leaf using a Chantillon DFXII Digital Force Gauge with a 1
    mm2 flat head rod (AMETEK Sensors, New York, USA) and the mean was calculated.
    Leaves, shoots and roots were air-dried before being transferred to the Forest
    Research Centre, Sepilok, where they were dried to constant weight in an oven
    at 50 degC before being weighed. Leaf mass fraction and root mass fraction were
    calculated by dividing dry leaf and dry root mass by total dry mass, respectively.
    Leaf mass area was calculated by dividing dry leaf mass by leaf area. Leaf area
    to shoot area ratio was calculated by dividing leaf area by the cross-sectional
    area of the shoot, root length to shoot length ratio by dividing root length by
    shoot length and specific maximum root length by dividing maximum root length
    by dry root mass.
  original_file: raw/danum_valley_seedling_traits.csv
  notes: The leaf force to punch was provided in unit N, so HR Lai divided it by the
    punch rod diameter to obtain N/mm
