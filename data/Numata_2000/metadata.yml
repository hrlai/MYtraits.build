      before leaf dry weight was measured. The dried leaves were powdered for
      measurements of the total phenol and nitrogen contents. The powdered
      samples from 9 - 12 leaves were mixed to a single lot to obtain
      appropriate amounts of samples for chemical analyses. Extraction and
