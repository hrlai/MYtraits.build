dataset:
  data_is_long_format: no
  custom_R_code: .na
  collection_date: 09-1996
  taxon_name: species
  location_name: unknown
  description:
    We examined the relationships between leaf damage caused by insects and
    pathogens and three leaf traits (leaf toughness, total phenol contents, and
    nitrogen contents) of five dipterocarp species in a lowland rain forest in
    peninsular Malaysia. The measurements were made on all leaves of 9-month-old
    dipterocarp seedlings that emerged at mast fruiting in September 1996.
  basis_of_record: field
  life_stage: seedling
  sampling_strategy:
    Ten seedlings of each species were sampled randomly in the forest near the
    2-ha plot under canopy.
  original_file: unknown
  notes: HR Lai extracted data directly from Table 2 of the original paper.
