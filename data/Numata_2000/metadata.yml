traits:
  - var_in: toughness
    unit_in: N/mm
    trait_name: leaf_work_to_punch
    entity_type: population
    value_type: mean
    basis_of_value: measurement
    replicates: 20
    methods:
      Leaf toughness was measured for fresh leaves by using a digital force
      gauge (FGC-O.5 Shimpo, Japan), which indicates the force (in newtons)
      necessary to punch a rod 0.5 mm in diameter through the leaf (Sands &
      Brancatini, 1991). Twenty leaves of each species were perforated three
      times, and the mean of the three measurements was used for statistical
      analyses
  - var_in: toughness_sd
    unit_in: N/mm
    trait_name: leaf_work_to_punch
    entity_type: population
    value_type: standard_deviation
    basis_of_value: measurement
    replicates: 20
    methods:
      Leaf toughness was measured for fresh leaves by using a digital force
      gauge (FGC-O.5 Shimpo, Japan), which indicates the force (in newtons)
      necessary to punch a rod 0.5 mm in diameter through the leaf (Sands &
      Brancatini, 1991). Twenty leaves of each species were perforated three
      times, and the mean of the three measurements was used for statistical
      analyses
  - var_in: phenol
    unit_in: mg/g
    trait_name: leaf_phenol_per_dry_mass
    entity_type: population
    value_type: mean
    basis_of_value: measurement
    replicates: 3
    methods:
      The sampled seedlings were dried at 80C for 3 days in an electric oven
      before leaf dry weight was measured. The dried leaves were powdered for
      measurements of the total phenol and nitrogen contents. The powdered
      samples from 9 - 12 leaves were mixed to a single lot to obtain
      appropriate amounts of samples for chemical analyses. Extraction and
      centrifugation were repeated four times, and all extracts were combined
      for each leaf sample. Total phenol contents in the extracts were measured
      by Folin-Denis assay (Waterman and Mole, 1994). Nitrogen and carbon
      contents were determined by using a C/N Analyzer (Sumigraph NC-90,
      Sumitomo Chemical Industries, Japan). These procedures were repeated three
      times
  - var_in: phenol_sd
    unit_in: mg/g
    trait_name: leaf_phenol_per_dry_mass
    entity_type: population
    value_type: standard_deviation
    basis_of_value: measurement
    replicates: 3
    methods:
