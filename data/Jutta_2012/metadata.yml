questions:
  question1: |
    Volume. The issue and assets/myflora_metadata.csv give FPM vol. 2, but
    the title page (pdf 4) reads "Volume 3" and its contents list
    Cycadaceae (M. Jutta) at p. 149, with ISBN 978-967-5221-73-6. This
    dataset cites vol. 3. Confirm, and correct the volume (2 -> 3) in
    assets/myflora_metadata.csv.
  question2: |
    Pinnae as leaflets. Cycas pinnae are recorded under leaflet_length and
    leaflet_width, and their shape, margin, margin posture and apex under
    leaf_shape, leaf_margin, leaf_margin_posture and leaf_apex_shape with
    entity_measured = pinnae (Adema_1996 and Kochummen_1995 precedent for
    angiosperm leaflets; about 50 rows). Confirm this suits a gymnosperm
    pinnately compound leaf.
  question3: |
    Pinna counts. Species give pinnae per leaf as pairs ("pinnae 25--90
    pairs", "to 165 pairs"; 4 taxa); these are unmapped. The genus gives
    individual pinnae ("pinnae 30 to more than 150"), scored as
    leaflet_count minimum 30 (upper bound open, not scored). Decide whether
    pair counts should be doubled into leaflet_count, stored as pairs as in
    Nor-Ezzawanis_2010 (entity_measured = pinna pairs), or stay unmapped.
  question4: |
    Probable source typo. C. clivicola subsp. clivicola pinnae are printed
    "to 27 x 12 mm" (p. 156), but its leaves are to 200 cm, the genus gives
    pinnae to 50 x 2.5 cm, and the other species have pinnae 220--500 mm
    long. 27 cm (270 mm) is likely intended. The size is not scored.
    Confirm a source fix (27 mm -> 27 cm) or leave unscored.
  question5: |
    Reproductive structures without traits. Male cones (position, shape,
    length, diameter, stalk, colour), microsporophylls, megasporophylls
    (closed- versus open-type female 'cones', size, lamina, spines) and
    ovules per megasporophyll are unmapped for all taxa (about 20 rows).
    Lim_2010 also left pollen cones unmapped. Decide whether candidate
    traits (pollen cone length and diameter, megasporophyll arrangement,
    ovule number) should be added to traits.yml.
  question6: |
    Naked seeds. Cycas seeds are recorded under seed traits (seed_length,
    seed_width, seed_height with entity_measured = seed including
    sarcotesta; seed_colour; seed_shape) and the pulpy sarcotesta as
    dispersal_appendage = sarcotesta; no fruit traits are used. Lim_2010
    scored Agathis seed cones as fruit. Confirm seed traits are right for
    Cycas.
  question7: |
    Dioecy in a gymnosperm. sex_type = dioecious (genus "Dioecious",
    copied to 4 taxa) is defined in traits.yml for male and female
    flowers. Confirm it applies to cone-bearing plants.
  question8: |
    Growth form. Genus "shrubby or aborescent, palm-like trees" is scored
    plant_growth_form = palmoid (traits.yml lists trunked cycads under
    palmoid) and copied to 4 taxa; "shrubby or aborescent" is unmapped.
    Confirm.
  question9: |
    Leaf arrangement. Genus "Leaves ... arranged in close whorls, forming a
    tufted terminal crown" is scored leaf_phyllotaxis = whorled at genus
    rank but not copied down, because cycad leaves are usually described as
    spirally arranged in flushes. Decide whether to keep whorled, copy it
    down, or leave it unmapped; the tufted crown is unmapped (candidate
    leaf_arrangement clustered).
  question10: |
    Nitrogen fixation and coralloid roots. Genus Ecology describes a
    "symbiotic association with cyanobacteria (nitrogen-fixing ...) in
    specialised coralloid roots ... providing the plant with nitrates"
    (p. 150). Scored nitrogen_fixing = nitrogen_fixer and root_system_type =
    coralloid_roots, copied to 4 taxa. Confirm that a cyanobacterial (not
    rhizobial) symbiosis belongs in nitrogen_fixing.
  question11: |
    Pollinators. Genus Ecology "Pollination is by weevils (Family
    Curculionidae)" (p. 150) is unhedged and is scored
    pollination_vector_possible = beetle, copied to 4 taxa (rule pending
    Kiew_2015 questions 17--18). It is a genus-wide statement, not an
    observation in Peninsular Malaysia. Confirm vector_possible versus
    vector_known, and whether to copy a genus-wide pollinator to species.
  question12: |
    Water dispersal. Genus Ecology "Seeds are dispersed by animals or, in
    species having seeds with a spongy endotesta, also by water" (p. 150):
