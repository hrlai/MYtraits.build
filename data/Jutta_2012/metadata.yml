source:
  primary:
    key: Jutta_2012
    bibtype: InBook
    year: 2012
    author: M. Jutta
    title: Cycadaceae
    booktitle: 'Flora of Peninsular Malaysia, Series II: Seed Plants, Volume 3'
    editor: R. Kiew and R. C. K. Chung and L. G. Saw and E. Soepadmo
    series: Malayan Forest Records No. 49
    publisher: Forest Research Institute Malaysia
    place: Kepong, Malaysia
    pages: 149--160
    isbn: 978-967-5221-73-6
contributors:
  data_collectors:
    - last_name: Jutta
      given_name: M.
      ORCID: .na
      affiliation: Forest Research Institute Malaysia, Kepong, Malaysia
  dataset_curators: Hao Ran Lai
dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '2012'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description: |
    To describe the morphology, distribution and ecology of the Cycadaceae of
    Peninsular Malaysia, represented by four species of Cycas, as part of the
    Flora of Peninsular Malaysia.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: |
    Trait values were transcribed by hand (raw/build_trait_data.R, with
    flora_hand()) from the born-digital PDF text layer of the treatment,
    clause by clause, from the genus and species descriptions and the
    Ecology, Distribution, Uses, Conservation status, Note and Taxonomy
    paragraphs. flora_layer_flags() found no unmapped glyphs on the treatment
    pages (pdf 7--18 = pp. 149--160); its low-text and page-number flags fall
    only on front matter, figure pages (p. 152, Fig. 1; p. 154, Fig. 2), the
    short last page (p. 160) and the plates (pp. 346--348), so no page images
    were checked. Keys were not used; figure captions were used for vouchers
    only, and the plates carry photographer credits only. Each value keeps the
    clause it came from (trait_value_raw), the source term (trait_value) and
    the page. Several values are listed in text order, and alternatives
    qualified by a commonness word (usually, often, sometimes, occasionally,
    rarely, generally) are recorded on separate rows; the unqualified value
    beside a qualified alternative is recorded as usually. A measured range
    is recorded as minimum and maximum values; a single value is a mean and
    "to X" a maximum. The family has no description ("Monogeneric family."),
    so genus values stated singly and without qualification are applied to
    the member species whose own descriptions are silent
    (trait_scoring_method = inferred_from_genus). Hedged statements (may,
    more-or-less) are not scored.
  original_file:
    Cycadaceae.pdf (Jutta 2012, Flora of Peninsular Malaysia Series II vol.
    3, pp. 149--160)
  notes: |
    data.csv is raw/trait_data.csv (written by raw/build_trait_data.R) with
    three columns added by flora_make_data(): value (the source term for
    categorical traits, mapped with substitutions), trait_scoring_method
    (from rank_scored_from) and source_id. Taxon names are as printed. Cycas
    clivicola is represented in the region by subsp. clivicola only, so its
    description is scored at subspecies rank; the species heading carries
    Distribution and Taxonomy only. Genus values are kept as genus-rank
    records as well as copied to member taxa. Species description and
    Ecology values have population region Peninsular Malaysia; genus values
    have none. Pinnae are the leaflets of the pinnately compound leaf: their
    size is recorded as leaflet_length and leaflet_width, and their shape,
    margin, margin posture and apex under the leaf traits, with entity
    measured = pinnae. Seed size includes the fleshy sarcotesta where the
    text says so (entity measured = seed including sarcotesta). Leaf surface
    colour and reflectivity are recorded per surface (upper surface, lower
    surface). Every clause with no trait in config/traits.yml stays in
    raw/trait_data.csv as an unmapped record (summary in
    raw/unmapped_terms.csv): male cones, microsporophylls, megasporophylls
    and ovules; cataphylls; pinna pair counts, insertion angle, texture,
    midrib and decurrent or tapering base; petiole spines and hairs; rachis
    length; stem diameter where its position is not stated; bulbous stem
    base and annular rings; sarcotesta, sclerotesta and endotesta details;
    habitat, altitude, distribution, conservation status, uses, toxicity
    and taxonomy. No source repairs were made. Type and figure specimens are
    in raw/Jutta_2012_vouchers.csv; raw/taxon_flags.csv lists the taxa.
identifiers: .na
locations: .na
contexts:
  - context_property: commonness qualifier
    category: entity_context
    var_in: commonness_qualifier
  - context_property: population region
    category: entity_context
    var_in: population_region
  - context_property: entity measured
    category: method_context
    var_in: entity_measured
  - context_property: trait scoring method
    category: method_context
    var_in: trait_scoring_method
traits:
  - var_in: bark_colour
    unit_in: .na
    trait_name: bark_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: Bark colour from the species descriptions.
  - var_in: bark_texture
    unit_in: .na
    trait_name: bark_texture
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Bark texture from the genus and species descriptions; texture "with age" is recorded with entity measured = old bark.
  - var_in: dispersal_appendage
    unit_in: .na
    trait_name: dispersal_appendage
    entity_type: species
    value_type: value_type
