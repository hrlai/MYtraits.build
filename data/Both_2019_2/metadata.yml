dataset:
  data_is_long_format: no
  custom_R_code: .na
  collection_date: 2014-05-01/2018-09-01
  taxon_name: species
  location_name: location
  individual_id: uid
  description:
    Carbon and nitrogen concentration of branch wood, analysed with and without
    bark, for tree species in selectively logged forest at SAFE and in
    old-growth forest in Danum Valley and Maliau Basin. Sampled during the BALI
    project traits campaign. Analysed in the laboratory of Dr Norma Salinas,
    Lima, Peru.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: unknown
  original_file: raw/Both_wood_chemistry.xlsx
  notes:
    The original data contain multiple measurements per tree individuals from
    sun and shade branches, and with or without bark removed. HR Lai aggregated
    the data to individual means because this is the lowest hierarchy allowed in
    traits.build
