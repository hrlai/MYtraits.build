traits:
  - var_in: stem_vessel_density
    unit_in: "{count}/um2"
    trait_name: stem_vessel_density
    entity_type: individual
    value_type: mean
    basis_of_value: measurement
    replicates: unknown
    methods: Count of vessels in the respective wedge area from microtome slice
  - var_in: Vessel.diameter.micron
    unit_in: um
    trait_name: stem_vessel_diameter
    entity_type: individual
    value_type: mean
    basis_of_value: measurement
    replicates: unknown
    methods:
      Mean vessel diameter. Vessel diameter is determined as the mean of the
      maximum and minimum (lumen) diameters.
  - var_in: Median.vessel.diameter.micron
    unit_in: um
    trait_name: stem_vessel_diameter
    entity_type: individual
    value_type: median
    basis_of_value: measurement
    replicates: unknown
    methods: The middle value of the vessel diameter data set.
  - var_in: Hydraulically.weighted.diameter.micron
    unit_in: um
    trait_name: stem_vessel_diameter_hydraulic
    entity_type: individual
    value_type: mean
    basis_of_value: measurement
    replicates: unknown
    methods:
      Hydraulically weighted mean diameter. Calculated as (sum diameter^5) /
      (sum diameter^4).
  - var_in: Vessel.area.micron2
    unit_in: um2
    trait_name: .na
    entity_type: individual
    value_type: mean
    basis_of_value: measurement
    replicates: unknown
    methods:
      Mean vessel area. Vessel area is determined by the average cross-sectional
      area of all vessel lumens (excluding vessel walls) in the wedge-shaped
      transect of the branch wood cross-section.
  - var_in: Median.vessel.area.micron2
    unit_in: um2
    trait_name: .na
    entity_type: individual
    value_type: median
    basis_of_value: measurement
    replicates: unknown
    methods:
      Mean vessel area. Vessel area is determined by the average cross-sectional
      area of all vessel lumens (excluding vessel walls) in the wedge-shaped
      transect of the branch wood cross-section.
  - var_in: vessel.lumen.f.wedge
    unit_in: um2/um2
    trait_name: stem_vessel_lumen_fraction
    entity_type: individual
    value_type: median
    basis_of_value: measurement
    replicates: unknown
    methods:
      Vessel lumen fraction. From the vessel areas and transect areas, vessel
      lumen fraction is calculated as the fraction of transect area filled by
      vessel lumens.
substitutions: .na
