taxonomic_updates: .na
exclude_observations: .na
questions:
  question1: |
    Parinari argenteo-sericea (p. 173). The flower sentence reads "Flowers
    with receptacle campanulate, markedly gibbous, densely grey-tomentellous
    on exterior, 2--3 mm long, narrowly ovate, densely grey-tomentose on
    exterior, tomentellous within; petals ...". A "calyx-lobes" label seems
    to be missing before "narrowly ovate", so it is unclear whether "2--3 mm
    long" is the receptacle or the calyx-lobes. All these clauses are kept
    verbatim as unmapped rows (no flower_sepal_length for this species).
    The same description gives the leaves as "9.5--10.5 x 4.5--8.5 cm",
    while the key (p. 157) gives "9.5--20.5 x 4.5--8.5 cm"; leaf_length is
    scored as printed in the description (9.5--10.5 cm, 2 rows). Decide
    whether either is a source typo to repair in raw/source_fixes.csv.
  question2: |
    Stomatal crypts (provisional, Prance_1995 question 2). Parinari leaves
    "with stomatal crypts filled with grey lanate pubescence beneath" are
    scored as leaf_stomatal_position = encrypted (5 rows: genus "usually"
    plus P. costata, P. metallica, P. oblongifolia, P. rigida). "without
    stomatal crypts" (7 taxa) has no level and stays unmapped. The hairs
    filling the crypts also make leaf_hairs_adult_leaves = hairy for those
    four species and P. elmeri ("densely pubescent beneath"). Confirm that
    crypts map to "encrypted" and that hairs in crypts count as a hairy
    lower surface.
  question3: |
    Parinari costata fruit (p. 175): "Fruits ellipsoid, to 3.5 x 4.5 cm"
    gives a width larger than the length, which does not fit an ellipsoid
    fruit; the key (p. 157) gives "Fruits ellipsoid, 3.5--4.5 cm long".
    Scored as printed (fruit_length maximum 3.5 cm, fruit_width maximum 4.5
    cm). Decide whether to repair it as a source typo (for example "3.5--4.5
    cm long") or keep it.
  question4: |
    Pollination and dispersal. The family Ecology paragraph (p. 155) says
    "The flowers are pollinated mainly by insects and in a few cases by
    bats, and the fruits are dispersed by birds, mammals and water"; it
    names no genus or species and describes the family worldwide, so it is
    not scored or copied down. Maranthes corymbosa Ecology (p. 169): "The
    fruit is eaten by many birds which probably disperse the seed" is hedged
    and not scored (dispersers). Should either be scored (for example
    pollination_vector_known and dispersers at family rank, or the hedge
    as an exception)?
  question5: |
    Germination type. Atuna (genus, p. 157) "germination cryptocotylar (with
    hidden cotyledon)" and Maranthes (genus, p. 167) "germination
    phanero-cotylar (with exposed cotyledons)". seedling_germination_location
    has epigeal and hypogeal, which describe cotyledon position, not
    exposure (cryptocotylar seedlings can be epigeal). Both are unmapped.
    Map them to hypogeal / epigeal, or add a cotyledon-exposure trait?
  question6: |
    Fruit wall, bark and receptacle sizes with no trait. Mesocarp and
    endocarp thickness ("mesocarp c. 5 mm thick", "endocarp 7--13 mm
    thick"; 11 species), inner bark thickness (4 species), the outer bark
    of Parinari costata ("Bark smooth to roughish, cracked, grey or brown,
    c. 0.5 mm", no "thick"), and receptacle (hypanthium) length (12
    species) are unmapped. fruit_wall_thickness is the whole pericarp or its
    fleshy part; bark_thickness is the whole bark. Should mesocarp
    thickness of the fleshy drupes go to fruit_wall_thickness (with
    entity_measured = mesocarp), P. costata "c. 0.5 mm" to bark_thickness,
    and should a receptacle or hypanthium length trait be added centrally?
  question7: |
    Subspecies. Atuna racemosa (subsp. racemosa, subsp. excelsa) and
    Parinari costata (subsp. costata, subsp. rubiginosa) are given only in a
    "Key to subspecies" after the species description; the key leads hold
    morphology ("Leaves 10--25 (--35) cm long ... Flowers 10--17 mm long.
    Medium-sized to large tree often with fluted bole") that is not scored
