questions:
  question1: |
    Source fix on p. 379 (Glycosmis superba): "Leaves large, opposite,
    36-foliolate" is read as 3--6-foliolate (en dash missing); 36 leaflets
    is outside the genus range of 1--5(--15). Only leaf_compoundness depends
    on it. Confirm.
  question2: |
    Burkillanthus malaccensis fruits are printed "10--8 x 8--11 cm" (p. 362),
    a reversed range. Fruit length is not scored; fruit width (8--11 cm) is.
    Confirm, or drop the width as well.
  question3: |
    Maclurodendron pubescens sepals are printed "c. 7 mm long" (p. 382),
    against petals c. 2 mm long and flowers 1.5--2 mm wide in bud; the genus
    has minute sepals and the two other species have sepals 0.5--1 mm. The
    value (7 mm) is scored as printed. Keep, drop, or read as 0.7 mm?
  question4: |
    Unifoliolate leaves are scored as leaf_compoundness = compound (one
    articulated leaflet). Their blade size goes to leaf_length / leaf_width
    (entity_measured lamina) when the text says "Leaves ... L x W" or
    "blades" (Citrus, Maclurodendron, Merope, Pleiospermium, Tetractomia,
    and the simple leaves of Lunasia, Monanthocitrus, Severinia), but to
    leaflet_length / leaflet_width when the text says "leaflet" (e.g.
    Acronychia pedunculata, unifoliolate Melicope leaves). Keep this
    wording-based split, or score all unifoliolate blades one way?
  question5: |
    Mapping misfits: "hesperidium" (Citrus) is scored as fruit_type berry;
    white embryo or cotyledons (Citrus) as embryo_colour colourless;
    "scandent" as plant_growth_form climber (Zanthoxylum); birds and
    "fruit- and seed-eating animals" as dispersal_syndrome zoochory. Confirm
    these levels.
  question6: |
    The Glycosmis chlorosperma varieties (bidiensis, chlorosperma, elmeri)
    are printed inside the key to varieties, each with its own short
    description. Following data/Adema_1996, these descriptions are scored at
    variety rank and silent traits are inherited from the species
    description. data/Kochummen_1995 (same volume) kept such key annotations
    unmapped. Which treatment should apply?
  question7: |
    The family Ecology paragraph (p. 352) names dispersal agents by genus
    ("birds (Melicope, Zanthoxylum), wind (Tetractomia), water (Merope), and
    fruit- and seed-eating animals (Citrus, Clausena, Glycosmis, Micromelum,
    Severinia, and most other Aurantioideae)"). These are scored as genus
    rows and copied to every described species of the named genera
    (Merope and Zanthoxylum from their own Ecology paragraphs). The
    "most other Aurantioideae" part is not scored. Confirm.
  question8: |
    In Melicope, Lunasia, Tetractomia and Zanthoxylum the fruit is a group of
    follicles; the follicle size ("follicles 3--5 mm long", "3--6 mm in
    diameter") is scored as fruit_length / fruit_width with entity_measured
    follicle. Confirm, or keep follicle sizes unmapped.
  question9: |
    Two petal lengths are printed with "to" before a range: Murraya
    paniculata "to 15--21 mm long or more" and Micromelum minutum "to 5--8
    mm long". Both are scored as the range (minimum and maximum), not as a
    maximum of the first number. Confirm.
