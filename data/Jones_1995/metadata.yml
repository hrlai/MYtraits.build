    pages: 351--419
    isbn: 983-9592-34-3
contributors:
  data_collectors:
    - last_name: Jones
      given_name: David T.
      ORCID: .na
      affiliation: South Florida Natural Resources Center, Everglades National Park, Homestead, Florida, U.S.A.
  dataset_curators: Hao Ran Lai
dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '1995'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description: |
    Morphological traits and dispersal of the native tree and shrub Rutaceae
    of Sabah and Sarawak (17 genera, 43 species), extracted from the family
    treatment in the Tree Flora of Sabah and Sarawak.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: |
    The PDF (inst/extdata/TFSS/Rutaceae.pdf) is the 2007 electronic edition
    of the volume. Its text pages are vector text with no page image, so the
    text layer is what renders; the figure pages are images. A transcription
    (raw/Rutaceae_transcription.txt, PDF pages 7--75, printed 351--419) was
    drafted from the text layer and edited by hand for headings, line-end
    hyphens, the layout of the in-key Glycosmis chlorosperma variety
    treatments and the figure captions (transcribed from the figure images).
    Pages 351--353 and all figure pages were checked against page images;
    the other text pages were not image-checked, because the rendered page is
    the text layer itself. Repairs of printing slips are in
    raw/source_fixes.csv. The transcription is segmented in
    raw/segment_source.R; raw/build_trait_data.R (after data/Adema_1996)
    splits each family, genus, species and variety description into
    sentences, ';' pieces and ',' clauses, assigns each clause to an organ
    and scores configured traits. Every unscored clause stays in
    raw/trait_data.csv as an unmapped row, as do the Distribution, Ecology,
    Uses and unlabelled distribution paragraphs (one row per sentence). The
    dispersal agents named in the family and genus Ecology paragraphs were
    written by hand (raw/manual_rows.csv). Family and genus values are
    copied down to silent members when every member that scores the trait
    agrees and the higher-rank statement is not one of several alternatives;
    the Glycosmis chlorosperma varieties inherit species values for silent
    traits. A measured range is recorded as minimum and maximum, a single or
    "c." value as a mean and "to X" as a maximum; parenthetical extremes are
    on extreme_range rows. Keys were not used as trait evidence.
  original_file: |
    Rutaceae.pdf (Jones 1995, Tree Flora of Sabah and Sarawak vol. 1,
    pp. 351--419; electronic edition 2007)
  notes: |
    Taxon names are kept as printed. Descriptions in this flora refer to
    Sabah and Sarawak (or Borneo). Seven species are represented by their
    single local variety, which carries the description (Citrus macroptera,
    Clausena excavata, Glycosmis cyanocarpa, G. sapindoides, Lunasia amara,
    Micromelum minutum, Murraya paniculata). The three Glycosmis
    chlorosperma varieties are treated inside the key to varieties; their
    descriptions are scored at variety rank. The scandent genera Toddalia,
    Luvunga and Paramignya, the scandent Zanthoxylum scandens and
    Z. nitidum, and the cultivated species (eight Citrus, Clausena lansium,
    Glycosmis parviflora, Murraya koenigii, M. exotica) are annotated only
    in keys and are not scored; they are listed in raw/taxon_flags.csv. The
    author notes that the occurrence of Melicope glabra in Sabah needs
    confirmation; it is scored as treated. Flowering and fruiting months are
    not given in this treatment. The clause-to-trait mapping is a scripted
    parse; mapped rows were spot-checked taxon by taxon but not reviewed
    clause by clause. Unmapped description clauses are summarised in
    raw/unmapped_terms.csv (petiolules, venation, indumentum of floral
    parts, glands, armature, style and stigma, disc, pulp-vesicles, fruit
    and seed shape, altitude, habitat and distribution). Type and figure
    specimens are in raw/Jones_1995_vouchers.csv. traits.build could not be
    installed in the extraction session, so dataset_test() and
    dataset_process() have not been run on this dataset.
identifiers: .na
locations: .na
contexts:
