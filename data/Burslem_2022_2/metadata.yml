dataset:
  data_is_long_format: no
  custom_R_code: .na
  collection_date: Date
  taxon_name: Species
  location_name: Seedling.Plot
  individual_id: uid
  description:
    This dataset includes values of 15 traits (total dry mass; root length to
    shoot length ratio; leaf mass fraction; root mass fraction; shoot mass
    fraction; leaf thickness; leaf force to punch; leaf area to shoot area
    ratio; leaf concentrations of N, P, K, Ca and Mg; leaf NP concentration
    ratio; specific maximum root length) measured in February 2020 on 394
    seedlings of 15 woody plant species growing in logged in the Ulu Segama
    Forest Reserve or unlogged forest in the Danum Valley Conservation Area,
    Malaysia. The purpose of this data collection was to determine whether the
    expression of plant functional traits differed between tree seedlings
    recruited into logged and unlogged forests. This information is important
    for understanding the drivers of variation in seedling growth and survival
    in response to logging disturbance, and to uncover the mechanisms giving
    rise to differentiation in tree seedling composition in response to logging.
  basis_of_record: field
  life_stage: seedling
  sampling_strategy:
    Trait data were collected by direct sampling of seedlings adjacent to 75, 1
    m2 seedling plots (46 in unlogged primary forest; 26 in logged forest). The
    leaves of the sampled seedlings were combined with additional sample
    material from the same plot before being analysed for foliar nutrient
    concentrations at the Forest Research Centre, Sepilok. Leaves were ground
    using a SM2000 Heavy-duty Cutting Mill (Retsch, Haan, Germany) to pass
    through a 100-mesh (212 micron) sieve. The ground material was digested
    using a hydrogen peroxide-sulfuric acid digestion (Allen, 1989). Nleaf and
    Pleaf were measured colorimetrically using an Astoria-Pacific Flow Analyzer
    (Astoria-Pacific, OR, USA). Caleaf, Kleaf and Mgleaf were measured
    spectrometrically using a SpectroArcos FHX22 (Spectro Analytical
    Instruments, Kleve, Germany). A subsample of the leaves was dried at 105
    degC to constant weight to calculate the percentage moisture content and to
    correct laboratory analyses to an oven dry basis. N:P was calculated by
    dividing Nleaf by Pleaf.
  original_file: Burslem_2022/raw/danum_valley_seedling_traits.csv
  notes:
    The original data duplicated population mean nutrient values to individual
    seedlings, HR Lai aggregated them back to population mean to avoid
    duplication. The original data and scripts are stored in Burslem_2022 and
    not copied to this Burslem_2022_2 folder
