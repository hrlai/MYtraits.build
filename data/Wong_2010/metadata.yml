    pages: 49--86
    isbn: 978-967-5221-24-8
    doi: 10.26525/FPM11001
contributors:
  data_collectors:
    - last_name: Wong
      given_name: K. M.
      ORCID: .na
      affiliation: University of Malaya, Kuala Lumpur, Malaysia
  dataset_curators: Hao Ran Lai
dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '2010'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description:
    Selaginellaceae (Selaginella, 29 species and six varieties) of Peninsular
    Malaysia.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: |
    Born-digital PDF (assets/myflora_metadata.csv); rows come from the PDF text
    layer (pdf pages 7--44, printed 49--86) read with flora_read_pdf_lines()
    and segmented by raw/segment_source.R. No page was image-checked:
    flora_layer_flags() flagged only the front matter, the plates (printed
    217--219, photographs) and the full-page Figures 1 and 2 (pdf 17 and 22),
    whose captions are in the layer and supply figure vouchers only. No bad
    glyphs. Species descriptions are one paragraph of organ clauses; each
    clause was split at commas outside parentheses and scored by
    raw/build_trait_data.R with the shared dictionary seed, or kept verbatim
    as an unmapped row. Genus values without a qualifier (herbaceous, simple
    scale-like leaves, lycophyte) are copied down to every taxon. Ranges are
    minimum and maximum; 'to' values are maxima. Population region is
    Peninsular Malaysia (FPM guide).
  original_file:
    Selaginellaceae.pdf (Wong 2010, Flora of Peninsular Malaysia Series I
    vol. 1, pp. 49--86)
  notes: |
    Mapped and unmapped rows share raw/trait_data.csv; raw/unmapped_terms.csv
    summarises the unmapped rows. Unmapped characters with no trait in
    config/traits.yml: rhizophores, branch-system construction
    (pseudopinnate or flabellate), strobilus symmetry and sporophyll
    dimorphism, arista length relative to the lamina, ciliate and ciliolate
    leaf margins, exauriculate leaves, leaf posture (patent, appressed) and
    overlap with branches, megaspore and microspore form and size, plant
    height stated only as "several centimetres high at most", and dried-leaf
    colour (coppery tint). Distribution, Ecology (altitude, habitat,
    limestone, rheophyte), Conservation status, Uses, Taxonomy, Notes and the
    genus Chromosome numbers (base number x = 9, 10) are kept as unmapped
    sentences. Hedged statements ("apparently spiral in arrangement",
    "probably present throughout") are not scored. Selaginella intermedia,
    S. roxburghii and S. selangorensis have no species description; their
    varieties carry the descriptions, and the species get only genus
    copy-down rows. Var. strigosa and var. ciliata are described only by
    their differences (question 7). S. tamariscina (not native) and
    S. siamensis (misapplied name) are listed in raw/taxon_flags.csv and not
    scored. Types, types of synonyms and figure specimens are in
    raw/Wong_2010_vouchers.csv.
identifiers: .na
locations: .na
contexts:
  - context_property: commonness qualifier
    category: entity_context
    var_in: commonness_qualifier
  - context_property: population region
    category: entity_context
    var_in: population_region
  - context_property: entity measured
    category: method_context
    var_in: entity_measured
  - context_property: trait scoring method
    category: method_context
    var_in: trait_scoring_method
traits:
  - var_in: leaf_apex_shape
    unit_in: .na
    trait_name: leaf_apex_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Apex of median leaves (and blunt apex of lateral leaves) from species descriptions; entity_measured names the leaf kind. Aristate apices have no level and are unmapped.'
  - var_in: leaf_base_shape
    unit_in: .na
    trait_name: leaf_base_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Base of lateral, median, axillary and basal stem leaves; an auricle or auriculate fold scored as auriculate. Exauriculate, subcordate and subauriculate not scored.'
  - var_in: leaf_compoundness
    unit_in: .na
    trait_name: leaf_compoundness
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Genus description ''Leaves ... simple (undivided)'', copied down to every taxon.'
  - var_in: leaf_hairs_adult_leaves
    unit_in: .na
    trait_name: leaf_hairs_adult_leaves
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Hairs on the leaf surfaces of lateral, median or basal stem leaves (entity_measured). Ciliate margins are unmapped.'
  - var_in: leaf_heterogeneity
    unit_in: .na
    trait_name: leaf_heterogeneity
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Dimorphic leaves (larger lateral and smaller median leaves; heterophylly) scored as anisophyllous (question 3).'
  - var_in: leaf_margin
    unit_in: .na
    trait_name: leaf_margin
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Margins of lateral and median leaves; denticulate and dentate scored as toothed_dentate. Subentire is not scored; ciliate and ciliolate margins have no level and are unmapped.'
  - var_in: leaf_shape
    unit_in: .na
    trait_name: leaf_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Shape of each leaf kind, named in entity_measured: stem lateral and median leaves (main stem), lateral, median and axillary leaves of the branch system, basal stem leaves of erect species. Hyphenated shapes score both levels.'
  - var_in: leaf_surface_colour
    unit_in: .na
    trait_name: leaf_surface_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Colour of the leafy shoots, of the lower side of the leafy branch systems, or of the lower surface of lateral leaves (entity_measured; question 5).'
  - var_in: leaf_type
    unit_in: .na
    trait_name: leaf_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Genus description ''Leaves scale-like, microphyllous'', copied down to every taxon (question 4).'
  - var_in: leaf_width
    unit_in: unit
    trait_name: leaf_width
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Width (''across'') of the near-orbicular axillary leaves along the main stem (question 6).'
  - var_in: plant_climbing_mechanism
    unit_in: .na
    trait_name: plant_climbing_mechanism
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Species description: scrambling over other vegetation.'
  - var_in: plant_growth_form
    unit_in: .na
    trait_name: plant_growth_form
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Lycophyte, from the placement of the family in the Lycopsida (genus Taxonomy paragraph), copied down to every taxon (question 1).'
  - var_in: plant_growth_substrate
    unit_in: .na
    trait_name: plant_growth_substrate
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Genus description, worldwide scope; not copied down.'
  - var_in: plant_height
    unit_in: unit
    trait_name: plant_height
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: 'Plant height from species descriptions. ''to a--b'' is scored as minimum a and maximum b; ''to'', ''hardly'' and ''below'' a single value as a maximum (question 10).'
  - var_in: stem_branching_form
    unit_in: .na
    trait_name: stem_branching_form
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Plant body much branched or sparsely branched, from species descriptions.'
  - var_in: stem_growth_habit
    unit_in: .na
    trait_name: stem_growth_habit
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Habit from species descriptions: creeping, stiffly erect (erect), suberect (decumbent, question 2), stoloniferous connections, compact tufts (tufted); climbing from the genus Ecology paragraph for S. willdenowii.'
  - var_in: stem_hairs
    unit_in: .na
    trait_name: stem_hairs
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Hairs on the stems.'
  - var_in: woodiness
    unit_in: .na
    trait_name: woodiness
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: 'Genus description ''Plants herbaceous ... with only primary growth'', copied down to every taxon.'
