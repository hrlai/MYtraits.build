questions:
  question1:
    'Growth form: the description never says lycophyte, but the genus Taxonomy
    paragraph places the family in the Lycopsida ("Among the extant Lycopsida,
    the Selaginellaceae are ...", p. 51). plant_growth_form = lycophyte is
    scored at genus rank and copied down to all 35 taxa (36 rows). Confirm that
    a taxonomic placement may supply plant_growth_form.'
  question2:
    'Suberect: 16 taxa are "suberect", which the key defines as "arched
    ascending" (couplet 2; S. stipulata and S. wallichii "shoots
    arched-ascending"). stem_growth_habit has no suberect level; it is mapped
    to decumbent (synonym ascending). Confirm decumbent, or propose a
    suberect level in traits.yml.'
  question3:
    'Heterophylly: lateral and median leaves in four rows ("stem leaves
    dimorphic, distinguishable as larger ... lateral leaves and smaller ...
    median leaves") are scored as leaf_heterogeneity = anisophyllous for all
    30 described taxa, including the erect species whose basal stem leaves
    are "generally monomorphic" below dimorphic branch leaves. Confirm.'
  question4:
    'Leaf type: the genus description calls the microphylls "scale-like"
    (p. 49); leaf_type = scale ("Leaf reduced to a small scale") is copied
    down to all taxa, although the leaves are the photosynthetic organs.
    Confirm scale, or leave leaf_type unscored for Selaginella.'
  question5:
    'Colour ownership and levels: colours of the "living leafy parts" or
    "whole plant" (4 taxa, entity_measured leafy shoots), of the leafy branch
    systems "below" (S. argentea, S. pubescens) and of lateral leaves "below"
    (4 taxa) are scored as leaf_surface_colour with entity_measured.
    leaf_surface_colour has no pink or copper level: "deep pink" is scored as
    red and "coppery" as brown (S. intermedia var. intermedia "dark green to
    purple-green, deep pink or even coppery", p. 63; S. morganii "pale greyish
    green to slightly coppery", p. 69); "or even" is not read as a commonness
    word. Confirm these as leaf colours and the pink and copper mappings, or
    propose new levels.'
  question6:
    'Axillary leaves "3--4 mm across" (S. padangensis) and "to about 2 mm
    across" (S. delicatula), both near-orbicular leaves on the main stem, are
    scored as leaf_width with entity_measured axillary leaves (main stem).
    Confirm "across" as width.'
  question7:
    'Differential varieties: S. roxburghii var. strigosa ("Differs from the
    typical variety in having the upper surface of lateral leaves
    short-hairy") and S. selangorensis var. ciliata ("Its stoloniferous habit
    with basally ciliate lateral leaves") are scored only for the stated
    difference. Decide whether they should inherit the other values of the
    typical variety (no rank_scored_from level exists for a sibling
    variety).'
  question8:
    'Leaf kinds: Selaginella has lateral, median and axillary leaves on the
    branch systems, lateral and median leaves on the main stem, and basal
    stem leaves in erect species. All are scored into the same leaf traits
    and told apart only by entity_measured (223 leaf rows). Confirm
    this vocabulary, or say which leaf kind should represent "the leaf".'
  question9:
    'Ciliate margins: "ciliate", "ciliolate" and "long-ciliate" leaf margins
    (15 taxa, often the key character) have no leaf_margin level and
    are unmapped. Decide whether to add a ciliate level (central traits.yml
    change).'
  question10:
    'Height wording: "to 20--35 cm high" (9 taxa) is scored as minimum 20 and
    maximum 35; "hardly 10 cm tall" and "often below 25 cm tall" as maxima;
    "to about 40 cm" as a maximum noted approximate. The shared parser
    previously turned "to a--b" into a maximum of a only (Hughes_2013 has 5
    such rows). Confirm the range reading.'
