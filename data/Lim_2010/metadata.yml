    unit_in: .na
    trait_name: bark_texture
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods:
      Scored from the genus description, which describes young bark (smooth) and
      mature bark (dippled after scales flake off) separately (entity measured).
  - var_in: dispersal_appendage
    unit_in: .na
    trait_name: dispersal_appendage
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: Scored from the seed description in the species descriptions.
  - var_in: dispersal_syndrome
    unit_in: .na
    trait_name: dispersal_syndrome
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods:
      "Scored from the family Ecology text: 'All species are wind-pollinated and
      their winged seeds wind-dispersed.'"
  - var_in: dispersers
    unit_in: .na
    trait_name: dispersers
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
