source:
  primary:
    key: Lim_2010
    bibtype: InBook
    year: 2010
    author: C. L. Lim
    title: Araucariaceae
    booktitle: 'Flora of Peninsular Malaysia, Series II: Seed Plants, Volume 1'
    editor:
      R. Kiew and R. C. K. Chung and L. G. Saw and E. Soepadmo and P. C. Boyce
    series: Malayan Forest Records No. 49
    publisher: Forest Research Institute Malaysia
    place: Kepong, Selangor, Malaysia
    pages: 61--66
    isbn: 978-967-5221-32-3
contributors:
  data_collectors:
    - last_name: Lim
      given_name: C. L.
      ORCID: .na.character
      affiliation:
        Forest Research Institute Malaysia, Kepong, Selangor, Malaysia
  dataset_curators: Hao Ran Lai
dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '2010'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description:
    To describe the morphology, distribution and ecology of the Araucariaceae of
    Peninsular Malaysia, represented by two species of Agathis, as part of the
    Flora of Peninsular Malaysia.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy:
    The treatment was transcribed from page images of the PDF
    (raw/Araucariaceae_transcription.txt); the PDF's OCR text layer was not
    used. Trait values were extracted with a script (raw/build_trait_data.R)
    from the transcription, clause by clause, from the family, genus and species
    descriptions; keys, maps and figures were not used. Values from the family
    Ecology text were entered by hand (raw/manual_rows.csv). Each value keeps
    the clause it came from (trait_value_raw), the source term (trait_value) and
    the page. Alternatives qualified by a commonness word (usually, sometimes,
    occasionally, rarely) are recorded on separate rows; parenthetical extremes
    of a measured range are recorded on commonness qualifier = extreme_range
    rows. A measured range is recorded as minimum and maximum values, a single
    or "c." value as a mean and "to X" as a maximum. Categorical values stated
    singly and without qualification in the family or genus description are
    applied to both species where their own descriptions are silent
    (trait_scoring_method = inferred_from_family / inferred_from_genus); where
    both give a value, the genus value is used.
  original_file:
    Araucariaceae.pdf (Lim 2010, Flora of Peninsular Malaysia Series II vol. 1,
    pp. 61--66)
  notes: |
    data.csv is raw/trait_data.csv (written by raw/build_trait_data.R) with
    three columns added by flora_make_data(): value (the build column;
    the source term for categorical traits, mapped with substitutions),
    trait_scoring_method (from rank_scored_from) and source_id. Taxon names are
    as printed. Seed cones are treated as fruit (fruit_type strobilus; seed cone
    length and diameter as fruit_length and fruit_width, entity measured = seed
    cone). The Borneo height (55 m) and diameter (1 m) of A. borneensis
    cited from Yii (1995) in the Ecology text are not scored: the TFSS
    treatment is a separate source. Type and figure specimens are listed in
    raw/Lim_2010_vouchers.csv; per-taxon flags in raw/taxon_flags.csv. Characters with no trait in traits.yml are
    listed in raw/unmapped_terms.csv; verbatim unmapped clauses are rows in raw/trait_data.csv: pollen
    cones, sporophylls, cone scales and foliose bracts; seed cone shape and
    position; seed wing size and texture; juvenile leaves; inner bark, resin,
    sapwood and heartwood; resin canals; leaf texture; venation; terminal buds;
    bole shape; absence of buttresses and midrib; altitude and habitat text.'
identifiers: .na
locations: .na
contexts:
  - context_property: commonness qualifier
    category: entity_context
    var_in: commonness_qualifier
  - context_property: entity measured
    category: method_context
    var_in: entity_measured
  - context_property: trait scoring method
    category: method_context
    var_in: trait_scoring_method
traits:
