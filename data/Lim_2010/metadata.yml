substitutions:
  - trait_name: bark_texture
    find: 'smooth lenticellate'
    replace: 'smooth'
  - trait_name: dispersal_appendage
    find: 'wing'
    replace: 'wings'
  - trait_name: dispersal_syndrome
    find: 'wind-dispersed'
    replace: 'anemochory'
  - trait_name: dispersers
    find: 'wind-dispersed'
    replace: 'wind'
  - trait_name: fruit_colour
    find: 'dark_reddish_brown black'
    replace: 'brown black'
  - trait_name: fruit_type
    find: 'seed_cones'
    replace: 'strobilus'
  - trait_name: leaf_apex_shape
    find: 'attenuate acute'
    replace: 'acute'
  - trait_name: leaf_base_shape
    find: 'attenuate decurrent'
    replace: 'attenuate'
  - trait_name: leaf_margin_posture
    find: 'recurved'
    replace: 'revolute'
  - trait_name: leaf_shape
    find: 'narrowly_elliptic broadly_elliptic'
    replace: 'narrowly_elliptical widely_elliptical'
  - trait_name: leaf_shape
    find: 'elliptic oblong obovate'
    replace: 'elliptical oblong obovate'
  - trait_name: leaf_surface_colour
    find: 'greener'
    replace: 'green'
  - trait_name: leaf_surface_colour
    find: 'distinctly yellow'
    replace: 'yellow'
  - trait_name: leaf_surface_reflectivity
    find: 'glossy'
    replace: 'shiny'
  - trait_name: leaf_type
    find: 'broad'
    replace: 'broadleaf'
  - trait_name: pollination_syndrome
    find: 'wind-pollinated'
    replace: 'wind'
  - trait_name: root_system_type
    find: 'superficial'
    replace: 'shallow_rooted'
  - trait_name: seed_shape
    find: 'flattened_ovoid'
    replace: 'ovoid_flattened'
taxonomic_updates: .na
exclude_observations: .na
questions:
  question3:
    Seed cones are mapped to fruit traits (fruit_type strobilus, fruit_length,
    fruit_width, fruit_colour); pollen cones and sporophylls are unmapped.
    Confirm conifer cones should use the fruit traits.
  question4:
    Some source terms have no allowed value and are left unmapped (they reach
    excluded_data) -- leaf phyllotaxis subopposite, petiole shape flattened,
    seed shape oblique obovate. Leaf base decurrent and leaf apex attenuate are
    dropped from compound values (attenuate decurrent -> attenuate; attenuate
    acute -> acute). Consider adding decurrent (leaf_base_shape) and attenuate
    (leaf_apex_shape).
  question5:
    The family description "peduncle stout, disintegrating when seeds mature" is
    not scored as fruit_dehiscence (the earlier Lim_2010 version did);
    grammatically it may refer to the peduncle. Confirm.
  question6:
    The text was transcribed from page images, not the OCR layer. Every number
    in the transcription was compared with the OCR layer per page; the only
    differences were page numbers, running heads and OCR misreads in citations.
    Source slips are kept verbatim and fixed in norm() (megaporophylls; missing
    full stop before "Inner bark" in A. flavescens; A. flavescens wing size
    "longer than broad; c. 17 x 13 mm" read as the wing, not the seed).
