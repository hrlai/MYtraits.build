questions:
  question1:
    Neither species (Agathis borneensis, A. flavescens) occurs in Australia, so
    neither will match APC and the build will drop every record unless the taxa
    are handled outside APC. Confirm whether this dataset belongs in AusTraits.
  question2:
    The author is given only as C. L. Lim (Forest Research Institute Malaysia);
    no full given name or ORCID was found.
  question3:
    Seed cones are mapped to fruit traits (fruit_type strobilus, fruit_length,
    fruit_width, fruit_colour, fruit_dehiscence); pollen cones and sporophylls
    are candidate traits only. Confirm conifer cones should use the fruit
    traits.
  question4:
    fruit_dehiscence is scored from the family description "peduncle stout,
    disintegrating when seeds mature", read as the seed cone breaking up at
    maturity; grammatically it could refer to the peduncle.
  question5:
    leaf_base_shape has no decurrent value; the source term decurrent ("base ...
    decurrent and hardly differentiated from the petiole") is substituted to
    attenuate so the attenuate value is kept. Consider adding decurrent to
    leaf_base_shape. Likewise subopposite (leaf_phyllotaxis) and flattened
    (petiole_shape) have no allowed value and are left unmapped (excluded_data).
  question6:
    The Flora chapter has no Methods text, so sampling_strategy describes the
    transcription rather than quoting the source. The volume introduction may
    describe how descriptions were prepared; supply it if available.
  question7:
    'Agathis flavescens pollen cones: "peduncles short, slender,
    (3.5--)10--15(--28) mm long, c. 3 mm thick, stalks c. 2 mm long" -- it is
    unclear which stalk is c. 2 mm long (recorded as candidate
    pollen_cone_stalk_length).'
