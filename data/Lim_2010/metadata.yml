dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |> dplyr::filter( trait %in% c( "bark_texture", "dispersal_appendage",
    "dispersal_syndrome", "dispersers", "fruit_colour", "fruit_dehiscence",
    "fruit_length", "fruit_type", "fruit_width", "leaf_apex_shape",
    "leaf_base_shape", "leaf_compoundness", "leaf_length", "leaf_margin",
    "leaf_margin_posture", "leaf_phyllotaxis", "leaf_shape",
    "leaf_surface_colour", "leaf_surface_reflectivity", "leaf_type",
    "leaf_width", "parasitic", "petiole_length", "petiole_shape",
    "plant_diameter_breast_height", "plant_growth_form",
    "plant_growth_substrate", "plant_height", "plant_photosynthetic_organ",
    "pollination_syndrome", "root_system_type", "seed_length", "seed_shape",
    "seed_width", "stem_branching_form", "stem_hairs" ) )
    '
  collection_date: '2010'
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value
  source_id: source_id
  description:
    To describe the morphology, distribution and ecology of the Araucariaceae of
    Peninsular Malaysia, represented by two species of Agathis, as part of the
    Flora of Peninsular Malaysia.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy:
    Trait values were transcribed by hand from the family, genus and species
    descriptions and the Ecology text of the Araucariaceae treatment in the
    Flora of Peninsular Malaysia, clause by clause; the key to species was not
    used. Each value is recorded in the source's own words (trait_value_raw, the
    clause it came from; trait_value, the source term) and mapped to AusTraits
    trait values with substitutions. Several values are listed in the order they
    appear in the text, and alternatives qualified by a commonness word
    (usually, sometimes, occasionally, rarely) are recorded on separate rows;
    parenthetical extremes of a measured range are recorded on commonness
    qualifier = rarely rows. A measured range is recorded as minimum and maximum
    values, a single "c." measurement as a mean and "to X" as a maximum.
    Categorical values stated singly and without qualification in the family or
    genus description are applied to both species where their own descriptions
    are silent (trait_scoring_method = inferred_from_family /
    inferred_from_genus). Values that descriptions state only when atypical
    (terrestrial substrate, leaf as photosynthetic organ, not parasitic) are
    recorded on trait_scoring_method = inferred rows when nothing in the text
    suggests otherwise.
  original_file:
    Araucariaceae.pdf (Lim 2010, Flora of Peninsular Malaysia Series II vol. 1,
    pp. 61--66)
  notes:
    'data.csv is raw/trait_data.csv (the hand transcription) with two columns
    added by raw/extra_R_code_Lim_2010.R: trait_scoring_method (from
    rank_scored_from) and source_id (Yii_1995 or Whitmore_1975 for the Bornean
    values the Ecology text cites from those works). Type and figure specimens
    are listed in raw/Lim_2010_vouchers.csv. Seed cones are treated as fruit
    (fruit_type strobilus): seed cone length and diameter are mapped to
    fruit_length and fruit_width, with entity measured = seed cone. Candidate
    traits not yet in traits.yml (unmapped, dropped in custom_R_code):
    bark_lenticels, bole_shape, buttress_roots, common_name,
    conservation_status, distribution_description, elevation, exudate_colour,
    exudate_flow, exudate_texture, fruit_shape, geology_terms,
    habitat_description, habitat_terms, heartwood_colour, inner_bark_colour,
    inner_bark_texture, juvenile_leaf_apex_shape, juvenile_leaf_length,
    juvenile_leaf_shape, juvenile_leaf_texture, juvenile_leaf_width,
    leaf_abaxial_vein_visibility, leaf_adaxial_vein_visibility,
    leaf_discolority, leaf_flushing, leaf_intercostal_vein_visibility,
    leaf_margin_texture, leaf_midrib_presence, leaf_resin_canal_arrangement,
    leaf_size_shape_variability, leaf_surface_colour_dried, leaf_texture,
    leaf_venation, megasporophyll_apex_shape, megasporophyll_apical_appendage,
    megasporophyll_apical_ridge, megasporophyll_arrangement,
    megasporophyll_base_lobing, megasporophyll_base_shape,
    megasporophyll_compression, megasporophyll_length, megasporophyll_shape,
    megasporophyll_width, microsporophyll_apex_shape,
    microsporophyll_arrangement, microsporophyll_base_shape,
    microsporophyll_length, microsporophyll_shape, microsporophyll_width,
    ovule_position, petiole_attachment, petiole_colour_dried, plant_exudate,
    pollen_cone_attachment, pollen_cone_basal_scale_arrangement,
    pollen_cone_basal_scale_attachment, pollen_cone_basal_scale_count_pairs,
    pollen_cone_basal_scale_shape, pollen_cone_basal_scale_width,
    pollen_cone_colour, pollen_cone_colour_dried, pollen_cone_diameter,
    pollen_cone_foliose_bract_count, pollen_cone_foliose_bract_length,
    pollen_cone_foliose_bract_margin_posture, pollen_cone_foliose_bract_width,
    pollen_cone_length, pollen_cone_peduncle_diameter,
    pollen_cone_peduncle_length, pollen_cone_peduncle_shape,
    pollen_cone_position, pollen_cone_reflectivity, pollen_cone_shape,
    pollen_cone_stalk_length, pollen_sac_position, root_shape, sapwood_colour,
    seed_cone_arrangement, seed_cone_basal_scale_length,
    seed_cone_basal_scale_shape, seed_cone_basal_scale_width,
    seed_cone_peduncle_diameter, seed_cone_peduncle_length,
