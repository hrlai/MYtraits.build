exclude_observations: .na
questions:
  question1: |
    Monocarp as the fruit. The Annonaceae fruit is apocarpous: each carpel
    becomes a free monocarp, often stalked ("Monocarps to 6, ellipsoidal to
    globose, to 6 cm long, to 4 cm diameter ...; stipes 3--10 mm long").
    Monocarp size, ripe colour, indumentum, wall thickness and seeds per
    monocarp are scored as fruit_length / fruit_width / fruit_colour /
    fruit_surface_hairs / fruit_wall_thickness / seeds_per_fruit with
    entity_measured = monocarp (about 640 rows), as the fruitlet of a
    syncarp is scored elsewhere (Beentje_2023). The number of monocarps per
    fruit and the monocarp stipe length stay unmapped (candidate traits).
    Confirm the monocarp as the measured fruit.
  question2: |
    Colours of dried specimens. Most descriptions give the herbarium
    colour ("Leaves ... drying grey-brown above", "Monocarps ... drying
    black", "petals ... drying dark brown"). These are not scored as
    leaf, fruit or flower colour; only living colours are ("outer petals
    yellow", "Monocarps green ripening red" -> red). Confirm, or ask for a
    dried-colour trait or context.
  question3: |
    Climbing genera in the key. The eight climbing genera (Uvaria,
    Artabotrys, Desmos, Sphaerocoryne, Friesodielsia, Fissistigma,
    Pyramidanthe, Mitrella; about 68 species in Sabah and Sarawak) have a
    full genus description printed only as an annotation in the key to
    genera (pp. 7--10), with no species treatment. Keys are not trait
    evidence, so nothing is scored for them. Decide whether these genus
    descriptions should be scored at genus rank (e.g. "Woody climbers" ->
    plant_growth_form climber_woody). Pseuduvaria bruneiensis (key
    annotation, p. 171) has nomenclature only and is known only from
    Brunei; it is listed but not scored.
  question4: |
    Outer and inner petals. Annonaceae have two petal whorls described
    separately ("outer petals ovate-lanceolate, c. 18 x 9 mm; inner petals
    ... slightly smaller"). flower_petal_length and flower_colour carry
    entity_measured = outer petals or inner petals (about 270 length rows);
    petals described together have none. Confirm this split.
  question5: |
    Source repairs that change values (raw/source_fixes.csv). Meiogyne
    virgata seeds "c. 15 cm long, c. 10 mm wide" in a monocarp "c. 5 cm
    long" (p. 83) read as 15 mm; Monoon paradoxum monocarp "c. 30 cm long,
    c. 18 mm diameter" (p. 117) read as 30 mm; Xylopia kuchingensis seeds
    "c. 10 cm long" in a monocarp "c. 4 cm long" (p. 196) read as 10 mm.
    Confirm the three repairs.
  question6: |
    Fruiting pedicels. Most species give "Fruiting pedicels 8--18 mm long,
    3--3.5 mm thick" after the flowers (131 taxa); the flowering pedicel is
    scored as pedicel_length, the fruiting pedicel is unmapped. Decide
    whether fruiting pedicels should go to pedicel_length with
    entity_measured = fruiting pedicel.
  question7: |
    Seed dimensions. Seeds are given as "c. 20 mm long, c. 10 mm diameter,
    c. 4 mm thick". Length -> seed_length, diameter (or width, across) ->
    seed_width, thickness -> seed_height (the shortest dimension). Confirm.
  question8: |
    Family flower and leaf statements copied down. "Leaves simple" and
    "Flowers ... regular and actinomorphic" (family description, p. 1) are
    copied to every species silent on them (leaf_compoundness simple, 161
    rows; flower_perianth_symmetry actinomorphic_general, 156 rows). Genus
    "Flowers bisexual" or "unisexual" is copied to the genus's species.
    Confirm these copies.
