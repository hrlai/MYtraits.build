dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: '2014'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  source_id: source_id
  description: |
    Morphological traits of the tree and shrub Annonaceae of Sabah and
    Sarawak (27 genera, 160 species), extracted from the family treatment in
    the Tree Flora of Sabah and Sarawak. The eight climbing genera are
    annotated only in the key to genera and are not included.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: |
    The PDF (inst/extdata/myflora/pdf/TFSS/Annonaceae.pdf, PDF pages 12--211,
    printed 1--200; PDF 212--219 are colour plates) is born-digital. Rows come
    from its text layer (flora_read_pdf_lines()); no routine image check was
    made. flora_layer_flags() found no bad glyphs; it flagged the figure pages
    (low text: an image and its caption) and the front matter, which are not
    treatment text. raw/segment_source.R segments the text; keys, running
    heads and figure captions are dropped. raw/build_trait_data.R splits each
    family, genus and species description into sentences, ';' pieces and ','
    clauses, assigns each clause to an organ and scores configured traits.
    Every unscored clause stays in raw/trait_data.csv as an unmapped row, as
    do the Distribution, Ecology, Uses, Notes and vernacular-name paragraphs
    (one row per sentence). Unqualified single-level family and genus values
    are copied to member species silent on the trait when every member that
    states the trait agrees (trait_scoring_method inferred_from_family /
    inferred_from_genus); statements naming a genus, species, 'some', 'most'
    or 'many' are not copied, and flower values are not copied to species
    whose flowers are unknown. Colours of dried specimens ('drying black')
    are not scored. Keys and figure captions are not trait evidence; type
    and figure specimens are in raw/Turner_2014_vouchers.csv.
  original_file: |
    Annonaceae.pdf (Turner et al. 2014, Tree Flora of Sabah and Sarawak vol.
    8, pp. 1--200)
  notes: |
    data.csv is raw/trait_data.csv (written by raw/build_trait_data.R) with
    the columns added by flora_make_data(). Taxon names are as printed. All
    160 accepted species with a heading are segmented and have their own
    description (155 numbered; Cananga odorata, Cyathocalyx magnifructus,
    Marsypopetalum pallidum, Miliusa macropoda and Trivalvaria macrophylla,
    the only species of their genera in Sabah and Sarawak, are unnumbered).
    There are no infraspecific taxa, and no excluded, cultivated or
    incompletely known sections. The eight climbing genera (Uvaria,
    Artabotrys, Desmos, Sphaerocoryne, Friesodielsia, Fissistigma,
    Pyramidanthe, Mitrella; about 68 species, family Distribution) are
    described only by genus annotations in the key to genera (pp. 7--10) and
    are not scored (question 3). Pseuduvaria bruneiensis is annotated in the
    key to Pseuduvaria (p. 171), known only from Brunei, and is not scored.
    All are listed in raw/taxon_flags.csv. Family and genus descriptions are
    kept as family- and genus-rank records as well as copied to member taxa.
    Species description values have population region Sabah and Sarawak
    (TFSS guide); copied values have none. Three source repairs change
    values (raw/source_fixes.csv; question 5). Of 13,349 rows in
    raw/trait_data.csv, 5,097 are mapped (4,499 from the taxa's own
    descriptions, 316 copied from the family, 282 from genera) and 8,252 are
    unmapped: 7,439 description clauses and 813 sentences of Distribution,
    Ecology, Uses, Notes and vernacular names. The most frequent unmapped
    characters are leaf texture (chartaceous, coriaceous) and dried colour;
    lateral vein number, looping and relief; midrib relief; intercostal
    venation; petiole thickness; twig colour and indumentum; sepal, petal,
    pedicel, bract, carpel and monocarp indumentum; monocarp number and
    stipe length; fruiting pedicel size; inner and outer petal shape;
    stamen connective and stigma form; altitude, habitat and distribution
    (summary in raw/unmapped_terms.csv). The family Ecology paragraphs on
    pollination (beetles, pollination chambers, protogyny), mast flowering
    and frugivores report studies of unnamed species or of species outside
    the region (Monoon coffeeoides and Hubera korinti in Sri Lanka, Maasia
    at Pasoh in Peninsular Malaysia) and are not scored; the one named
    Bornean case (thrips on Popowia pisocarpa) is hedged ('apparently').
    Type and figure specimens are in raw/Turner_2014_vouchers.csv (572 type
    rows for 159 species and 114 rows from the 42 figure captions;
    transcribed in one pass and spot-checked only).
identifiers: .na
locations: .na
contexts:
  - context_property: commonness qualifier
    category: entity_context
    var_in: commonness_qualifier
  - context_property: population region
    category: entity_context
    var_in: population_region
  - context_property: entity measured
    category: method_context
    var_in: entity_measured
  - context_property: trait scoring method
    category: method_context
    var_in: trait_scoring_method
traits:
  - var_in: bark_colour
    unit_in: .na
    trait_name: bark_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Outer bark colour from the Bark sentence; inner bark and aromatic bark excluded; compound colours score every word.
  - var_in: bark_texture
    unit_in: .na
    trait_name: bark_texture
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Outer bark surface from the Bark sentence.
  - var_in: flower_carpel_length
    unit_in: unit
    trait_name: flower_carpel_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Carpel length from the Flowers sentence ('carpels 6, c. 3 mm long').
  - var_in: flower_colour
    unit_in: .na
    trait_name: flower_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Living flower or petal colour from the Flowers sentence; outer and inner petals kept apart in entity_measured. Colours on drying, of hairs, of one surface and markings (streaks, stripes, marks) are not scored; compound colours score every word.
  - var_in: flower_fertile_stamens_count
    unit_in: unit
    trait_name: flower_fertile_stamens_count
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Stamen number where a number is printed ('stamens 9--17'); 'stamens many' is not scored.
  - var_in: flower_orientation
    unit_in: .na
    trait_name: flower_orientation
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      'Flowers pendulous', 'nodding' or 'pendent' scored as down.
  - var_in: flower_ovules_per_functional_carpel_count
    unit_in: unit
    trait_name: flower_ovules_per_functional_carpel_count
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Ovule number per carpel ('ovules 2 in each carpel'); 'few' and 'many' not scored.
  - var_in: flower_perianth_merism
    unit_in: unit
    trait_name: flower_perianth_merism
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      'Flowers trimerous' scored as 3, 'dimerous' as 2 (family and genus descriptions).
  - var_in: flower_perianth_symmetry
    unit_in: .na
    trait_name: flower_perianth_symmetry
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family description 'Flowers ... regular and actinomorphic' scored as actinomorphic_general and copied down.
  - var_in: flower_petal_length
    unit_in: unit
    trait_name: flower_petal_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Petal length, the first dimension of 'a x b' or 'a long'; outer petals and inner petals named in entity_measured, petals of one kind left blank (question 4).
  - var_in: flower_scent_production
    unit_in: .na
    trait_name: flower_scent_production
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      'Flowers fragrant' or 'sweet-smelling' scored as scent_produced.
  - var_in: flower_sepal_length
    unit_in: unit
    trait_name: flower_sepal_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Sepal length, the first dimension of 'a x b' or 'a long'.
  - var_in: flower_stamen_length
    unit_in: unit
    trait_name: flower_stamen_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Stamen length from the Flowers sentence ('stamens many, c. 1.5 mm long').
  - var_in: flower_structural_carpels_count
    unit_in: unit
    trait_name: flower_structural_carpels_count
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Number of free carpels where a number is printed ('carpels 6--15'); 'many' not scored.
  - var_in: flower_structural_sex_type
    unit_in: .na
    trait_name: flower_structural_sex_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      'Flowers bisexual' or 'unisexual' from genus and species descriptions; genus values copied down.
  - var_in: flowers_per_inflorescence
    unit_in: unit
    trait_name: flowers_per_inflorescence
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Flower number from 'single-flowered', '1--3-flowered' or '1- or 2-flowered' in the Inflorescences sentence; 'few-' or 'many-flowered' not scored.
  - var_in: fruit_colour
    unit_in: .na
    trait_name: fruit_colour
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Ripe monocarp colour ('green ripening red' -> red; 'dark red when ripe'); colours on drying and markings not scored; entity_measured monocarp (question 1).
  - var_in: fruit_dehiscence
    unit_in: .na
    trait_name: fruit_dehiscence
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Monocarps indehiscent or dehiscent, mostly from genus descriptions; entity_measured monocarp.
  - var_in: fruit_length
    unit_in: unit
    trait_name: fruit_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Monocarp length from the Monocarps sentence; entity_measured monocarp, the fruitlet of the apocarpous fruit (question 1).
  - var_in: fruit_surface_hairs
    unit_in: .na
    trait_name: fruit_surface_hairs
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Monocarp indumentum from the Monocarps sentence; glabrescent and young states not scored; entity_measured monocarp.
  - var_in: fruit_wall_thickness
    unit_in: unit
    trait_name: fruit_wall_thickness
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Monocarp wall or pericarp thickness ('wall c. 1 cm thick'); entity_measured monocarp.
  - var_in: fruit_width
    unit_in: unit
    trait_name: fruit_width
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Monocarp diameter or width from the Monocarps sentence; entity_measured monocarp (question 1).
  - var_in: inflorescence_type
    unit_in: .na
    trait_name: inflorescence_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Inflorescence kind and position from the Inflorescences sentence (fascicle, cyme, raceme, solitary; terminal, axillary).
  - var_in: leaf_apex_shape
    unit_in: .na
    trait_name: leaf_apex_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaf apex from the blade piece; 'blunt' as obtuse, 'acumen' as acuminate.
  - var_in: leaf_arrangement
    unit_in: .na
    trait_name: leaf_arrangement
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      'Leaves distichous' from the Leaves sentence; hair clauses ('scattered hairs') excluded.
  - var_in: leaf_base_shape
    unit_in: .na
    trait_name: leaf_base_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaf base from the blade piece; 'unequal' and 'asymmetric' scored as oblique.
  - var_in: leaf_compoundness
    unit_in: .na
    trait_name: leaf_compoundness
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family description 'Leaves simple', copied down.
  - var_in: leaf_glaucousness
    unit_in: .na
    trait_name: leaf_glaucousness
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      'glaucous beneath' in the Leaves sentence; 'not white or glaucous', 'pale or glaucous', papillae 'giving a glaucous appearance' and 'white beneath when fresh' not scored.
  - var_in: leaf_hairs_adult_leaves
    unit_in: .na
    trait_name: leaf_hairs_adult_leaves
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaf surface indumentum in the first Leaves piece: hairy when a surface is hairy, glabrous when both are; glabrescent, 'glabrous or pubescent' alternatives and hairs confined to the midrib, veins or margin ('glabrous except for hairs along midrib') not scored.
  - var_in: leaf_length
    unit_in: unit
    trait_name: leaf_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Leaf blade length, the first dimension of 'a x b cm' in the blade piece.
  - var_in: leaf_margin
    unit_in: .na
    trait_name: leaf_margin
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      'Leaves ... entire', mostly from genus descriptions.
  - var_in: leaf_phyllotaxis
    unit_in: .na
    trait_name: leaf_phyllotaxis
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Family description 'Leaves ... generally alternate', family rank only.
  - var_in: leaf_shape
    unit_in: .na
    trait_name: leaf_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Leaf blade shape from the blade piece; hyphenated and 'to' shapes score both levels.
  - var_in: leaf_width
    unit_in: unit
    trait_name: leaf_width
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Leaf blade width, the second dimension of 'a x b cm' in the blade piece.
  - var_in: pedicel_length
    unit_in: unit
    trait_name: pedicel_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Flower pedicel length from the Flowers sentence; fruiting pedicels are not scored (question 6).
  - var_in: petiole_length
    unit_in: unit
    trait_name: petiole_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Petiole length from the petiole piece; petiole thickness unmapped.
  - var_in: plant_diameter_breast_height
    unit_in: unit
    trait_name: plant_diameter_breast_height
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Trunk diameter from the habit sentence ('to 50 cm diameter'), as printed (no height of measurement stated).
  - var_in: plant_growth_form
    unit_in: .na
    trait_name: plant_growth_form
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Growth form noun from the habit sentence; treelet scored as tree.
  - var_in: plant_height
    unit_in: unit
    trait_name: plant_height
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Height from the habit sentence ('to 20 m tall').
  - var_in: root_system_type
    unit_in: .na
    trait_name: root_system_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      'sometimes stilt-rooted' in the habit sentence.
  - var_in: seed_height
    unit_in: unit
    trait_name: seed_height
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Seed thickness ('c. 4 mm thick') scored as the shortest seed dimension (question 7).
  - var_in: seed_length
    unit_in: unit
    trait_name: seed_length
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Seed length from the Seeds sentence.
  - var_in: seed_shape
    unit_in: .na
    trait_name: seed_shape
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Seed shape from the Seeds sentence.
  - var_in: seed_surface_reflectivity
    unit_in: .na
    trait_name: seed_surface_reflectivity
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      'shiny' or 'glossy' seeds; colours and surfaces on drying not scored.
  - var_in: seed_surface_texture
    unit_in: .na
    trait_name: seed_surface_texture
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Seed surface from the Seeds sentence (smooth, rugose as rough, wrinkled).
  - var_in: seed_width
    unit_in: unit
    trait_name: seed_width
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Seed diameter, width or 'across' from the Seeds sentence (question 7).
  - var_in: seeds_per_fruit
    unit_in: unit
    trait_name: seeds_per_fruit
    entity_type: species
    value_type: value_type
    basis_of_value: measurement
    replicates: .na
    methods: |
      Seed number per monocarp ('Seeds c. 8 in each monocarp'); entity_measured monocarp (question 1); 'several' and 'many' not scored.
  - var_in: sex_type
    unit_in: .na
    trait_name: sex_type
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      'Monoecious' or 'dioecious' in the habit sentence.
  - var_in: stem_base_form
    unit_in: .na
    trait_name: stem_base_form
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Buttresses named in the habit sentence.
  - var_in: stem_hairs
    unit_in: .na
    trait_name: stem_hairs
    entity_type: species
    value_type: value_type
    basis_of_value: expert_score
    replicates: .na
    methods: |
      Twig indumentum from the Twigs sentence; glabrescent, young and dried states not scored.
